function attrs(pos){let a={},hit=!['SP','RP','CP'].includes(pos)||pos==='Two-Way',pit=['SP','RP','CP','Two-Way'].includes(pos);if(hit)HATTR.forEach(k=>a[k]=rand(42,54));if(pit)PATTR.forEach(k=>a[k]=a[k]??rand(41,53));return a}
function blank(){return{g:0,pa:0,ab:0,h:0,d2:0,d3:0,hr:0,rbi:0,r:0,bb:0,so:0,sb:0,ip:0,er:0,k:0,w:0,l:0,sv:0}}
function prestige(n){const elite=['LSU','Vanderbilt','Texas','Arkansas','Florida','Florida State','Clemson','North Carolina','Virginia','Oregon State','UCLA','Stanford','Tennessee','Georgia','Texas A&M','Mississippi State','Ole Miss','Louisville','TCU','Arizona State'];if(elite.includes(n))return 5;if(['Rutgers','Seton Hall','Duke','Wake Forest','Georgia Tech','Miami','Oklahoma','Oklahoma State','Auburn','Alabama','Kentucky','South Carolina','Coastal Carolina','East Carolina','Notre Dame','Nebraska','Oregon','Arizona'].includes(n))return 4;return rand(1,3)}
function makeCollege(name){let p=prestige(name),roster={};POS.slice(0,12).forEach(pos=>roster[pos]=[rand(58+p*4,70+p*4),rand(55+p*3,67+p*4),rand(52+p*3,64+p*4)].map(x=>clamp(x,45,94)).sort((a,b)=>b-a));return{name,prestige:p,coach:rand(45+p*8,65+p*7),facilities:rand(40+p*9,64+p*7),nil:rand(30+p*10,65+p*7),pipeline:rand(35+p*10,60+p*8),academics:rand(55,96),roster,needs:{},interest:0,stage:'Not Watching',scholarship:0,projectedRole:'No projection',signed:false}}

function fresh(o){let difficulty=o.difficulty||'Realistic';return{version:'0.4',name:o.name||'Alex Morgan',team:o.team,position:o.position,bats:o.bats,throws:o.throws,difficulty,year:'Freshman',age:15,week:1,phase:'regular',attrs:attrs(o.position),dp:10,energy:94,confidence:52,coachTrust:52,coachConfidence:42,academics:74,stress:18,reputation:4,brand:2,followers:180,role:['SP','RP','CP'].includes(o.position)?'Rotation Candidate':'Varsity Starter',lineup:['SP','RP','CP'].includes(o.position)?null:8,stats:blank(),record:{w:0,l:0},seasonGames:20,news:['Your varsity career begins.'],history:[],gameLog:[],traits:[],personality:{WorkEthic:0,Leadership:0,TeamFirst:0,Composure:0},offers:[],offseasonChoices:[],world:{colleges:D1.map(makeCollege),mlb:MLB.map(makeMLB),collegeTop:[],headlines:[],year:1},settings:{injuries:'Normal',energy:'Normal',recruiting:'Preset',stats:'Preset'},created:Date.now()}}
function save(){localStorage.setItem('diamondLegacy04',JSON.stringify(S));if($('#saved'))$('#saved').textContent='Saved'}function load(){let v=localStorage.getItem('diamondLegacy04');if(v){S=JSON.parse(v);launch()}else setup()}
function setup(step=1){let h='';if(step===1)h=`<div class="card hero"><div class="eyebrow">Alpha 0.4</div><div class="title">Start Your Legacy</div><p class="sub">Simple screens. A deeper baseball world underneath.</p><label>Player Name</label><input id="nm" value="${setupDraft.name||''}" placeholder="Alex Morgan"><label>High School</label><select id="tm">${HS.map(x=>`<option>${x}</option>`).join('')}</select><button class="btn" style="margin-top:14px" onclick="step1()">Next</button></div>`;else if(step===2)h=`<div class="card hero"><div class="eyebrow">Player</div><div class="title">Choose Your Position</div><label>Position</label><select id="ps">${POS.map(x=>`<option>${x}</option>`).join('')}</select><div class="grid2"><div><label>Bats</label><select id="bt"><option>Right</option><option>Left</option><option>Switch</option></select></div><div><label>Throws</label><select id="th"><option>Right</option><option>Left</option></select></div></div><button class="btn" style="margin-top:14px" onclick="step2()">Next</button><button class="btn ghost" style="margin-top:8px" onclick="setup(1)">Back</button></div>`;else h=`<div class="card hero"><div class="eyebrow">Difficulty</div><div class="title">How Do You Want to Play?</div>${[['Rookie','Story-focused • faster growth • forgiving'],['Realistic','Balanced • earned progression • recommended'],['Legend','Tough competition • slower rise • less forgiving']].map(x=>`<div class="choice" onclick="start('${x[0]}')"><strong>${x[0]}</strong><span>${x[1]}</span></div>`).join('')}<button class="btn ghost" onclick="setup(2)">Back</button></div>`;$('#setup').innerHTML=h}
function step1(){setupDraft.name=$('#nm').value.trim()||'Alex Morgan';setupDraft.team=$('#tm').value;setup(2)}function step2(){setupDraft.position=$('#ps').value;setupDraft.bats=$('#bt').value;setupDraft.throws=$('#th').value;setup(3)}function start(d){setupDraft.difficulty=d;S=fresh(setupDraft);seedWorld();save();launch()}
function seedWorld(){S.world.colleges.forEach(c=>{c.needs={};POS.slice(0,12).forEach(p=>c.needs[p]=rand(15,100))});S.world.collegeTop=[...S.world.colleges].sort((a,b)=>b.prestige-a.prestige||b.pipeline-a.pipeline).slice(0,25).map(x=>x.name);updateWorld()}
function launch(){$('#setup').classList.add('hidden');$('#game').classList.remove('hidden');$('#nav').classList.remove('hidden');$('#nav').innerHTML=[['home','⌂','Home'],['player','◆','Player'],['recruiting','★','Recruiting'],['world','◎','World'],['history','≡','History']].map((x,i)=>`<button class="${i?'':'on'}" onclick="go('${x[0]}',this)"><b>${x[1]}</b>${x[2]}</button>`).join('');render()}

function hitPlayer(){return !['SP','RP','CP'].includes(S.position)||S.position==='Two-Way'}function pitchPlayer(){return ['SP','RP','CP','Two-Way'].includes(S.position)}function ovr(){let v=Object.values(S.attrs);return Math.round(v.reduce((a,b)=>a+b,0)/v.length)}function avg(){return S.stats.ab?(S.stats.h/S.stats.ab).toFixed(3).replace(/^0/,''):'.000'}function era(){return S.stats.ip?(S.stats.er*9/S.stats.ip).toFixed(2):'0.00'}function cfg(){return CFG[S.difficulty]}

function renderHome(){let next=S.phase==='offseason'?'Offseason Plan':`Week ${S.week} • ${pick(HS.filter(x=>x!==S.team))}`;$('#home').innerHTML=`<div class="card hero"><div class="row"><div><div class="eyebrow">${S.year} • ${S.position}</div><div class="title">${S.name}</div><div class="sub">${S.role} • ${S.team}</div></div><div class="ovr">${ovr()}</div></div><div class="kpis" style="margin-top:12px"><div class="pill"><b>${S.energy}</b><span>Energy</span></div><div class="pill"><b>${S.coachTrust}</b><span>Trust</span></div><div class="pill"><b>${S.coachConfidence}</b><span>Coach Confidence</span></div><div class="pill"><b>${S.dp}</b><span>DP</span></div></div></div><div class="section">Current Season</div><div class="card"><div class="row"><div><b>${S.record.w}-${S.record.l}</b><div class="tiny">Team record</div></div><div style="text-align:right"><b>${hitPlayer()?avg()+' AVG':era()+' ERA'}</b><div class="tiny">${S.stats.g} games</div></div></div><div class="row" style="margin-top:12px"><span class="sub">${next}</span><span class="tag">${S.difficulty}</span></div></div><button class="btn play" style="margin-top:12px" onclick="mainAction()">${S.phase==='offseason'?'Plan Offseason':'Play Week'}</button><div class="section">Career Updates</div><div class="card">${S.news.slice(0,5).map(n=>`<div class="news">${n}</div>`).join('')}</div>`}

function roleChance(c){let depth=c.roster[S.position==='Two-Way'?'SS':S.position]||[75,68,62],me=ovr()+rand(-3,3);if(me>=depth[0]+2)return'Immediate starter';if(me>=depth[1])return'Compete to start';if(me>=depth[2])return'Rotation / bench role';return c.prestige>=4?'Developmental / possible redshirt':'Depth role'}

['Extra Work After Practice',[['Take extra swings',{energy:-6,dp:2,work:1,nextHit:.04}],['Get home and recover',{energy:10,stress:-3}],['Help a teammate',{energy:-3,trust:2,team:1}]]],
['Big Test Tomorrow',[['Study tonight',{academics:4,energy:2,stress:-2}],['Quick review, then sleep',{academics:2,energy:8}],['Ignore it and train',{dp:2,academics:-3,energy:-5}]]],
['Coach Challenges Your Approach',[['Make the adjustment',{coachConfidence:3,nextHit:.03}],['Stick with your style',{confidence:2,independence:1}],['Ask for film work',{dp:1,coachTrust:2}]]],
['Friends Make Weekend Plans',[['Go for a few hours',{social:4,energy:3}],['Stay home and recover',{energy:12,stress:-4}],['Skip it for training',{dp:2,energy:-5,work:1}]]],
['Tough Opponent Ahead',[['Study the pitcher',{nextHit:.05,energy:-2}],['Keep the routine',{confidence:2}],['Train harder',{dp:2,energy:-7}]]],
['Teammate Is Slumping',[['Work with him',{trust:2,team:2,energy:-3}],['Encourage him',{lead:1,confidence:1}],['Focus on yourself',{dp:1}]]],
['Minor Soreness',[['Take a lighter week',{energy:14,nextHit:-.01}],['Play normally',{energy:-4}],['Extra recovery work',{energy:18,dp:-1}]]]
];
function mainAction(){if(S.phase==='offseason')return offseason();let e=Math.random()<.62?pick(EVENTS):null;if(e)return eventSheet(e);simulateWeek({})}
function eventSheet(e){S.pending=e;sheet(`<div class="eyebrow">Weekly Decision</div><div class="title">${e[0]}</div><p class="sub">Choose once, then the games simulate.</p>${e[1].map((x,i)=>`<div class="choice" onclick="resolveEvent(${i})"><strong>${x[0]}</strong><span>${effectText(x[1])}</span></div>`).join('')}`)}
function effectText(o){let z=[];if(o.energy)z.push(`${o.energy>0?'+':''}${o.energy} Energy`);if(o.dp)z.push(`${o.dp>0?'+':''}${o.dp} DP`);if(o.academics)z.push(`${o.academics>0?'+':''}${o.academics} Academics`);if(o.trust)z.push(`+${o.trust} Trust`);if(o.nextHit)z.push('Next-game effect');return z.join(' • ')||'Personality effect'}
function resolveEvent(i){let o=S.pending[1][i][1];apply(o);S.nextHit=o.nextHit||0;S.pending=null;closeSheet();simulateWeek(o)}function apply(o){S.energy=clamp(S.energy+(o.energy||0),0,100);S.dp=Math.max(0,S.dp+(o.dp||0));S.academics=clamp(S.academics+(o.academics||0),0,100);S.coachTrust=clamp(S.coachTrust+(o.trust||0),0,100);S.coachConfidence=clamp(S.coachConfidence+(o.coachConfidence||0),0,100);S.confidence=clamp(S.confidence+(o.confidence||0),0,100);S.stress=clamp(S.stress+(o.stress||0),0,100);if(o.work)S.personality.WorkEthic+=o.work;if(o.team)S.personality.TeamFirst+=o.team;if(o.lead)S.personality.Leadership+=o.lead}
function simulateWeek(){let c=cfg(),games=2,hitLine={ab:0,h:0,hr:0,rbi:0},pitchLine={ip:0,er:0,k:0},wins=0,starsTotal=0;for(let g=0;g<games;g++){let opp=rand(55,82),win=Math.random()<clamp(.48+(ovr()-opp)/120,.2,.8);if(win)wins++;let stars=2;if(hitPlayer()){let ab=rand(3,5),skill=((S.attrs.Contact||45)*.45+(S.attrs.Vision||45)*.2+(S.attrs.Discipline||45)*.1+(S.attrs.Power||45)*.1)/100;let energyAdj=(S.energy-75)/500,yearPenalty={Freshman:-.09,Sophomore:-.055,Junior:-.025,Senior:0}[S.year];let p=clamp(.19+skill*.22+yearPenalty+c.stat+energyAdj+(S.nextHit||0)-(opp-65)/500,.08,.48),h=0,hr=0;for(let i=0;i<ab;i++)if(Math.random()<p){h++;if(Math.random()<clamp((S.attrs.Power||40)/550-.05,0.01,.16))hr++}let rbi=Math.min(rand(0,h+hr),4);Object.assign(hitLine,{ab:hitLine.ab+ab,h:hitLine.h+h,hr:hitLine.hr+hr,rbi:hitLine.rbi+rbi});stars+=h>=2?1:0;stars+=hr?1:0;S.stats.g++;S.stats.pa+=ab;S.stats.ab+=ab;S.stats.h+=h;S.stats.hr+=hr;S.stats.rbi+=rbi;S.stats.so+=Math.max(0,ab-h-rand(0,1))}if(pitchPlayer()){let ip=S.position==='RP'||S.position==='CP'?rand(1,2):rand(4,7),ability=((S.attrs.Velocity||45)+(S.attrs.Control||45)+(S.attrs.Movement||45))/3,er=Math.max(0,Math.round(ip*(.8-(ability/130)+opp/220)+rand(-1,1))),k=Math.max(0,Math.round(ip*(ability/75)+rand(-2,1)));pitchLine.ip+=ip;pitchLine.er+=er;pitchLine.k+=k;S.stats.g++;S.stats.ip+=ip;S.stats.er+=er;S.stats.k+=k;stars+=er<=1?1:0;stars+=k>=6?1:0}starsTotal+=clamp(stars,1,5)}S.record.w+=wins;S.record.l+=games-wins;let stars=Math.round(starsTotal/games),dp=Math.max(1,Math.round((stars-1)*c.dev));S.dp+=dp;let workload=(pitchPlayer()?8:4)+(S.position==='C'?3:0)+(S.position==='Two-Way'?5:0);S.energy=clamp(S.energy-workload+c.recovery+rand(-4,3),0,100);S.confidence=clamp(S.confidence+(stars-3)*2,20,100);S.coachConfidence=clamp(S.coachConfidence+(stars-3)+ (wins===2?1:0),0,100);S.nextHit=0;S.week++;updateRecruit(stars);updateCoach();updateWorld();let done=S.week>10;weekRecap(stars,hitLine,pitchLine,dp,wins,done)}
function updateCoach(){if(S.coachConfidence>68&&hitPlayer()&&S.lineup>1&&S.stats.ab>=30&&Number(avg())>=.280){S.lineup--;S.role=S.lineup<=3?'Top-of-Order Starter':'Varsity Starter';S.news.unshift(`Coach moves you to No. ${S.lineup} in the lineup.`);S.coachConfidence-=6}if(S.coachConfidence>82&&S.year!=='Freshman'&&!S.role.includes('Captain')){S.role+=' • Team Leader';S.news.unshift('Coach gives you a larger leadership role.');S.coachConfidence-=10}}
function potential(){let young={Freshman:13,Sophomore:9,Junior:5,Senior:2}[S.year];return clamp(ovr()+young+Math.round(S.personality.WorkEthic/3),45,98)}
function updateRecruit(stars){let pos=S.position==='Two-Way'?'SS':S.position,quality=ovr()*.45+potential()*.25+S.academics*.08+S.reputation*.1+stars*3;S.world.colleges.forEach(c=>{let need=c.needs[pos]||50,fit=quality+need*.18-c.prestige*5+rand(-8,8);if(S.year==='Freshman')fit-=18;if(fit>56){c.interest=clamp(c.interest+Math.round((fit-50)/9*cfg().recruit),0,100);c.stage=c.interest>=82?'Offer':c.interest>=62?'Visit / Priority':c.interest>=38?'Scouting':'Watching';if(c.stage==='Offer'&&!c.scholarship){c.scholarship=clamp(Math.round(25+(quality-55)*2+need/5-c.prestige*5),15,100);S.news.unshift(`${c.name} offers ${c.scholarship}% and projects: ${roleChance(c)}.`)}}});S.reputation=clamp(S.reputation+Math.max(0,stars-2),0,100);S.brand=clamp(S.brand+(stars>=4?1:0),0,100);S.followers+=stars>=4?rand(80,450):rand(5,40);updateMLB()}
function updateMLB(){let pos=S.position==='Two-Way'?'SS':S.position,cur=ovr(),pot=potential();S.world.mlb.forEach(t=>{let need=t.needs[pos],score=cur*.32+pot*.42+need*.16+S.reputation*.1+rand(-7,7);if(S.year==='Freshman')score-=16;if(score>58){t.interest=clamp(t.interest+Math.round((score-52)/7),0,100);t.grade=score>82?'A':score>74?'B+':score>66?'B':'C+';t.note=`${t.philosophy} club • ${need>70?'High':need>45?'Moderate':'Low'} organizational need at ${pos} • Current ${cur}, potential ${pot}`}})}
function updateWorld(){let top=[...S.world.colleges].sort((a,b)=>(b.prestige*15+b.pipeline+rand(0,20))-(a.prestige*15+a.pipeline+rand(0,20))).slice(0,5);S.world.headlines=[`${top[0].name} holds the No. 1 national profile.`,`${pick(top).name} lands a high-upside ${pick(POS.slice(0,9))}.`,`${pick(S.world.colleges).name} identifies ${pick(POS.slice(0,9))} as its top roster need.`,`${pick(MLB)} expands scouting coverage in the Northeast.`]}
function weekRecap(stars,h,p,dp,wins,done){sheet(`<div class="eyebrow">Week ${S.week-1} Recap</div><div class="stars">${[1,2,3,4,5].map(i=>`<span class="${i<=stars?'lit':''}">★</span>`).join('')}</div><div class="title">${wins===2?'Perfect Week':wins===1?'Split the Week':'Tough Week'}</div><p class="sub">${hitPlayer()?`${h.h}-for-${h.ab} • ${h.hr} HR • ${h.rbi} RBI`:''}${hitPlayer()&&pitchPlayer()?'<br>':''}${pitchPlayer()?`${p.ip} IP • ${p.er} ER • ${p.k} K`:''}</p><div class="card"><div class="row"><span>Development Points</span><b class="good">+${dp}</b></div><div class="row"><span>Energy</span><b>${S.energy}</b></div><div class="row"><span>Season Average</span><b>${hitPlayer()?avg():era()}</b></div></div><button class="btn" style="margin-top:12px" onclick="closeSheet();${done?'endSeason()':'render()'}">${done?'Finish Season':'Continue'}</button>`)}
function endSeason(){S.history.push({year:S.year,record:{...S.record},avg:hitPlayer()?avg():null,era:pitchPlayer()?era():null,ovr:ovr()});S.phase='offseason';S.energy=100;S.news.unshift(`${S.year} season ends at ${S.record.w}-${S.record.l}.`);render()}
const OFF=[['Hitting Development','Contact and plate approach'],['Power & Strength','Power and durability'],['Defense','Fielding, arm and position polish'],['Speed & Athleticism','Speed and energy recovery'],['Summer Baseball','Development plus recruiting exposure'],['Showcase Circuit','Major exposure and brand growth'],['Academics','Academic profile and recruiting fit'],['Recovery','Energy, stress and durability']];
function offseason(){sheet(`<div class="eyebrow">One-Page Offseason</div><div class="title">Choose 3 Priorities</div><p class="sub">Pick three. The entire offseason simulates in one recap.</p><div id="offopts">${OFF.map((x,i)=>`<div class="choice" data-i="${i}" onclick="toggleOff(this,${i})"><strong>${x[0]}</strong><span>${x[1]}</span></div>`).join('')}</div><button class="btn" onclick="runOffseason()">Simulate Offseason</button>`)}function toggleOff(el,i){let a=S.offseasonChoices||[];if(a.includes(i)){a=a.filter(x=>x!==i);el.style.borderColor=''}else if(a.length<3){a.push(i);el.style.borderColor='var(--gold)'}S.offseasonChoices=a}
function runOffseason(){if((S.offseasonChoices||[]).length!==3)return alert('Choose exactly 3 priorities.');let gains=[];S.offseasonChoices.forEach(i=>{let n=OFF[i][0];if(i===0){inc('Contact',3);inc('Vision',2);gains.push('+Contact / Vision')}if(i===1){inc('Power',3);inc('Durability',2);gains.push('+Power / Durability')}if(i===2){inc('Fielding',3);inc('Arm',2);gains.push('+Defense')}if(i===3){inc('Speed',3);S.energy=100;gains.push('+Speed')}if(i===4){S.dp+=7;S.reputation+=5;gains.push('+7 DP / exposure')}if(i===5){S.reputation+=10;S.brand+=4;S.followers+=rand(700,2200);gains.push('+Showcase exposure')}if(i===6){S.academics=clamp(S.academics+10,0,100);gains.push('+10 Academics')}if(i===7){inc('Durability',3);S.energy=100;S.stress=5;gains.push('+Recovery')}});S.offseasonChoices=[];let yrs=['Freshman','Sophomore','Junior','Senior'],idx=yrs.indexOf(S.year);if(idx===3){closeSheet();return highSchoolEnd()}S.year=yrs[idx+1];S.age++;S.week=1;S.phase='regular';S.stats=blank();S.record={w:0,l:0};S.energy=100;S.confidence=58;S.dp+=6;closeSheet();sheet(`<div class="eyebrow">Offseason Complete</div><div class="title">${S.year} Year Begins</div>${gains.map(x=>`<div class="news">${x}</div>`).join('')}<button class="btn" style="margin-top:12px" onclick="closeSheet();render()">Opening Week</button>`)}function inc(k,v){if(S.attrs[k]!=null)S.attrs[k]=clamp(S.attrs[k]+v,0,99)}
function collegeDetail(name){let c=S.world.colleges.find(x=>x.name===name);sheet(`<div class="eyebrow">D1 Program</div><div class="title">${c.name}</div><div class="grid2"><div class="pill"><b>${'★'.repeat(c.prestige)}</b><span>Prestige</span></div><div class="pill"><b>${c.nil}</b><span>NIL Strength</span></div><div class="pill"><b>${c.pipeline}</b><span>MLB Pipeline</span></div><div class="pill"><b>${c.academics}</b><span>Academics</span></div></div><div class="section">Your Fit</div><div class="card"><div class="row"><span>Interest</span><b>${c.interest}%</b></div><div class="row"><span>Projected role</span><b>${roleChance(c)}</b></div><div class="row"><span>Scholarship</span><b>${c.scholarship?c.scholarship+'%':'None'}</b></div><div class="row"><span>Position need</span><b>${c.needs[S.position==='Two-Way'?'SS':S.position]||50}</b></div></div><button class="btn secondary" style="margin-top:12px" onclick="closeSheet()">Close</button>`)}
function settings(){sheet(`<div class="eyebrow">Career Settings</div><div class="title">Difficulty</div>${['Rookie','Realistic','Legend'].map(x=>`<div class="choice" onclick="S.difficulty='${x}';closeSheet();render()"><strong>${x}${S.difficulty===x?' ✓':''}</strong><span>${x==='Rookie'?'Faster growth and forgiving competition':x==='Realistic'?'Balanced and recommended':'Slower development and tougher competition'}</span></div>`).join('')}<div class="notice">Changing difficulty affects future games and development. It does not rewrite completed stats.</div>`)}
function highSchoolEnd(){sheet(`<div class="eyebrow">High School Complete</div><div class="title">Choose Your Next Chapter</div><p class="sub">The college and MLB worlds have been evolving since your freshman year.</p><div class="notice">College career gameplay is planned for Alpha 0.5. Your complete universe is already stored in this save.</div><button class="btn secondary" style="margin-top:12px" onclick="closeSheet();render()">Return</button>`)}
function sheet(h){$('#modal').innerHTML=`<div class="modal"><div class="sheet">${h}</div></div>`}function closeSheet(){$('#modal').innerHTML=''}function resetGame(){if(confirm('Delete this Alpha 0.4 career?')){localStorage.removeItem('diamondLegacy04');location.reload()}}load();
</script></body></html>
