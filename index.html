function currentHat(){if(S.draft&&S.draft.signed)return{label:initials(S.draft.team),color:hashColor(S.draft.team)};if(S.committed)return{label:initials(S.committed),color:hashColor(S.committed)};return{label:initials(S.team),color:'#173d58'}}
function avatarSVG(size=88){let h=currentHat(),a=S.avatar||{skin:'#b97850',hair:'#21160f',style:'Short'};return `<svg viewBox="0 0 100 100" width="${size}" height="${size}" aria-label="Player avatar"><rect width="100" height="100" fill="#0a1b23"/><path d="M18 100 Q23 70 50 68 Q77 70 82 100" fill="${h.color}"/><circle cx="50" cy="45" r="25" fill="${a.skin}"/><path d="M27 42 Q29 14 50 15 Q74 16 74 43 Q63 28 29 39" fill="${a.hair}"/><circle cx="41" cy="47" r="2"/><circle cx="59" cy="47" r="2"/><path d="M42 58 Q50 63 58 58" fill="none" stroke="#532d25" stroke-width="2" stroke-linecap="round"/><path d="M22 29 Q50 10 79 30 L76 39 Q49 28 25 40Z" fill="${h.color}"/><path d="M72 34 Q88 36 91 42 Q76 43 63 39" fill="${h.color}"/><text x="50" y="32" fill="white" text-anchor="middle" font-size="11" font-weight="900">${h.label}</text></svg>`}
function attrCost(v){return v>=85?7:v>=75?5:v>=60?3:2}
function careerGoal(){if(S.path!=='High School')return S.path==='College'?'Win the College World Series and improve your draft stock.':S.path==='JUCO'?'Earn a transfer or another draft opportunity.':'Reach the Major Leagues.';if(S.year==='Senior')return S.combineInvite?'Win a state title and prepare for the Draft Combine.':'Win a state title and earn a Draft Combine invitation.';return 'Develop into a top recruit and chase a state championship.'}
function addMilestone(key,title,detail){if(S.milestones.some(x=>x.key===key))return false;let m={key,title,detail,year:S.year,week:S.week,time:Date.now()};S.milestones.unshift(m);S.news.unshift(`🏆 ${title}${detail?' — '+detail:''}`);return true}
function checkMilestones(){let c=S.careerStats||S.stats;if(c.h>=1)addMilestone('first-hit','First Varsity Hit',`${S.year} year`);if(c.hr>=1)addMilestone('first-hr','First Varsity Home Run',`${S.year} year`);[10,25,50,100,150,200].forEach(n=>{if(c.h>=n)addMilestone(`hit-${n}`,`${n} Career Hits`,`${S.team}`)});[10,25,50].forEach(n=>{if(c.hr>=n)addMilestone(`hr-${n}`,`${n} Career Home Runs`,`${S.team}`)});if(S.world.colleges.some(c=>c.scholarship))addMilestone('first-offer','First Division I Offer',S.world.colleges.find(c=>c.scholarship)?.name||'');if(S.showcases.length)addMilestone('first-showcase','First Showcase Invitation',S.showcases[0].name);if(S.combineInvite)addMilestone('combine','MLB Draft Combine Invitation','One of the top players in the class')}
function addCareer(line){let c=S.careerStats;for(let k in line)if(typeof line[k]==='number')c[k]=(c[k]||0)+line[k]}

function render(){if(!S)return;renderHome();renderPlayer();renderRecruit();renderWorld();renderHistory();save()}
function renderHome(){let next=S.phase==='offseason'?'Offseason Plan':`Week ${S.week} • ${pick(HS.filter(x=>x!==S.team))}`;$('#home').innerHTML=`<div class="card hero"><div class="avatarWrap"><div class="avatar">${avatarSVG()}</div><div style="flex:1"><div class="eyebrow">${S.year} • ${S.position}</div><div class="title">${S.name}</div><div class="sub">${S.role} • ${S.team}</div></div><div class="ovr">${ovr()}</div></div><div class="kpis" style="margin-top:12px"><div class="pill"><b>${S.energy}</b><span>Energy</span></div><div class="pill"><b>${S.coachTrust}</b><span>Trust</span></div><div class="pill"><b>${S.coachConfidence}</b><span>Coach Confidence</span></div><div class="pill"><b>${S.dp}</b><span>DP</span></div></div></div><div class="section">Career Goal</div><div class="card goal"><b>${careerGoal()}</b><div class="tiny" style="margin-top:5px">Favorite college: ${S.favoriteCollege} • Favorite MLB team: ${S.favoriteMLB}</div></div><div class="section">Current Season</div><div class="card"><div class="row"><div><b>${S.record.w}-${S.record.l}</b><div class="tiny">Team record • ${S.teamQuality} team rating</div></div><div style="text-align:right"><b>${hitPlayer()?avg()+' AVG':era()+' ERA'}</b><div class="tiny">${S.stats.g} games</div></div></div><div class="meter"><div class="fill" style="width:${S.teamQuality}%"></div></div><div class="row" style="margin-top:12px"><span class="sub">${next}</span><span class="tag">${S.difficulty}</span></div></div><button class="btn play" style="margin-top:12px" onclick="mainAction()">${S.phase==='offseason'?'Plan Offseason':'Play Week'}</button><div class="section">Career Updates</div><div class="card">${S.news.slice(0,6).map(n=>`<div class="news">${n}</div>`).join('')}</div>`}
function renderPlayer(){let toward=Math.round(Object.values(S.attrProgress||{}).reduce((a,b)=>a+b,0)/Math.max(1,Object.keys(S.attrs).length));$('#player').innerHTML=`<div class="card hero"><div class="avatarWrap"><div class="avatar">${avatarSVG()}</div><div><div class="eyebrow">Development</div><div class="title">${ovr()} OVR</div><p class="sub">${S.dp} DP available • roughly ${toward} attribute progress banked</p></div></div></div><div class="section">Last DP Earned</div><div class="card">${S.lastDP&&S.lastDP.items.length?S.lastDP.items.map(x=>`<div class="row"><span>${x[0]}</span><b class="good">+${x[1]}</b></div>`).join(''):`<p class="sub">Play a week to see exactly where your DP came from.</p>`}${S.lastDP&&S.lastDP.total?`<div class="row" style="margin-top:8px;border-top:1px solid #ffffff15;padding-top:8px"><strong>Total</strong><b>+${S.lastDP.total} DP</b></div>`:''}</div><div class="section">Attributes</div><div class="grid2">${Object.entries(S.attrs).map(([k,v])=>{let cost=attrCost(v),prog=(S.attrProgress&&S.attrProgress[k])||0;return`<div class="pill"><div class="row"><div><b>${v}</b><span>${k}</span></div><button class="btn small secondary" style="width:auto" onclick="upgrade('${k}')">Train</button></div><div class="progressLine"><i style="width:${prog/cost*100}%"></i></div><div class="cost">${prog}/${cost} progress to ${v+1} • 1 DP per training</div></div>`}).join('')}</div><div class="section">Identity</div><div class="card"><div class="row"><span>Role</span><b>${S.role}</b></div><div class="row"><span>Confidence</span><b>${S.confidence}</b></div><div class="row"><span>Brand</span><b>${S.brand}</b></div><div class="row"><span>Followers</span><b>${S.followers.toLocaleString()}</b></div></div>`}
function roleChance(c){let depth=c.roster[S.position==='Two-Way'?'SS':S.position]||[75,68,62],me=ovr()+rand(-3,3);if(me>=depth[0]+2)return'Immediate starter';if(me>=depth[1])return'Compete to start';if(me>=depth[2])return'Rotation / bench role';return c.prestige>=4?'Developmental / possible redshirt':'Depth role'}
function renderRecruit(){let active=S.world.colleges.filter(c=>c.interest>0).sort((a,b)=>b.interest-a.interest).slice(0,12),opps=S.showcases||[];$('#recruiting').innerHTML=`<div class="card hero"><div class="eyebrow">Recruiting</div><div class="title">${stageSummary()}</div><p class="sub">Showcases lead to college attention. Offers depend on production, potential, academics, position need and playing-time fit.</p></div><div class="section">Invitations & Opportunities</div>${opps.length?opps.slice(0,4).map(o=>`<div class="school opportunity"><div class="row"><strong>${o.name}</strong><span class="tag">${o.status}</span></div><div class="meta">${o.level} • ${o.detail}</div></div>`).join(''):`<div class="card"><p class="sub">No invitations yet. Rookie mode makes regional opportunities more likely as your reputation grows.</p></div>`}<div class="section">Schools</div>${active.length?active.map(c=>schoolCard(c)).join(''):`<div class="card"><p class="sub">No active D1 interest yet. Local showcases and sustained production should come first.</p></div>`}<div class="section">NIL Foundation</div><div class="card"><div class="row"><span>Brand value</span><b>${S.brand}/100</b></div><div class="row"><span>Followers</span><b>${S.followers.toLocaleString()}</b></div><p class="tiny">Recognition carries into college NIL opportunities.</p></div>`}
function schoolCard(c){return`<div class="school ${c.name===S.favoriteCollege?'fav':''}" onclick="collegeDetail('${c.name.split("'").join("\\'")}')"><div class="row"><strong>${c.name}</strong><span>${'★'.repeat(c.prestige)}</span></div><div class="meta">${c.stage} • ${c.scholarship?c.scholarship+'% scholarship':'No offer'} • ${roleChance(c)}</div><div class="meter"><div class="fill" style="width:${c.interest}%"></div></div></div>`}
function stageSummary(){let n=S.world.colleges.filter(c=>c.stage==='Offer').length;if(n)return`${n} D1 Offer${n===1?'':'s'}`;let a=S.world.colleges.filter(c=>c.interest>0).length;return a?`${a} Programs Watching`:'Building Your Profile'}
function renderWorld(){let mlb=(['Junior','Senior'].includes(S.year)||S.combineInvite)?S.world.mlb.filter(t=>t.interest>0).sort((a,b)=>b.interest-a.interest).slice(0,6):[];$('#world').innerHTML=`<div class="card hero"><div class="eyebrow">Living Baseball World</div><div class="title">${S.world.colleges.length} D1 Programs</div><p class="sub">College rosters, needs and prestige are already shaping your future path. All 30 MLB organizations are developing independent scouting opinions.</p></div><div class="section">College Headlines</div><div class="card">${S.world.headlines.slice(0,5).map(x=>`<div class="news">${x}</div>`).join('')}</div><div class="section">Pro Scout Attention</div>${mlb.length?mlb.map(t=>`<div class="school ${t.name===S.favoriteMLB?'fav':''}"><div class="row"><strong>${t.name}</strong><span class="tag">${t.grade}</span></div><div class="meta">${t.note}</div></div>`).join(''):`<div class="card"><p class="sub">MLB organizations are tracking the class quietly. Public reports usually begin later in high school.</p></div>`}`}
function renderHistory(){$('#history').innerHTML=`<div class="card hero"><div class="eyebrow">Career</div><div class="title">Your Legacy</div><p class="sub">Firsts, milestones, championships and major decisions.</p></div><div class="section">Milestones</div>${S.milestones&&S.milestones.length?`<div class="card">${S.milestones.map(m=>`<div class="milestone"><b>🏆 ${m.title}</b><span class="tiny">${m.detail||''} • ${m.year}</span></div>`).join('')}</div>`:`<div class="card"><p class="sub">Your first milestone is still ahead.</p></div>`}<div class="section">Seasons</div>${S.history.length?S.history.map(h=>`<div class="school"><div class="row"><strong>${h.year}</strong><b>${h.record.w}-${h.record.l}</b></div><div class="meta">${h.avg?`${h.avg} AVG`:h.era+' ERA'} • ${h.ovr} OVR • Team ${h.teamQuality||'—'}${h.champion?' • STATE CHAMPION':''}</div></div>`).join(''):`<div class="card"><p class="sub">Your first season is underway.</p></div>`}<div class="section">Settings</div><button class="btn secondary" onclick="settings()">Difficulty & Career Settings</button><button class="btn ghost" style="margin-top:8px" onclick="resetGame()">Start New Career</button>`}
function upgrade(k){if(S.dp<1)return alert('You need 1 DP to train.');if(!S.attrProgress)S.attrProgress={};let cost=attrCost(S.attrs[k]);S.dp--;S.attrProgress[k]=(S.attrProgress[k]||0)+1;if(S.attrProgress[k]>=cost){S.attrProgress[k]=0;S.attrs[k]++;S.news.unshift(`${k} improves to ${S.attrs[k]}.`)}render()}
const EVENTS=[
['Extra Work After Practice',[['Take extra swings',{energy:-6,dp:2,work:1,nextHit:.04}],['Get home and recover',{energy:10,stress:-3}],['Help a teammate',{energy:-3,trust:2,team:1}]]],
['Big Test Tomorrow',[['Study tonight',{academics:4,energy:2,stress:-2}],['Quick review, then sleep',{academics:2,energy:8}],['Ignore it and train',{dp:2,academics:-3,energy:-5}]]],

['Friends Make Weekend Plans',[['Go for a few hours',{social:4,energy:3}],['Stay home and recover',{energy:12,stress:-4}],['Skip it for training',{dp:2,energy:-5,work:1}]]],

];
function mainAction(){if(S.phase==='transition')return alert('Your next chapter is saved. College, JUCO and pro gameplay comes in the next career build.');if(S.phase==='offseason')return offseason();let e=Math.random()<.62?pick(EVENTS):null;if(e)return eventSheet(e);simulateWeek({})}
function eventSheet(e){S.pending=e;sheet(`<div class="eyebrow">Weekly Decision</div><div class="title">${e[0]}</div><p class="sub">Choose once, then the games simulate.</p>${e[1].map((x,i)=>`<div class="choice" onclick="resolveEvent(${i})"><strong>${x[0]}</strong><span>${effectText(x[1])}</span></div>`).join('')}`)}
function effectText(o){let z=[];if(o.energy)z.push(`${o.energy>0?'+':''}${o.energy} Energy`);if(o.dp)z.push(`${o.dp>0?'+':''}${o.dp} DP`);if(o.academics)z.push(`${o.academics>0?'+':''}${o.academics} Academics`);if(o.trust)z.push(`+${o.trust} Trust`);if(o.nextHit)z.push('Next-game effect');return z.join(' • ')||'Personality effect'}
function resolveEvent(i){let o=S.pending[1][i][1];apply(o);S.nextHit=o.nextHit||0;S.pending=null;closeSheet();simulateWeek(o)}function apply(o){S.energy=clamp(S.energy+(o.energy||0),0,100);S.dp=Math.max(0,S.dp+(o.dp||0));S.academics=clamp(S.academics+(o.academics||0),0,100);S.coachTrust=clamp(S.coachTrust+(o.trust||0),0,100);S.coachConfidence=clamp(S.coachConfidence+(o.coachConfidence||0),0,100);S.confidence=clamp(S.confidence+(o.confidence||0),0,100);S.stress=clamp(S.stress+(o.stress||0),0,100);if(o.work)S.personality.WorkEthic+=o.work;if(o.team)S.personality.TeamFirst+=o.team;if(o.lead)S.personality.Leadership+=o.lead}
function simulateWeek(){let c=cfg(),games=2,hitLine={g:0,pa:0,ab:0,h:0,d2:0,d3:0,hr:0,rbi:0,r:0,bb:0,so:0,sb:0},pitchLine={g:0,ip:0,er:0,k:0},wins=0,starsTotal=0;for(let g=0;g<games;g++){let opp=rand(54,84),playerImpact=(ovr()-55)*.12,teamEdge=(S.teamQuality-opp)*.7,winP=clamp(.5+(teamEdge+playerImpact)/100,.15,.85),win=Math.random()<winP;if(win)wins++;let stars=2;if(hitPlayer()){let ab=rand(3,5),skill=((S.attrs.Contact||45)*.45+(S.attrs.Vision||45)*.2+(S.attrs.Discipline||45)*.12+(S.attrs.Power||45)*.08)/100;let energyAdj=(S.energy-75)/650,yearPenalty={Freshman:-.07,Sophomore:-.045,Junior:-.02,Senior:0}[S.year];let p=clamp(.145+skill*.23+yearPenalty+c.stat+energyAdj+(S.nextHit||0)-(opp-65)/430,.07,.42),h=0,hr=0,d2=0;for(let i=0;i<ab;i++)if(Math.random()<p){h++;let xb=Math.random();if(xb<clamp((S.attrs.Power||40)/700-.04,.005,.11))hr++;else if(xb<.22)d2++}let rbi=Math.min(rand(0,h+hr),4),so=Math.max(0,ab-h-rand(0,1));Object.assign(hitLine,{g:hitLine.g+1,pa:hitLine.pa+ab,ab:hitLine.ab+ab,h:hitLine.h+h,d2:hitLine.d2+d2,hr:hitLine.hr+hr,rbi:hitLine.rbi+rbi,so:hitLine.so+so});stars+=h>=2?1:0;stars+=hr?1:0}if(pitchPlayer()){let ip=S.position==='RP'||S.position==='CP'?rand(1,2):rand(4,7),ability=((S.attrs.Velocity||45)+(S.attrs.Control||45)+(S.attrs.Movement||45))/3,er=Math.max(0,Math.round(ip*(.78-(ability/135)+opp/235)+rand(-1,1))),k=Math.max(0,Math.round(ip*(ability/82)+rand(-2,1)));pitchLine.g++;pitchLine.ip+=ip;pitchLine.er+=er;pitchLine.k+=k;stars+=er<=1?1:0;stars+=k>=6?1:0}starsTotal+=clamp(stars,1,5)}for(let k in hitLine)S.stats[k]=(S.stats[k]||0)+hitLine[k];for(let k in pitchLine)S.stats[k]=(S.stats[k]||0)+pitchLine[k];addCareer(hitLine);addCareer(pitchLine);S.record.w+=wins;S.record.l+=games-wins;let stars=Math.round(starsTotal/games),items=[['Game performance',Math.max(1,stars-1)]];if(wins===2)items.push(['Team sweep',1]);if(S.difficulty==='Rookie')items.push(['Rookie development bonus',1]);let baseDP=items.reduce((a,x)=>a+x[1],0),dp=Math.max(1,Math.round(baseDP*c.dev));if(dp>baseDP)items.push(['Difficulty development boost',dp-baseDP]);S.dp+=dp;S.lastDP={total:dp,items};let workload=(pitchPlayer()?7:3)+(S.position==='C'?2:0)+(S.position==='Two-Way'?4:0);S.energy=clamp(S.energy-workload+c.recovery+rand(-3,4),0,100);S.confidence=clamp(S.confidence+(stars-3)*2,20,100);S.coachConfidence=clamp(S.coachConfidence+(stars-3)+(wins===2?1:0),0,100);S.nextHit=0;S.week++;updateRecruit(stars);updateCoach();updateWorld();checkMilestones();let done=S.week>10;weekRecap(stars,hitLine,pitchLine,dp,wins,done)}
function updateCoach(){if(S.coachConfidence>68&&hitPlayer()&&S.lineup>1&&S.stats.ab>=30&&Number(avg())>=.280){S.lineup--;S.role=S.lineup<=3?'Top-of-Order Starter':'Varsity Starter';S.news.unshift(`Coach moves you to No. ${S.lineup} in the lineup.`);S.coachConfidence-=6}if(S.coachConfidence>82&&S.year!=='Freshman'&&!S.role.includes('Captain')){S.role+=' • Team Leader';S.news.unshift('Coach gives you a larger leadership role.');S.coachConfidence-=10}}
function potential(){let young={Freshman:13,Sophomore:9,Junior:5,Senior:2}[S.year];return clamp(ovr()+young+Math.round(S.personality.WorkEthic/3),45,98)}
function updateRecruit(stars){let pos=S.position==='Two-Way'?'SS':S.position,quality=ovr()*.43+potential()*.22+S.academics*.08+S.reputation*.12+stars*3,yearBoost={Freshman:-18,Sophomore:-7,Junior:7,Senior:12}[S.year];if(!S.showcases)S.showcases=[];let inviteChance=(S.reputation+ovr()+stars*8+yearBoost+(S.difficulty==='Rookie'?22:0))/260;if(Math.random()<inviteChance&&S.showcases.length<5){let level=S.year==='Freshman'?'Local':S.year==='Sophomore'?'Regional':S.reputation>55?'National':'Regional',name=level==='Local'?`${S.team.split(' ')[0]} Prospect Camp`:level==='Regional'?'Northeast Underclass Showcase':pick(['Perfect Game National Showcase','Area Code Games Tryout','East Coast Pro Showcase']);if(!S.showcases.some(x=>x.name===name)){S.showcases.unshift({name,level,status:'Invited',detail:`College coaches from ${rand(8,35)} programs expected`});S.reputation=clamp(S.reputation+4,0,100);S.news.unshift(`Showcase invite: ${name}.`)}}S.world.colleges.forEach(c=>{let need=c.needs[pos]||50,favorite=c.name===S.favoriteCollege?5:0,fit=quality+need*.17-c.prestige*4.5+yearBoost+favorite+S.showcases.length*2+rand(-7,7);if(fit>51){c.interest=clamp(c.interest+Math.max(1,Math.round((fit-46)/8*cfg().recruit)),0,100);let canOffer=['Junior','Senior'].includes(S.year)||(S.year==='Sophomore'&&quality>78);c.stage=c.interest>=82&&canOffer?'Offer':c.interest>=62?'Visit / Priority':c.interest>=35?'Scouting':'Watching';if(c.stage==='Offer'&&!c.scholarship){c.scholarship=clamp(Math.round(25+(quality-55)*2+need/5-c.prestige*4),15,100);S.news.unshift(`${c.name} offers ${c.scholarship}% and projects: ${roleChance(c)}.`)}}});S.reputation=clamp(S.reputation+Math.max(0,stars-2),0,100);S.brand=clamp(S.brand+(stars>=4?1:0),0,100);S.followers+=stars>=4?rand(80,450):rand(5,40);if(S.year==='Senior'&&!S.combineInvite&&quality+S.reputation*.25>82){S.combineInvite=true;S.news.unshift('You receive an invitation to the MLB Draft Combine.')}updateMLB()}
function updateMLB(){let pos=S.position==='Two-Way'?'SS':S.position,cur=ovr(),pot=potential(),visible=['Junior','Senior'].includes(S.year)||S.combineInvite;S.world.mlb.forEach(t=>{let need=t.needs[pos],fav=t.name===S.favoriteMLB?3:0,score=cur*.30+pot*.40+need*.17+S.reputation*.11+fav+rand(-6,6);if(S.year==='Freshman')score-=22;if(S.year==='Sophomore')score-=12;if(score>60){t.interest=clamp(t.interest+Math.round((score-54)/8),0,100);t.grade=score>84?'A':score>76?'B+':score>68?'B':'C+';t.note=`${t.philosophy} club • ${need>70?'High':need>45?'Moderate':'Low'} need at ${pos} • Current ${cur}, potential ${pot}${t.name===S.favoriteMLB?' • Childhood favorite':''}`;if(visible&&t.interest>35&&Math.random()<.08)S.news.unshift(`${t.name} scout checks in on your progress.`)}})}
function updateWorld(){let top=[...S.world.colleges].sort((a,b)=>(b.prestige*15+b.pipeline+rand(0,20))-(a.prestige*15+a.pipeline+rand(0,20))).slice(0,5);S.world.headlines=[`${top[0].name} holds the No. 1 national profile.`,`${pick(top).name} lands a high-upside ${pick(POS.slice(0,9))}.`,`${pick(S.world.colleges).name} identifies ${pick(POS.slice(0,9))} as its top roster need.`,`${pick(MLB)} expands scouting coverage in the Northeast.`]}
function weekRecap(stars,h,p,dp,wins,done){sheet(`<div class="eyebrow">Week ${S.week-1} Recap</div><div class="stars">${[1,2,3,4,5].map(i=>`<span class="${i<=stars?'lit':''}">★</span>`).join('')}</div><div class="title">${wins===2?'Perfect Week':wins===1?'Split the Week':'Tough Week'}</div><p class="sub">${hitPlayer()?`${h.h}-for-${h.ab} • ${h.hr} HR • ${h.rbi} RBI`:''}${hitPlayer()&&pitchPlayer()?'<br>':''}${pitchPlayer()?`${p.ip} IP • ${p.er} ER • ${p.k} K`:''}</p><div class="card"><div class="row"><span>Development Points</span><b class="good">+${dp}</b></div><div class="row"><span>Energy</span><b>${S.energy}</b></div><div class="row"><span>Season Average</span><b>${hitPlayer()?avg():era()}</b></div></div><button class="btn" style="margin-top:12px" onclick="closeSheet();${done?'endSeason()':'render()'}">${done?'Finish Season':'Continue'}</button>`)}

function coachTalk(type){
  let a=S.attrs,txt='';
  if(type==='order'){
    txt=hitPlayer()
      ? (S.lineup<=3
          ? `You're already hitting ${S.lineup}. Keep reaching base and producing.`
          : `Your path upward is simple: improve ${a.Discipline<a.Contact?'plate discipline':'contact'} and keep your average near .280. You're currently hitting ${S.lineup}.`)
      : 'Your role is determined by innings and leverage, not the batting order.';

    let candidates=[['CF',(a.Speed||0)+(a.Fielding||0)],['SS',(a.Fielding||0)+(a.Arm||0)+(a['Baseball IQ']||0)/2],['3B',(a.Arm||0)+(a.Power||0)],['RF',(a.Arm||0)+(a.Power||0)],['2B',(a.Fielding||0)+(a.Contact||0)]].sort((x,y)=>y[1]-x[1]);

    if(pitchPlayer())txt=`Your pitching profile is built around ${strongest(['Velocity','Control','Movement','Stamina'])}. We can keep evaluating whether starting or relief fits best.`;
  }
  if(type==='twoway'){
    if(S.position==='Two-Way')txt='You are already on the two-way path. Protect your energy and keep both sides progressing.';
    else if((S.attrs.Arm||0)>=50&&S.energy>=75){
      txt='Your arm is interesting. I will give you a bullpen trial. This does not guarantee a role.';
      S.messages.unshift({from:'Coach',text:'Bullpen trial scheduled. Strong results can unlock the Two-Way role.'});
      if(Math.random()<.45+(S.attrs.Arm-50)/100){
        S.position='Two-Way';
        ['Velocity','Control','Movement','Stamina','Pitching IQ'].forEach(k=>{if(S.attrs[k]==null){S.attrs[k]=rand(40,50);S.attrProgress[k]=0}});
        txt+=' You impressed enough to earn a two-way trial role.';
      }
    }else txt='Not yet. Build your arm strength and energy first.';
  }
  if(type==='improve'){
    let weak=Object.entries(a).sort((x,y)=>x[1]-y[1])[0];
    txt=`Your clearest weakness is ${weak[0]} at ${weak[1]}. Put your next few DP there. Your best current tool is ${strongest(Object.keys(a))}.`;
  }
  if(type==='playing')txt=S.coachConfidence>65?'You have earned meaningful responsibility. Keep producing and I will expand your role.':`I like your effort, but I need more consistency. Coach Confidence is ${S.coachConfidence}. Get it above 65.`;
  if(type==='recruiting'){
    let active=S.world.colleges.filter(c=>c.interest>0).sort((a,b)=>b.interest-a.interest).slice(0,3);
    txt=active.length?`${active.map(c=>c.name).join(', ')} have checked in. ${active[0].name} currently has the strongest interest.`:'No major calls yet. Keep playing well and take advantage of showcase opportunities.';
  }
  sheet(`<div class="eyebrow">Coach Conversation</div><div class="title">Coach's Feedback</div><div class="coachBubble">“${txt}”</div><button class="btn secondary" style="margin-top:12px" onclick="closeSheet();render()">Done</button>`);
}

function restWeekRecap(){let opp=nextOpponent(),win=Math.random()<teamWinChance(rand(50,85));S.record[win?'w':'l']++;S.week++;S.news.unshift(`You rested while ${S.team} ${win?'beat':'lost to'} ${opp}.`);S.lastDP={total:0,items:[]};S.lastWeek={rest:true,opp,win};sheet(`<div class="eyebrow">Week ${S.week-1} Recap</div><div class="title">Coach-Mandated Rest</div><p class="sub">No personal stats or DP. Energy returns to ${S.energy}.</p><div class="card"><div class="row"><span>${S.team}</span><b>${win?'WIN':'LOSS'}</b></div><div class="row"><span>Energy</span><b class="good">${S.energy}</b></div></div><button class="btn" style="margin-top:12px" onclick="closeSheet();render()">Continue</button>`)}

function startWeek050(){let games=2,importance=gameImportance(),big=importance!=='Regular Season',week={games:[],importance,index:0,dpItems:[],startStats:{...S.stats}};for(let i=0;i<games;i++){let opp=nextOpponent(),oppQ=rand(big?62:48,big?88:84),momentCount=big?(importance==='State Championship'?3:2):(Math.random()<.44?1:0);week.games.push(makeGame050(opp,oppQ,momentCount,big))}S.pendingWeek=week;playNext050()}
function makeGame050(opp,oppQ,momentCount,big){let winP=teamWinChance(oppQ),ours=rand(1,7),theirs=rand(1,7);if(Math.random()<winP&&ours<=theirs)ours=theirs+rand(1,3);if(Math.random()>=winP&&ours>=theirs)theirs=ours+rand(1,3);let innings=[],a=0,b=0;for(let i=1;i<=7;i++){let maxA=Math.max(0,ours-a),maxB=Math.max(0,theirs-b),ra=i===7?maxA:rand(0,Math.min(2,maxA)),rb=i===7?maxB:rand(0,Math.min(2,maxB));a+=ra;b+=rb;innings.push([ra,rb])}let line=basePlayerLine050(oppQ),moments=[];for(let i=0;i<momentCount;i++)moments.push(makeMoment050(big,i));return{opp,oppQ,ours,theirs,innings,line,moments,momentIndex:0,plays:[],big}}
function basePlayerLine050(opp){let l={g:1,pa:0,ab:0,h:0,d2:0,d3:0,hr:0,rbi:0,r:0,bb:0,so:0,sb:0,ip:0,er:0,k:0,w:0,l:0,sv:0};if(hitPlayer()){l.ab=rand(3,5);l.pa=l.ab;let p=clamp(.13+(S.attrs.Contact||45)/420+(S.attrs.Vision||45)/850+cfg().stat+(S.energy-75)/900-(opp-60)/600,.08,.39);for(let i=0;i<l.ab;i++)if(Math.random()<p){l.h++;let q=Math.random();if(q<(S.attrs.Power||40)/900)l.hr++;else if(q<.23)l.d2++}l.rbi=rand(0,Math.min(4,l.h+l.hr));l.r=rand(0,Math.min(3,l.h+1));l.so=Math.max(0,l.ab-l.h-rand(0,1))}if(pitchPlayer()){l.ip=S.position==='RP'||S.position==='CP'?rand(1,2):rand(4,7);let ab=((S.attrs.Velocity||45)+(S.attrs.Control||45)+(S.attrs.Movement||45))/3;l.er=Math.max(0,Math.round(l.ip*(.7-ab/155+opp/300)+rand(-1,1)));l.k=Math.max(0,Math.round(l.ip*ab/90+rand(-1,2)))}return l}
function makeMoment050(big,i){let types=hitPlayer()?['bat','field','run']:['pitch','field'];let type=pick(types);if(type==='bat')return{type,title:big?'Season on the Line':'Late-Inning Opportunity',situation:`${pick(['Bottom 7th','Top 6th','Bottom 5th'])} • ${pick(['Tie game','Down one','Up one'])} • ${pick(['Runner on second','Bases loaded','Runner on third'])}`,choices:[['Sit fastball','power'],['Shorten up','contact'],['Work the count','discipline'],['Drive the other way','vision']]};if(type==='field')return{type,title:'Defining Defensive Play',situation:`${pick(['Two outs','One out'])} • ${pick(['Runner at third','Winning run at second','Bases loaded'])}`,choices:[['Make the safe play','fielding'],['Go for the lead runner','arm'],['Charge aggressively','reaction']]};if(type==='run')return{type,title:'Baserunning Decision',situation:`${pick(['Shallow fly ball','Ball in the gap','Pitch gets away'])} • ${pick(['Tie game','Down one'])}`,choices:[['Go for it','speed'],['Hold safely','iq'],['Force a throw','aggressive']]};return{type:'pitch',title:big?'Protect the Season':'High-Leverage At-Bat',situation:`${pick(['Bases loaded','Runner at third','Winning run at second'])} • ${pick(['One out','Two outs'])}`,choices:[['Attack with fastball','velocity'],['Pitch for ground ball','movement'],['Expand the zone','control'],['Use best secondary','iq']]}}
function playNext050(){let w=S.pendingWeek;if(w.index>=w.games.length)return finishWeek050();let g=w.games[w.index];if(g.momentIndex<g.moments.length)return showMoment050(g,g.moments[g.momentIndex]);w.index++;playNext050()}
function showMoment050(g,m){let chanceLabels=m.choices.map(c=>momentChance050(m,c[1],g.oppQ));sheet(`<div class="eyebrow">${S.pendingWeek.importance}</div><div class="moment"><div class="momentScore">${S.team} ${g.ours} • ${g.opp} ${g.theirs}</div><div class="title">${m.title}</div><p class="sub">${m.situation}</p></div><div class="section">Choose Your Approach</div>${m.choices.map((c,i)=>`<div class="choice" onclick="resolveMoment050(${i})"><strong>${c[0]}</strong><span>${chanceLabels[i].label} chance • Best with ${chanceLabels[i].stat}</span></div>`).join('')}`)}
function momentChance050(m,key,opp){let map={power:'Power',contact:'Contact',discipline:'Discipline',vision:'Vision',fielding:'Fielding',arm:'Arm',reaction:'Fielding',speed:'Speed',iq:'Baseball IQ',aggressive:'Speed',velocity:'Velocity',movement:'Movement',control:'Control'};let stat=map[key]||'Baseball IQ',v=S.attrs[stat]||48,base=.26+(v-40)/115+(S.confidence-50)/400+(S.energy-70)/550-(opp-60)/300+(S.difficulty==='Rookie'?.10:S.difficulty==='Legend'?-.06:0);if(key==='iq')base+=(S.attrs['Baseball IQ']||45)/500;return{p:clamp(base,.12,.86),label:base>.7?'Excellent':base>.55?'Good':base>.4?'Risky':'Long shot',stat}}
function resolveMoment050(i){let w=S.pendingWeek,g=w.games[w.index],m=g.moments[g.momentIndex],choice=m.choices[i],ch=momentChance050(m,choice[1],g.oppQ),success=Math.random()<ch.p,outcome='';if(m.type==='bat'){if(success){let hr=choice[1]==='power'&&Math.random()<.28;g.line.h++;g.line.ab++;g.line.pa++;g.line.rbi+=hr?rand(2,4):rand(1,2);g.line[hr?'hr':'d2']++;g.ours+=hr?rand(2,4):rand(1,2);outcome=hr?'You crush a go-ahead home run.':'You deliver a clutch RBI hit.'}else{g.line.ab++;g.line.pa++;g.line.so++;outcome='The pitcher wins the matchup and records the out.'}}else if(m.type==='field'){if(success){outcome='You make the play and erase the threat.';S.coachTrust=clamp(S.coachTrust+1,0,100)}else{outcome='The difficult play gets away and a run scores.';g.theirs++;}}else if(m.type==='run'){if(success){g.line.r++;g.line.sb++;g.ours++;outcome='Your read is perfect and you create a run.'}else{outcome='The defense cuts you down trying to advance.'}}else{if(success){g.line.k++;outcome='You execute the plan and escape the jam.'}else{g.line.er++;g.theirs++;outcome='The hitter adjusts and drives in a run.'}}g.plays.push(`${m.situation}: ${choice[0]} — ${outcome}`);g.momentIndex++;S.confidence=clamp(S.confidence+(success?2:-1),20,100);sheet(`<div class="eyebrow">Defining Moment</div><div class="title ${success?'good':'bad'}">${success?'Success':'Missed Opportunity'}</div><div class="coachBubble">${outcome}</div><p class="sub">${ch.stat}, confidence, energy, opponent quality and RNG shaped the result.</p><button class="btn" onclick="closeSheet();playNext050()">Continue Game</button>`)}
function finishWeek050(){let w=S.pendingWeek,wins=0,weekLine=blank(),starsTotal=0;w.games.forEach(g=>{g.win=g.ours>g.theirs;if(g.win)wins++;for(let k in g.line)weekLine[k]=(weekLine[k]||0)+(g.line[k]||0);let stars=2+(g.line.h>=2?1:0)+(g.line.hr?1:0)+(g.line.rbi>=2?1:0)+(pitchPlayer()&&g.line.er<=1?1:0);starsTotal+=clamp(stars,1,5);S.gameLog.unshift(g)});for(let k in weekLine)S.stats[k]=(S.stats[k]||0)+weekLine[k];addCareer(weekLine);S.record.w+=wins;S.record.l+=w.games.length-wins;let stars=Math.round(starsTotal/w.games.length),items=[['Game performance',Math.max(1,stars-1)]];let clutch=w.games.reduce((n,g)=>n+g.plays.filter(x=>!x.includes('Missed')).length,0);if(clutch)items.push(['Defining moments',Math.min(2,clutch)]);if(wins===2)items.push(['Team sweep',1]);if(S.difficulty==='Rookie')items.push(['Rookie development bonus',1]);let dp=Math.max(1,Math.round(items.reduce((a,x)=>a+x[1],0)*cfg().dev));S.dp+=dp;S.lastDP={total:dp,items};let workload=hitPlayer()?rand(2,5):rand(5,9);if(S.position==='C')workload+=2;if(S.position==='Two-Way')workload+=4;S.energy=clamp(S.energy-workload+rand(2,6),0,100);S.slump=stars<=2?S.slump+1:Math.max(0,S.slump-1);S.teamChemistry=clamp(S.teamChemistry+(wins===2?2:wins===0?-1:0),20,100);S.confidence=clamp(S.confidence+(stars-3)*2,20,100);S.coachConfidence=clamp(S.coachConfidence+(stars-3)+(wins===2?1:0),0,100);S.coachGoals[0].progress=clamp(S.coachGoals[0].progress+(stars>=3?1:0),0,S.coachGoals[0].target);if(S.coachGoals[0].progress>=S.coachGoals[0].target){S.dp+=S.coachGoals[0].reward;S.news.unshift(`Coach goal completed: ${S.coachGoals[0].title}. +${S.coachGoals[0].reward} DP.`);assignCoachGoal()}S.week++;updateRecruit(stars);updateCoach();updateWorld();checkMilestones();w.dp=dp;w.stars=stars;w.wins=wins;w.line=weekLine;S.lastWeek=w;S.pendingWeek=null;let done=S.week>10;weeklyRecap050(w,done)}
function lineScoreHTML(g){return`<table class="boxLines"><tr><th>Team</th>${g.innings.map((_,i)=>`<th>${i+1}</th>`).join('')}<th>R</th><th>H</th><th>E</th></tr><tr><td>${S.team}</td>${g.innings.map(x=>`<td>${x[0]}</td>`).join('')}<td><b>${g.ours}</b></td><td>${Math.max(g.ours+rand(1,5),g.line.h)}</td><td>${rand(0,2)}</td></tr><tr><td>${g.opp}</td>${g.innings.map(x=>`<td>${x[1]}</td>`).join('')}<td><b>${g.theirs}</b></td><td>${g.theirs+rand(2,6)}</td><td>${rand(0,2)}</td></tr></table>`}
function personalLine(l){let a=[];if(hitPlayer())a.push(`${l.h}-for-${l.ab}`,`${l.hr} HR`,`${l.rbi} RBI`,`${l.r} R`,`${l.sb} SB`);if(pitchPlayer())a.push(`${l.ip} IP`,`${l.er} ER`,`${l.k} K`);return a.join(' • ')}
function weeklyRecap050(w,done){let title=w.wins===2?'Perfect Week':w.wins===1?'Split the Week':'Tough Week';let milestones=S.milestones.slice(0,3);sheet(`<div class="eyebrow">Week ${S.week-1} Recap</div><div class="title">${title}</div><div class="scoreHero"><div><div class="scoreTeam">${S.team}</div><div class="scoreNum ${w.wins?'resultWin':'resultLoss'}">${w.wins}</div></div><div class="tag">WINS</div><div><div class="scoreTeam">LOSSES</div><div class="scoreNum">${2-w.wins}</div></div></div><div class="card"><div class="row"><span>Your week</span><b>${personalLine(w.line)}</b></div><div class="row"><span>Season</span><b>${hitPlayer()?avg()+' AVG':era()+' ERA'}</b></div><div class="row"><span>DP earned</span><b class="good">+${w.dp}</b></div><div class="row"><span>Energy</span><b>${S.energy}</b></div></div><div class="section">Games</div>${w.games.map((g,i)=>`<div class="school"><div class="row"><strong class="${g.win?'good':'bad'}">${g.win?'WIN':'LOSS'} ${g.ours}-${g.theirs}</strong><span>${g.opp}</span></div><div class="meta">${personalLine(g.line)}</div><details><summary>View Box Score ▾</summary>${lineScoreHTML(g)}<div class="section">Your Play Log</div>${g.plays.length?g.plays.map(x=>`<div class="news">${x}</div>`).join(''):`<div class="news">No defining moment occurred. Your game was fully simulated.</div>`}</details></div>`).join('')}<div class="section">DP Breakdown</div><div class="card">${S.lastDP.items.map(x=>`<div class="row"><span>${x[0]}</span><b>+${x[1]}</b></div>`).join('')}</div>${milestones.length?`<div class="section">Career Updates</div><div class="card">${S.news.slice(0,4).map(x=>`<div class="news">${x}</div>`).join('')}</div>`:''}<button class="btn" style="margin-top:12px" onclick="closeSheet();${done?'endSeason()':'render()'}">${done?'Finish Season':'Continue'}</button>`)}
function renderHistory(){$('#history').innerHTML=`<div class="card hero"><div class="eyebrow">Career Timeline</div><div class="title">Your Legacy</div><p class="sub">Firsts, trophies, championships and decisions from one continuous baseball life.</p></div><div class="section">Trophy Room</div><div class="grid3">${trophyCards()}</div><div class="section">Timeline</div>${S.milestones.length?`<div class="card timeline">${[...S.milestones].reverse().map(m=>`<div class="timelineItem"><b>${m.title}</b><div class="tiny">${m.detail||''} • ${m.year}</div></div>`).join('')}</div>`:`<div class="card"><p class="sub">Your first milestone is still ahead.</p></div>`}<div class="section">Recent Games</div>${S.gameLog.slice(0,6).map(g=>`<div class="school"><div class="row"><strong class="${g.win?'good':'bad'}">${g.win?'W':'L'} ${g.ours}-${g.theirs}</strong><span>${g.opp}</span></div><details><summary>Box Score ▾</summary>${lineScoreHTML(g)}</details></div>`).join('')||'<div class="card"><p class="sub">No games yet.</p></div>'}<div class="section">Settings</div><button class="btn secondary" onclick="settings()">Difficulty & Career Settings</button><button class="btn ghost" style="margin-top:8px" onclick="resetGame()">Start New Career</button>`}
function trophyCards(){let won=S.history.some(h=>h.champion)||S.milestones.some(m=>m.key.startsWith('state-'));let arr=[['🏆','State Champion',won],['⭐','All-State',S.reputation>65],['🧢','Draft Combine',S.combineInvite],['📋','Drafted',!!S.draft],['✍️','College Commit',!!S.committed],['💯','100 Hits',S.careerStats.h>=100]];return arr.map(x=>`<div class="pill ${x[2]?'':'locked'}" style="text-align:center"><b>${x[0]}</b><span>${x[1]}</span></div>`).join('')}

window.addEventListener('error',e=>{console.error(e.error||e.message);const setupEl=document.getElementById('setup');if(setupEl&&!document.getElementById('game').classList.contains('hidden'))return;if(setupEl)setupEl.innerHTML='<div class="card hero"><div class="eyebrow">Alpha 0.5.5</div><div class="title">Something interrupted loading.</div><p class="sub">Tap below to reset the local save and reopen the game.</p><button class="btn" id="hardReset">Reset & Open</button></div>';setTimeout(()=>{const b=document.getElementById('hardReset');if(b)b.addEventListener('click',()=>{safeRemove('diamondLegacy050');location.reload()})},0)});function sheet(h){$('#modal').innerHTML=`<div class="modal"><div class="sheet">${h}</div></div>`}function closeSheet(){$('#modal').innerHTML=''}function resetGame(){if(confirm('Delete this Alpha 0.5 career?')){safeRemove('diamondLegacy050');location.reload()}}
function bootDiamondLegacy(){
  try{
    const marker=document.getElementById('bootStatus');
    if(marker) marker.textContent='Starting game engine…';
    load();
  }catch(err){
    console.error('Diamond Legacy boot failed:',err);
    const setupEl=document.getElementById('setup');
    if(setupEl){
      setupEl.innerHTML='<div class="card hero"><div class="eyebrow">Alpha 0.5.5 Recovery</div><div class="title">The game engine could not start.</div><p class="sub">Tap below to clear only this version’s local save and try again.</p><button class="btn" id="bootRecover">Reset & Start</button><p class="tiny" style="margin-top:10px">'+String(err && err.message ? err.message : err)+'</p></div>';
      const btn=document.getElementById('bootRecover');
      if(btn)btn.addEventListener('click',()=>{safeRemove('diamondLegacy050');location.reload()});
    }
  }
}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',bootDiamondLegacy,{once:true});else bootDiamondLegacy();

</script></body></html>
