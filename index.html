<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#071118" />
<title>Diamond Legacy — Baseball Alpha</title>
<style>
:root{--bg:#071118;--panel:#0d1b24;--panel2:#132733;--line:#23404f;--text:#f4f8fb;--muted:#8fa8b6;--gold:#f6c453;--green:#39d98a;--red:#ff6b6b;--blue:#58a6ff;--purple:#b18cff}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#061017,#0b1720 45%,#071118);color:var(--text);font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;min-height:100vh}.app{max-width:520px;margin:0 auto;min-height:100vh;padding:env(safe-area-inset-top) 12px calc(76px + env(safe-area-inset-bottom));}.hidden{display:none!important}.topbar{display:flex;justify-content:space-between;align-items:center;padding:14px 2px 10px}.brand{font-weight:900;letter-spacing:.08em}.version{font-size:11px;color:var(--muted)}.card{background:linear-gradient(180deg,rgba(19,39,51,.98),rgba(12,28,38,.98));border:1px solid var(--line);border-radius:18px;padding:14px;box-shadow:0 10px 30px rgba(0,0,0,.2)}.hero{padding:18px}.eyebrow{font-size:12px;color:var(--gold);text-transform:uppercase;letter-spacing:.14em;font-weight:800}.title{font-size:29px;font-weight:950;line-height:1.04;margin:6px 0}.sub{color:var(--muted);font-size:14px;line-height:1.4}.steps{display:flex;gap:7px;margin:16px 0}.stepdot{height:6px;flex:1;border-radius:10px;background:#1d3441}.stepdot.on{background:var(--gold)}label{font-size:12px;color:var(--muted);display:block;margin:10px 0 5px}input,select{width:100%;padding:12px 13px;border-radius:12px;border:1px solid #2a4858;background:#091820;color:white;font-size:16px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.btn{appearance:none;border:0;border-radius:14px;padding:13px 16px;font-weight:900;font-size:15px;background:var(--gold);color:#16120a;width:100%;cursor:pointer}.btn.secondary{background:#173142;color:var(--text);border:1px solid #2e5366}.btn.ghost{background:transparent;color:var(--muted);border:1px solid var(--line)}.btn.danger{background:#4a1f27;color:#ffd7dc}.btn.small{padding:9px 10px;font-size:12px;border-radius:10px}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.statpill{background:#091820;border:1px solid #1f3a48;border-radius:13px;padding:9px 10px;min-width:0}.statpill b{display:block;font-size:18px}.statpill span{font-size:10px;color:var(--muted);text-transform:uppercase}.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}.mainovr{width:74px;height:74px;border-radius:50%;display:grid;place-items:center;border:6px solid var(--gold);font-weight:950;font-size:28px;background:#08161e;box-shadow:0 0 25px rgba(246,196,83,.15)}.sectiontitle{font-size:12px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);font-weight:900;margin:14px 2px 7px}.homegrid{display:grid;grid-template-columns:1.25fr .75fr;gap:9px}.mini{padding:12px}.mini h3{margin:0 0 4px;font-size:14px}.mini p{margin:0;color:var(--muted);font-size:12px}.newsline{display:flex;gap:8px;align-items:flex-start;padding:7px 0;border-bottom:1px solid rgba(255,255,255,.05);font-size:12px}.newsline:last-child{border-bottom:0}.playbtn{margin-top:10px;background:linear-gradient(90deg,#f6c453,#f39c35);font-size:18px}.bottomnav{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:min(520px,100%);display:grid;grid-template-columns:repeat(5,1fr);background:rgba(6,16,23,.96);backdrop-filter:blur(15px);border-top:1px solid #213c4a;padding:7px 8px calc(7px + env(safe-area-inset-bottom));z-index:20}.navbtn{background:none;border:0;color:#76909f;font-size:10px;font-weight:800;padding:5px 2px}.navbtn b{display:block;font-size:19px;margin-bottom:2px}.navbtn.active{color:var(--gold)}.screen{display:none}.screen.active{display:block}.attrgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.attr{background:#0a1821;border:1px solid #203d4b;border-radius:14px;padding:10px}.attrhead{display:flex;justify-content:space-between;align-items:center}.attrname{font-size:12px;font-weight:850}.attrval{font-size:20px;font-weight:950}.bar{height:6px;background:#17303d;border-radius:20px;overflow:hidden;margin:7px 0}.fill{height:100%;background:linear-gradient(90deg,var(--blue),var(--purple))}.attrfoot{display:flex;justify-content:space-between;color:var(--muted);font-size:10px}.rec{color:var(--gold);font-size:11px}.starline{font-size:29px;letter-spacing:2px;color:#30444e}.starline .lit{color:var(--gold)}.modal{position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:50;display:flex;align-items:flex-end;justify-content:center}.modalbox{width:min(520px,100%);max-height:92vh;overflow:auto;background:#0b1922;border:1px solid #29495a;border-radius:24px 24px 0 0;padding:18px 14px calc(20px + env(safe-area-inset-bottom));}.bigline{font-size:25px;font-weight:950}.gain{color:var(--green)}.loss{color:var(--red)}.milestone{display:flex;gap:10px;align-items:center;padding:10px;border-radius:13px;background:#0a1921;border:1px solid #203c4a;margin-bottom:8px}.milestone.locked{opacity:.45}.badge{font-size:24px}.tabs{display:flex;gap:6px;overflow:auto;margin-bottom:10px}.tab{white-space:nowrap;border:1px solid #294757;background:#0b1c26;color:#9db2be;padding:8px 11px;border-radius:999px;font-weight:800;font-size:11px}.tab.on{background:var(--gold);color:#1a1409;border-color:var(--gold)}table{width:100%;border-collapse:collapse;font-size:11px}th,td{padding:8px 5px;border-bottom:1px solid #1d3643;text-align:right}th:first-child,td:first-child{text-align:left}.choice{padding:12px;border:1px solid #294957;background:#0a1922;border-radius:14px;margin:8px 0;cursor:pointer}.choice strong{display:block}.choice span{font-size:12px;color:var(--muted)}.coachbox{border-left:4px solid var(--gold);padding-left:11px}.goalrow{margin:8px 0}.goalrow .row{font-size:12px}.notice{padding:10px;border-radius:12px;background:#102b23;border:1px solid #235640;color:#bff5d9;font-size:12px}.warn{background:#2d2512;border-color:#5d4a1a;color:#f8dda0}.tiny{font-size:10px;color:var(--muted)}.scrollfit{max-height:calc(100vh - 180px);overflow:auto}.logo{width:48px;height:48px;border-radius:14px;background:linear-gradient(135deg,#f6c453,#f37935);display:grid;place-items:center;color:#14202a;font-weight:1000;font-size:24px}
</style>
</head>
<body>
<div class="app">
  <div id="setup"></div>
  <div id="game" class="hidden">
    <div class="topbar"><div><div class="brand">DIAMOND LEGACY</div><div class="version">BASEBALL ALPHA 0.1</div></div><div id="saveState" class="tiny">Saved</div></div>
    <section id="home" class="screen active"></section>
    <section id="develop" class="screen"></section>
    <section id="player" class="screen"></section>
    <section id="world" class="screen"></section>
    <section id="more" class="screen"></section>
  </div>
</div>
<div id="nav" class="bottomnav hidden"></div>
<div id="modalRoot"></div>
<script>
const POSITIONS=['C','1B','2B','3B','SS','LF','CF','RF','DH','SP','RP','CP','Two-Way'];
const HIT_ATTR=['Contact','Power','Vision','Discipline','Speed','Fielding','Arm','Baseball IQ','Durability'];
const PITCH_ATTR=['Velocity','Control','Movement','Stamina','Pitching IQ','Fielding','Arm','Durability'];
const teams=['North Ridge','Lakeview Prep','Westfield Central','Pine Harbor','East Valley','Riverside Tech','Summit Academy','Cedar Grove'];
const colleges=['Coastal State','Eastern Tech','Gulf University','Northern A&M','Capital College','Redwood State'];
let S=null;
const q=s=>document.querySelector(s), qa=s=>[...document.querySelectorAll(s)];
function clamp(n,a,b){return Math.max(a,Math.min(b,n))}function rand(a,b){return Math.floor(Math.random()*(b-a+1))+a}function pick(a){return a[rand(0,a.length-1)]}
function defaultState(p){
 const two=p.position==='Two-Way'; const hitter=!['SP','RP','CP'].includes(p.position)||two; const pitcher=['SP','RP','CP'].includes(p.position)||two;
 let attrs={}; if(hitter) HIT_ATTR.forEach(x=>attrs[x]=rand(46,58)); if(pitcher) PITCH_ATTR.forEach(x=>attrs[x]=attrs[x]??rand(45,57));
 return {version:'alpha0.1',created:Date.now(),name:p.name||'Alex Morgan',age:15,year:'Freshman',week:1,team:p.team,position:p.position,secondary:p.secondary,bats:p.bats,throws:p.throws,goal:p.goal,attrs,dp:14,tp:6,money:75,parents:'Supportive',coachTrust:55,confidence:54,energy:92,reputation:8,lineupSpot:hitter?8:null,rotationRole:pitcher?(p.position==='RP'||p.position==='CP'?'Bullpen':'No. 3 Starter'):null,positionFamiliarity:{[p.position]:100},offers:[],interest:{},news:['Varsity season begins this week.','Coach is evaluating every freshman starter.'],stats:{g:0,pa:0,ab:0,h:0,d2:0,d3:0,hr:0,rbi:0,r:0,bb:0,so:0,sb:0,e:0,ip:0,er:0,k:0,w:0,l:0,sv:0},gameLog:[],milestones:{},history:[],pendingCoach:null,seasonGames:24,teamRecord:{w:0,l:0},rank:rand(12,32),scoutInterest:0,hot:0,cold:0,careerScore:0,mastery:{},equipment:['Standard Glove','Team Cleats','School-Issued Bat'],settings:{autoCoach:false}};
}
function save(){localStorage.setItem('diamondLegacyAlpha',JSON.stringify(S));q('#saveState').textContent='Saved';setTimeout(()=>{if(q('#saveState'))q('#saveState').textContent='Auto-save on'},900)}
function load(){try{S=JSON.parse(localStorage.getItem('diamondLegacyAlpha'))}catch(e){} if(S){startGame()}else setup(1)}
function setup(step,data={}){let el=q('#setup');q('#game').classList.add('hidden');q('#nav').classList.add('hidden');let dots=[1,2,3].map(i=>`<div class="stepdot ${i<=step?'on':''}"></div>`).join('');
 if(step===1)el.innerHTML=`<div class="topbar"><div class="brand">DIAMOND LEGACY</div><div class="version">BASEBALL ALPHA</div></div><div class="card hero"><div class="eyebrow">Step 1 of 3</div><div class="title">Create your player.</div><div class="sub">Begin at age 15 as a varsity freshman starter. Your performance shapes your development, role, recruiting, and legacy.</div><div class="steps">${dots}</div><label>Player name</label><input id="nm" value="${data.name||''}" placeholder="Your name"><div class="grid2"><div><label>Bats</label><select id="bats"><option>Right</option><option>Left</option><option>Switch</option></select></div><div><label>Throws</label><select id="throws"><option>Right</option><option>Left</option></select></div></div><button class="btn" style="margin-top:15px" onclick="setup(2,{name:q('#nm').value,bats:q('#bats').value,throws:q('#throws').value})">Continue</button></div>`;
 if(step===2)el.innerHTML=`<div class="topbar"><div class="brand">DIAMOND LEGACY</div></div><div class="card hero"><div class="eyebrow">Step 2 of 3</div><div class="title">Choose your path.</div><div class="sub">Every position is playable. Two-way players receive separate hitting and pitching evaluations.</div><div class="steps">${dots}</div><label>Primary position</label><select id="pos">${POSITIONS.map(x=>`<option>${x}</option>`).join('')}</select><label>Secondary position</label><select id="sec"><option>None</option>${POSITIONS.filter(x=>x!=='Two-Way').map(x=>`<option>${x}</option>`).join('')}</select><label>Development goal</label><select id="goal"><option>Move Up the Lineup</option><option>Become a Power Hitter</option><option>Become an Elite Defender</option><option>Become a Leadoff Hitter</option><option>Earn a College Scholarship</option><option>Improve Draft Stock</option><option>Join the Starting Rotation</option><option>Become the Closer</option><option>Remain a Two-Way Player</option></select><div class="grid2" style="margin-top:15px"><button class="btn secondary" onclick='setup(1,${JSON.stringify(data)})'>Back</button><button class="btn" onclick='setup(3,{...${JSON.stringify(data)},position:q("#pos").value,secondary:q("#sec").value,goal:q("#goal").value})'>Continue</button></div></div>`;
 if(step===3)el.innerHTML=`<div class="topbar"><div class="brand">DIAMOND LEGACY</div></div><div class="card hero"><div class="eyebrow">Step 3 of 3</div><div class="title">Your family has your back.</div><div class="sub">During high school, your parents cover normal baseball costs: team fees, basic equipment, local travel, and school expenses. Your money is for optional opportunities such as camps, private coaching, and showcases.</div><div class="steps">${dots}</div><label>Choose your school</label><select id="team">${teams.map(x=>`<option>${x} High</option>`).join('')}</select><div class="notice" style="margin-top:12px">✓ Basic high-school costs covered by parents</div><div class="grid2" style="margin-top:15px"><button class="btn secondary" onclick='setup(2,${JSON.stringify(data)})'>Back</button><button class="btn" onclick='newGame({...${JSON.stringify(data)},team:q("#team").value})'>Start Career</button></div></div>`;
}
function newGame(p){S=defaultState(p);save();startGame();showIntro()}
function startGame(){q('#setup').innerHTML='';q('#game').classList.remove('hidden');q('#nav').classList.remove('hidden');renderNav();renderAll()}
function renderNav(){q('#nav').innerHTML=[['home','⌂','Home'],['develop','⬆','Develop'],['player','★','Player'],['world','◉','World'],['more','☰','More']].map((x,i)=>`<button class="navbtn ${i===0?'active':''}" onclick="go('${x[0]}',this)"><b>${x[1]}</b>${x[2]}</button>`).join('')}
function go(id,btn){qa('.screen').forEach(x=>x.classList.remove('active'));q('#'+id).classList.add('active');qa('.navbtn').forEach(x=>x.classList.remove('active'));if(btn)btn.classList.add('active');renderAll()}
function isHitter(){return !['SP','RP','CP'].includes(S.position)||S.position==='Two-Way'}function isPitcher(){return ['SP','RP','CP'].includes(S.position)||S.position==='Two-Way'}
function weightedOVR(type='display'){let vals=Object.values(S.attrs);let trueO=Math.round(vals.reduce((a,b)=>a+b,0)/vals.length); let stageAdj=S.year==='Freshman'?8:S.year==='Sophomore'?5:S.year==='Junior'?2:0; return type==='true'?trueO:clamp(trueO+stageAdj,40,99)}
function avg(){return S.stats.ab?(S.stats.h/S.stats.ab).toFixed(3).replace(/^0/,''):'.000'} function obp(){let d=S.stats.ab+S.stats.bb;return d?((S.stats.h+S.stats.bb)/d).toFixed(3).replace(/^0/,''):'.000'}function slg(){let tb=(S.stats.h-S.stats.d2-S.stats.d3-S.stats.hr)+2*S.stats.d2+3*S.stats.d3+4*S.stats.hr;return S.stats.ab?(tb/S.stats.ab).toFixed(3).replace(/^0/,''):'.000'}
function era(){return S.stats.ip?((S.stats.er*7)/S.stats.ip).toFixed(2):'0.00'}
function renderAll(){if(!S)return;renderHome();renderDevelop();renderPlayer();renderWorld();renderMore();save()}
function renderHome(){let h=q('#home');let role=isHitter()?`Batting ${ordinal(S.lineupSpot)}`:S.rotationRole; if(S.position==='Two-Way')role=`${ordinal(S.lineupSpot)} • ${S.rotationRole}`;h.innerHTML=`<div class="card hero"><div class="row"><div><div class="eyebrow">Week ${S.week} • ${S.year}</div><div class="title" style="font-size:23px">${S.name}</div><div class="sub">${S.team} • ${S.position} • ${role}</div></div><div class="mainovr">${weightedOVR()}</div></div><div class="kpis" style="margin-top:13px"><div class="statpill"><b>${S.coachTrust}</b><span>Trust</span></div><div class="statpill"><b>${S.confidence}</b><span>Confidence</span></div><div class="statpill"><b>${S.energy}%</b><span>Energy</span></div><div class="statpill"><b>${S.dp}</b><span>DP</span></div></div></div><div class="homegrid" style="margin-top:9px"><div class="card mini"><h3>Next Game</h3><p>vs ${pick(teams)} • Varsity</p><div class="bigline" style="margin-top:7px">${S.teamRecord.w}-${S.teamRecord.l}</div></div><div class="card mini"><h3>Season</h3><p>${isHitter()?`${avg()} AVG • ${S.stats.hr} HR`:`${era()} ERA • ${S.stats.k} K`}</p><div class="bigline" style="margin-top:7px">#${S.rank}</div></div></div><div class="sectiontitle">Current Goal</div><div class="card mini">${goalHTML()}</div><div class="sectiontitle">Latest</div><div class="card mini">${S.news.slice(0,3).map(n=>`<div class="newsline"><span>⚾</span><span>${n}</span></div>`).join('')}</div>${S.pendingCoach?`<div class="sectiontitle">Coach Decision</div><button class="btn secondary" onclick="openCoach()">Review Coach Recommendation</button>`:''}<button class="btn playbtn" onclick="playWeek()">PLAY WEEK ▶</button>`}
function goalHTML(){let g=S.goal;let progress=goalProgress();return `<div class="row"><div><b>${g}</b><div class="tiny">Coach tracks stats and attributes together.</div></div><b>${progress}%</b></div><div class="bar"><div class="fill" style="width:${progress}%"></div></div>`}
function goalProgress(){let a=S.attrs;switch(S.goal){case'Move Up the Lineup':return clamp(Math.round((Number(obp())*.75+((a.Contact||50)+(a.Vision||50))/4)),5,100);case'Become a Power Hitter':return clamp(Math.round(((a.Power||50)*.75)+S.stats.hr*3),5,100);case'Become an Elite Defender':return clamp(Math.round(((a.Fielding||50)+(a.Arm||50))/2),5,100);case'Become a Leadoff Hitter':return clamp(Math.round(((a.Speed||50)+(a.Discipline||50)+(a.Contact||50))/3),5,100);case'Earn a College Scholarship':return clamp(S.scoutInterest+Math.round(S.reputation/2),5,100);case'Join the Starting Rotation':return clamp(Math.round(((a.Stamina||50)+(a.Control||50)+(a.Movement||50))/3),5,100);case'Become the Closer':return clamp(Math.round(((a.Velocity||50)+(a.Control||50)+(a.Movement||50))/3),5,100);case'Remain a Two-Way Player':return clamp(Math.round((weightedOVR('true')+S.energy)/2),5,100);default:return clamp(weightedOVR('true'),5,100)}}
function recommendations(){let scores={};Object.keys(S.attrs).forEach(k=>scores[k]=0);let p=S.position;
 const add=(k,n)=>{if(scores[k]!=null)scores[k]+=n}; if(['SS','2B','CF'].includes(p)){add('Fielding',5);add('Speed',4);add('Arm',3);add('Reaction',3)} if(['3B','RF','C'].includes(p)){add('Arm',5);add('Fielding',4);add('Power',2);add('Durability',3)} if(['1B','DH','LF'].includes(p)){add('Power',5);add('Contact',4);add('Discipline',2)} if(isPitcher()){add('Control',5);add('Movement',4);add('Velocity',3);add('Stamina',p==='SP'?5:2);add('Durability',2)}
 if(S.goal.includes('Lineup')){add('Contact',6);add('Vision',5);add('Discipline',4)} if(S.goal.includes('Power'))add('Power',8); if(S.goal.includes('Defender')){add('Fielding',8);add('Arm',5)} if(S.goal.includes('Leadoff')){add('Speed',7);add('Contact',6);add('Discipline',5)} if(S.goal.includes('Scholarship')||S.goal.includes('Draft')){Object.keys(scores).forEach(k=>scores[k]+=2)} if(S.goal.includes('Rotation')){add('Stamina',8);add('Control',6)} if(S.goal.includes('Closer')){add('Velocity',8);add('Movement',6)}
 return Object.entries(scores).sort((a,b)=>b[1]-a[1]).slice(0,3).map(x=>x[0])}
function renderDevelop(){let recs=recommendations();let attrs=Object.entries(S.attrs);q('#develop').innerHTML=`<div class="card"><div class="row"><div><div class="eyebrow">Development</div><div class="title" style="font-size:23px">${S.dp} DP available</div><div class="sub">Performance earns DP. Training earns TP. Money is not used for ratings.</div></div><div class="logo">↑</div></div></div><div class="sectiontitle">Coach Suggestions</div><div class="card mini coachbox"><b>${recs.join(' • ')}</b><p>${coachReason(recs[0])}</p><div class="tiny">Recommended upgrades receive a 10% progress bonus.</div></div><div class="sectiontitle">Attributes</div><div class="attrgrid">${attrs.map(([k,v])=>attrCard(k,v,recs.includes(k))).join('')}</div><div class="sectiontitle">Training Points</div><div class="card mini"><div class="row"><div><b>${S.tp} TP</b><p>Earned through weekly training.</p></div><button class="btn small secondary" onclick="convertTP()">Use 5 TP → 3 DP</button></div></div>`}
function attrCard(k,v,rec){let cost=upgradeCost(v);return `<div class="attr"><div class="attrhead"><div class="attrname">${k} ${rec?'<span class="rec">★</span>':''}</div><div class="attrval">${v}</div></div><div class="bar"><div class="fill" style="width:${v}%"></div></div><div class="attrfoot"><span>${cost} DP</span><button class="btn small ${S.dp>=cost?'':'ghost'}" ${S.dp>=cost?'':'disabled'} onclick="upgrade('${k}',${rec})">+1</button></div></div>`}
function upgradeCost(v){return Math.max(3,Math.round(3+Math.pow(v-40,1.18)/6))}function upgrade(k,rec){let c=upgradeCost(S.attrs[k]);if(S.dp<c)return;S.dp-=c;S.attrs[k]=clamp(S.attrs[k]+1,1,99);if(rec&&Math.random()<.1)S.attrs[k]=clamp(S.attrs[k]+1,1,99);renderAll()}function convertTP(){if(S.tp>=5){S.tp-=5;S.dp+=3;renderAll()}}
function coachReason(k){let reasons={Contact:'Your goal and recent at-bats favor better bat-to-ball skill.',Power:'More impact will improve extra-base production.',Vision:'Pitch recognition can reduce strikeouts.',Discipline:'More walks will help you reach a better lineup spot.',Speed:'Your role benefits from pressure on the bases.',Fielding:'Your position demands consistent defensive value.',Arm:'Arm strength supports your current and possible secondary positions.',Control:'More strikes will improve your pitching role.',Movement:'Better movement makes your pitches harder to square up.',Stamina:'Your workload goal requires more endurance.',Durability:'Your workload is high, especially for a two-way player.'};return reasons[k]||'This is the best match for your position and current goal.'}
function renderPlayer(){let milestones=milestoneList();q('#player').innerHTML=`<div class="card"><div class="row"><div><div class="eyebrow">Player Hub</div><div class="title" style="font-size:22px">${S.name}</div><div class="sub">True Talent ${weightedOVR('true')} • HS OVR ${weightedOVR()}</div></div><div class="logo">${S.position==='Two-Way'?'2W':S.position}</div></div></div><div class="sectiontitle">Season Stats</div><div class="card scrollfit">${statTable()}</div><div class="sectiontitle">Milestones</div><div class="card">${milestones.slice(0,8).map(m=>`<div class="milestone ${S.milestones[m.key]?'':'locked'}"><div class="badge">${S.milestones[m.key]?'🏆':'○'}</div><div><b>${m.name}</b><div class="tiny">${S.milestones[m.key]||'Not yet achieved'}</div></div></div>`).join('')}</div>`}
function statTable(){if(isHitter())return `<table><tr><th>G</th><th>AVG</th><th>OBP</th><th>SLG</th><th>HR</th><th>RBI</th><th>SB</th></tr><tr><td>${S.stats.g}</td><td>${avg()}</td><td>${obp()}</td><td>${slg()}</td><td>${S.stats.hr}</td><td>${S.stats.rbi}</td><td>${S.stats.sb}</td></tr></table>${isPitcher()?`<br><table><tr><th>IP</th><th>ERA</th><th>K</th><th>W</th><th>SV</th></tr><tr><td>${S.stats.ip.toFixed(1)}</td><td>${era()}</td><td>${S.stats.k}</td><td>${S.stats.w}</td><td>${S.stats.sv}</td></tr></table>`:''}`;return `<table><tr><th>IP</th><th>ERA</th><th>K</th><th>W</th><th>L</th><th>SV</th></tr><tr><td>${S.stats.ip.toFixed(1)}</td><td>${era()}</td><td>${S.stats.k}</td><td>${S.stats.w}</td><td>${S.stats.l}</td><td>${S.stats.sv}</td></tr></table>`}
function milestoneList(){return [{key:'firstGame',name:'Varsity Debut'},{key:'firstHit',name:'First Varsity Hit'},{key:'firstRun',name:'First Run'},{key:'firstRBI',name:'First RBI'},{key:'firstHR',name:'First Home Run'},{key:'multiHit',name:'First Multi-Hit Game'},{key:'grandSlam',name:'First Grand Slam'},{key:'cycle',name:'First Cycle'},{key:'firstWin',name:'First Pitching Win'},{key:'firstK',name:'First Strikeout'},{key:'firstOffer',name:'First College Offer'},{key:'lineupMove',name:'First Lineup Promotion'},{key:'positionChange',name:'First Position Change'},{key:'showcase',name:'First Showcase Invitation'}]}
function unlock(key,text){if(!S.milestones[key]){S.milestones[key]=`Week ${S.week}, ${S.year}`;S.careerScore+=5;return text}return null}
function renderWorld(){q('#world').innerHTML=`<div class="card"><div class="eyebrow">Baseball World</div><div class="title" style="font-size:22px">Rankings & Recruiting</div><div class="sub">The world moves each week, even when your own game is quiet.</div></div><div class="sectiontitle">Your Recruiting</div><div class="card mini"><div class="row"><div><b>Scout Interest</b><p>${interestText()}</p></div><div class="mainovr" style="width:62px;height:62px;font-size:19px;border-width:4px">${S.scoutInterest}</div></div>${S.offers.length?S.offers.map(o=>`<div class="newsline"><span>🎓</span><span>${o} has offered a scholarship.</span></div>`).join(''):'<div class="tiny" style="margin-top:10px">No offers yet. Strong performance and showcases raise interest.</div>'}</div><div class="sectiontitle">Top Prospects</div><div class="card mini">${['Ethan Brooks • SS','Mason Carter • RHP',`${S.name} • ${S.position}`,'Jayden Miles • CF','Noah Grant • C'].map((x,i)=>`<div class="newsline"><b>#${i+1}</b><span>${x}</span><span style="margin-left:auto">${i===2?weightedOVR():rand(83,97)} OVR</span></div>`).join('')}</div><div class="sectiontitle">National News</div><div class="card mini">${S.news.map(n=>`<div class="newsline"><span>📰</span><span>${n}</span></div>`).join('')}</div>`}
function interestText(){return S.scoutInterest<20?'Local attention':S.scoutInterest<45?'Regional interest':S.scoutInterest<70?'Strong college interest':S.scoutInterest<90?'National prospect':'Elite national prospect'}
function renderMore(){q('#more').innerHTML=`<div class="card"><div class="eyebrow">Career Menu</div><div class="title" style="font-size:22px">More</div></div><div class="sectiontitle">Options</div><div class="card"><button class="btn secondary" onclick="changeGoal()">Change Development Goal</button><button class="btn secondary" style="margin-top:8px" onclick="showScrapbook()">Career Scrapbook</button><button class="btn secondary" style="margin-top:8px" onclick="showFinances()">Family & Opportunities</button><button class="btn secondary" style="margin-top:8px" onclick="exportSave()">Export Save</button><button class="btn danger" style="margin-top:8px" onclick="resetGame()">Start New Career</button></div><div class="sectiontitle">Career Score</div><div class="card mini"><div class="row"><div><b>${S.careerScore}</b><p>Milestones, awards, records, championships, and legacy.</p></div><div class="logo">★</div></div></div>`}
function playWeek(){if(S.stats.g>=S.seasonGames){endSeason();return}let before=JSON.parse(JSON.stringify(S.stats));let hline=null,pline=null,score=0;S.energy=clamp(S.energy-rand(4,10),20,100);
 if(isHitter()){let pa=rand(3,5),bb=Math.random()<.18?1:0,ab=pa-bb;let talent=((S.attrs.Contact||50)+(S.attrs.Vision||50)+(S.confidence))/300;let hits=0,hr=0,d2=0,d3=0,rbi=0,r=0,sb=0,so=0;for(let i=0;i<ab;i++){let roll=Math.random();if(roll<talent*.62){hits++;let x=Math.random();if(x<(S.attrs.Power||45)/500)hr++;else if(x<.28)d2++;else if(x<.31)d3++;}else if(Math.random()<.34)so++}rbi=Math.min(rand(0,Math.max(1,hits+hr*2)),6);r=Math.min(rand(0,Math.max(1,hits+bb)),4);if(Math.random()<(S.attrs.Speed||40)/180)sb=1;let e=Math.random()>(S.attrs.Fielding||50)/100+.35?1:0;Object.assign(S.stats,{g:S.stats.g+1,pa:S.stats.pa+pa,ab:S.stats.ab+ab,h:S.stats.h+hits,d2:S.stats.d2+d2,d3:S.stats.d3+d3,hr:S.stats.hr+hr,rbi:S.stats.rbi+rbi,r:S.stats.r+r,bb:S.stats.bb+bb,so:S.stats.so+so,sb:S.stats.sb+sb,e:S.stats.e+e});hline={ab,hits,hr,d2,d3,rbi,r,bb,so,sb,e};score+=hits*1.4+hr*2+rbi*.45+bb*.4+sb*.5-e*1.2;}
 if(isPitcher()){let ip=S.position==='CP'?1:S.position==='RP'?rand(1,3):rand(4,7);let quality=((S.attrs.Control||50)+(S.attrs.Movement||50)+(S.attrs.Velocity||50))/300;let er=Math.max(0,Math.round(rand(0,5)*(1-quality)));let k=Math.max(0,Math.round(ip*(.5+quality)));let win=Math.random()<clamp(.35+quality*.35-er*.06,.1,.8);let sv=S.position==='CP'&&Math.random()<.55;S.stats.ip+=ip;S.stats.er+=er;S.stats.k+=k;if(win)S.stats.w++;else if(S.position==='SP')S.stats.l++;if(sv)S.stats.sv++;pline={ip,er,k,win,sv};score+=ip*.7+k*.4-er*1.2+(win?1.5:0)+(sv?1.5:0)}
 let stars=clamp(Math.round(score/2)+2,1,5);let mult=[0,.75,.9,1,1.25,1.55][stars];let base=6,perf=Math.round(base*mult),training=rand(2,5),hotBonus=stars===5?3:0,total=base+perf+training+hotBonus;S.dp+=total;S.tp+=rand(2,4);S.confidence=clamp(S.confidence+(stars-3)*3,10,99);S.coachTrust=clamp(S.coachTrust+(stars>=4?2:stars===1?-2:0),0,100);S.reputation=clamp(S.reputation+Math.max(0,stars-2),0,100);S.scoutInterest=clamp(S.scoutInterest+(stars>=4?rand(2,6):rand(0,2)),0,100);if(stars>=4)S.hot++;else if(stars<=2)S.cold++;else{S.hot=0;S.cold=0}let won=Math.random()<.55+(stars-3)*.08;if(won)S.teamRecord.w++;else S.teamRecord.l++;S.rank=clamp(S.rank+(won?-rand(0,2):rand(0,2)),1,50);
 let newMil=[];let u=unlock('firstGame','Varsity Debut');if(u)newMil.push(u);if(hline){if(hline.hits>0){u=unlock('firstHit','First Varsity Hit');if(u)newMil.push(u)}if(hline.r>0){u=unlock('firstRun','First Run');if(u)newMil.push(u)}if(hline.rbi>0){u=unlock('firstRBI','First RBI');if(u)newMil.push(u)}if(hline.hr>0){u=unlock('firstHR','First Home Run');if(u)newMil.push(u)}if(hline.hits>=2){u=unlock('multiHit','First Multi-Hit Game');if(u)newMil.push(u)}if(hline.hr&&hline.rbi>=4&&Math.random()<.2){u=unlock('grandSlam','First Grand Slam');if(u)newMil.push(u)}if(hline.hits>=4&&hline.hr&&hline.d2&&hline.d3){u=unlock('cycle','First Cycle');if(u)newMil.push(u)}}if(pline){if(pline.k){u=unlock('firstK','First Strikeout');if(u)newMil.push(u)}if(pline.win){u=unlock('firstWin','First Pitching Win');if(u)newMil.push(u)}}
 if(S.scoutInterest>=28&&!S.milestones.showcase){u=unlock('showcase','First Showcase Invitation');if(u){newMil.push(u);S.news.unshift('A regional showcase has invited you after your recent performance.')}}if(S.scoutInterest>=52&&S.offers.length===0){let c=pick(colleges);S.offers.push(c);u=unlock('firstOffer','First College Offer');if(u)newMil.push(u);S.news.unshift(`${c} has offered you a scholarship.`)}
 S.week++;evaluateCoach();S.news.unshift(`${stars}★ week: ${isHitter()?`${hline.hits}-for-${hline.ab}${hline.hr?`, ${hline.hr} HR`:''}`:`${pline.ip} IP, ${pline.er} ER, ${pline.k} K`}.`);S.gameLog.unshift({week:S.week-1,stars,hline,pline,dp:total});S.energy=clamp(S.energy+rand(5,10),20,100);save();showWeekModal(stars,hline,pline,{base,perf,training,hotBonus,total},newMil)}
function evaluateCoach(){if(S.week%3!==0)return;let rec=null;if(isHitter()){let target=idealLineupSpot();if(target<S.lineupSpot-1&&S.coachTrust>=58){rec={type:'lineup',target,text:`Your recent production fits the ${ordinal(target)} spot better than ${ordinal(S.lineupSpot)}.`}}let pos=positionSuggestion();if(!rec&&pos&&S.positionFamiliarity[pos]==null){rec={type:'position',target:pos,text:`Your ratings and team needs suggest trying ${pos}.`}}}if(isPitcher()&&!rec){if(S.position==='RP'&&(S.attrs.Stamina||0)>67&&(S.attrs.Control||0)>63)rec={type:'rotation',target:'No. 4 Starter',text:'Your stamina and control now fit a starting role.'};if(S.position==='SP'&&(S.attrs.Velocity||0)>72&&(S.attrs.Movement||0)>68&&S.stats.sv===0)rec={type:'closer',target:'Closer',text:'Your power arsenal could dominate late innings.'}}if(rec)S.pendingCoach=rec}
function idealLineupSpot(){let a=S.attrs, ob=Number(obp()), sl=Number(slg());if((a.Speed||0)>70&&ob>.34)return 1;if((a.Contact||0)>68&&ob>.33)return 2;if(sl>.52&&(a.Power||0)>70)return 4;if(sl>.44)return 5;if(ob>.30)return 6;return 8}
function positionSuggestion(){let a=S.attrs;if(S.position==='SS'&&(a.Speed||0)<58&&(a.Arm||0)>68)return'3B';if(S.position==='CF'&&(a.Speed||0)<62&&(a.Arm||0)>70)return'RF';if(S.position==='C'&&(a.Durability||0)<58&&(a.Power||0)>68)return'1B';if(['LF','RF'].includes(S.position)&&(a.Fielding||0)>72&&(a.Speed||0)>68)return'CF';if(S.position==='2B'&&(a.Arm||0)>72&&(a.Fielding||0)>70)return'SS';return null}
function openCoach(){let r=S.pendingCoach;if(!r)return;modal(`<div class="eyebrow">Coach Recommendation</div><div class="title" style="font-size:24px">${r.type==='lineup'?`Move to ${ordinal(r.target)}`:`Try ${r.target}`}</div><div class="coachbox"><p>${r.text}</p></div><div class="sectiontitle">Why</div><div class="card mini"><b>${recommendations().join(' • ')}</b><p>${coachReason(recommendations()[0])}</p></div><div class="grid2" style="margin-top:12px"><button class="btn secondary" onclick="declineCoach()">Not Now</button><button class="btn" onclick="acceptCoach()">Accept</button></div>`)}
function acceptCoach(){let r=S.pendingCoach;if(r.type==='lineup'){S.lineupSpot=r.target;unlock('lineupMove','First Lineup Promotion')}else if(r.type==='position'){S.secondary=S.position;S.position=r.target;S.positionFamiliarity[r.target]=55;unlock('positionChange','First Position Change')}else if(r.type==='rotation'){S.position='SP';S.rotationRole=r.target}else if(r.type==='closer'){S.position='CP';S.rotationRole='Closer'}S.coachTrust=clamp(S.coachTrust+4,0,100);S.news.unshift(`Coach changed your role: ${r.type==='lineup'?ordinal(r.target):r.target}.`);S.pendingCoach=null;closeModal();renderAll()}
function declineCoach(){S.coachTrust=clamp(S.coachTrust-1,0,100);S.pendingCoach=null;closeModal();renderAll()}
function showWeekModal(stars,h,p,d,newMil){modal(`<div class="eyebrow">Week Complete</div><div class="starline">${[1,2,3,4,5].map(i=>`<span class="${i<=stars?'lit':''}">★</span>`).join('')}</div><div class="bigline">${h?`${h.hits}-for-${h.ab}${h.hr?` • ${h.hr} HR`:''}${h.rbi?` • ${h.rbi} RBI`:''}`:`${p.ip} IP • ${p.er} ER • ${p.k} K`}</div><div class="sectiontitle">Development</div><div class="card mini"><div class="row"><span>Base</span><b>+${d.base}</b></div><div class="row"><span>Performance multiplier</span><b>+${d.perf}</b></div><div class="row"><span>Training</span><b>+${d.training}</b></div><div class="row"><span>Hot-week bonus</span><b>+${d.hotBonus}</b></div><hr style="border-color:#294452"><div class="row"><b>Total DP</b><b class="gain">+${d.total}</b></div></div>${newMil.length?`<div class="sectiontitle">New Milestone</div><div class="notice">🏆 ${newMil.join('<br>🏆 ')}</div>`:''}<button class="btn" style="margin-top:14px" onclick="closeModal();renderAll()">Continue</button>`)}
function endSeason(){modal(`<div class="eyebrow">Season Complete</div><div class="title">${S.year} Year Finished</div><div class="bigline">${S.teamRecord.w}-${S.teamRecord.l}</div><p class="sub">Your high-school OVR was ${weightedOVR()}. Your projected next-level talent is ${weightedOVR('true')}.</p><div class="card mini">${statTable()}</div><button class="btn" style="margin-top:12px" onclick="advanceYear()">Advance to Next Season</button>`)}
function advanceYear(){let years=['Freshman','Sophomore','Junior','Senior'];let i=years.indexOf(S.year);if(i===3){closeModal();modal(`<div class="eyebrow">Chapter Complete</div><div class="title">High School Career Complete</div><p class="sub">College gameplay is planned for the next expansion. Your save remains intact.</p><button class="btn" onclick="closeModal()">Return</button>`);return}S.history.push({year:S.year,stats:{...S.stats},ovr:weightedOVR()});S.year=years[i+1];S.age++;S.week=1;S.stats={g:0,pa:0,ab:0,h:0,d2:0,d3:0,hr:0,rbi:0,r:0,bb:0,so:0,sb:0,e:0,ip:0,er:0,k:0,w:0,l:0,sv:0};S.teamRecord={w:0,l:0};S.energy=100;S.confidence=60;S.seasonGames=24;S.dp+=12;S.tp+=6;closeModal();renderAll()}
function changeGoal(){modal(`<div class="eyebrow">Development Goal</div><div class="title" style="font-size:23px">Choose your focus</div>${['Move Up the Lineup','Become a Power Hitter','Become an Elite Defender','Become a Leadoff Hitter','Earn a College Scholarship','Improve Draft Stock','Join the Starting Rotation','Become the Closer','Remain a Two-Way Player'].map(g=>`<div class="choice" onclick="setGoal('${g}')"><strong>${g}</strong><span>Coach recommendations will adapt.</span></div>`).join('')}`)}function setGoal(g){S.goal=g;closeModal();renderAll()}
function showScrapbook(){let events=Object.entries(S.milestones);modal(`<div class="eyebrow">Career Scrapbook</div><div class="title" style="font-size:23px">Your Baseball Story</div>${events.length?events.map(([k,v])=>`<div class="milestone"><div class="badge">📸</div><div><b>${milestoneList().find(x=>x.key===k)?.name||k}</b><div class="tiny">${v}</div></div></div>`).join(''):'<p class="sub">Your first milestone will appear here.</p>'}<button class="btn secondary" onclick="closeModal()">Close</button>`)}
function showFinances(){modal(`<div class="eyebrow">Family & Opportunities</div><div class="title" style="font-size:23px">$${S.money}</div><div class="notice">Parents cover basic equipment, team fees, school costs, and local travel during high school.</div><div class="sectiontitle">Optional Opportunities</div>${[['Private Hitting Session',60,'+4 TP'],['Regional Showcase',150,'Scout interest'],['Recovery Session',45,'Energy +20']].map(x=>`<div class="choice" onclick="buyOpportunity('${x[0]}',${x[1]})"><strong>${x[0]} • $${x[1]}</strong><span>${x[2]}</span></div>`).join('')}<p class="tiny">Alpha note: money is deliberately secondary during high school.</p>`)}
function buyOpportunity(n,c){if(S.money<c){alert('Not enough money. Your parents cover necessities, but optional opportunities require saved funds.');return}S.money-=c;if(n.includes('Hitting'))S.tp+=4;if(n.includes('Showcase'))S.scoutInterest=clamp(S.scoutInterest+12,0,100);if(n.includes('Recovery'))S.energy=clamp(S.energy+20,0,100);closeModal();renderAll()}
function exportSave(){let blob=new Blob([JSON.stringify(S,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='diamond-legacy-save.json';a.click();URL.revokeObjectURL(a.href)}function resetGame(){if(confirm('Start a new career? This removes the current local save.')){localStorage.removeItem('diamondLegacyAlpha');location.reload()}}
function showIntro(){modal(`<div class="eyebrow">Chapter One</div><div class="title">Freshman Varsity</div><p class="sub">At 15 years old, you have already earned a starting role. The coach believes in your talent—but every spot in the lineup must still be earned.</p><div class="notice">Your parents will handle normal high-school baseball costs.</div><button class="btn" style="margin-top:14px" onclick="closeModal()">Opening Week</button>`)}
function ordinal(n){if(n==null)return'';let s=['th','st','nd','rd'],v=n%100;return n+(s[(v-20)%10]||s[v]||s[0])}
function modal(html){q('#modalRoot').innerHTML=`<div class="modal"><div class="modalbox">${html}</div></div>`}function closeModal(){q('#modalRoot').innerHTML=''}
load();
</script>
</body>
</html>
