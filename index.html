<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#071118"><title>Diamond Legacy — Alpha 0.5</title><style>
:root{--bg:#071118;--card:#102630;--card2:#0b1b23;--line:#294854;--text:#f5f7f8;--muted:#91a6af;--gold:#f2c14f;--green:#55d89f;--red:#ff7777;--blue:#67aefc}*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#061018,#0b1921 50%,#071118);color:var(--text);font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;min-height:100vh}.app{max-width:560px;margin:auto;padding:env(safe-area-inset-top) 12px calc(82px + env(safe-area-inset-bottom));min-height:100vh}.hidden{display:none!important}.top{display:flex;align-items:center;justify-content:space-between;padding:14px 2px 10px}.brand{font-weight:1000;letter-spacing:.08em}.tiny{font-size:10px;color:var(--muted)}.screen{display:none}.screen.on{display:block}.card{background:linear-gradient(180deg,#122b36,#0d2029);border:1px solid var(--line);border-radius:18px;padding:14px;box-shadow:0 10px 25px #0004}.hero{padding:17px}.eyebrow{font-size:10px;color:var(--gold);font-weight:950;text-transform:uppercase;letter-spacing:.15em}.title{font-size:26px;line-height:1.05;font-weight:1000;margin:5px 0}.sub{font-size:13px;color:var(--muted);line-height:1.45}.section{margin:14px 2px 7px;font-size:10px;color:var(--muted);font-weight:950;text-transform:uppercase;letter-spacing:.14em}.row{display:flex;align-items:center;justify-content:space-between;gap:8px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}.pill{background:#091820;border:1px solid #24424e;border-radius:12px;padding:8px;min-width:0}.pill b{display:block;font-size:17px}.pill span{font-size:8px;color:var(--muted);text-transform:uppercase}.ovr{height:72px;width:72px;border-radius:50%;display:grid;place-items:center;border:6px solid var(--gold);font-size:27px;font-weight:1000;background:#07151d}.btn{width:100%;border:0;border-radius:14px;padding:13px 15px;font-size:15px;font-weight:950;background:var(--gold);color:#171208}.btn.secondary{background:#17323e;color:var(--text);border:1px solid #31515f}.btn.ghost{background:transparent;color:var(--muted);border:1px solid var(--line)}.btn.small{padding:9px;font-size:11px;border-radius:10px}.play{font-size:17px;background:linear-gradient(90deg,#f2c14f,#ec9639)}label{display:block;color:var(--muted);font-size:11px;margin:10px 0 5px}input,select{width:100%;padding:12px;border:1px solid #2d4c58;border-radius:12px;background:#091820;color:white;font-size:16px}.notice{padding:10px;border-radius:12px;background:#102c23;border:1px solid #285a45;color:#c9f5df;font-size:12px}.warn{background:#302713;border-color:#66521e;color:#ffe5aa}.bad{color:var(--red)}.good{color:var(--green)}.meter{height:7px;background:#18313b;border-radius:9px;overflow:hidden;margin-top:5px}.fill{height:100%;background:linear-gradient(90deg,var(--blue),#b48dff)}.news{padding:8px 0;border-bottom:1px solid #ffffff0d;font-size:12px}.news:last-child{border:0}.tag{display:inline-block;padding:4px 7px;border-radius:99px;background:#17323e;border:1px solid #31515f;font-size:9px;margin:2px}.school{padding:11px;border-radius:14px;background:#0a1b23;border:1px solid #284753;margin-bottom:8px}.school strong{font-size:14px}.school .meta{font-size:10px;color:var(--muted);margin-top:3px}.nav{position:fixed;z-index:30;left:50%;bottom:0;transform:translateX(-50%);width:min(560px,100%);display:grid;grid-template-columns:repeat(5,1fr);background:#061017f2;backdrop-filter:blur(16px);border-top:1px solid #274554;padding:7px 8px calc(7px + env(safe-area-inset-bottom))}.nav button{border:0;background:none;color:#78909d;font-size:9px;font-weight:900}.nav b{display:block;font-size:18px}.nav button.on{color:var(--gold)}.modal{position:fixed;z-index:100;inset:0;background:#000c;display:flex;align-items:flex-end;justify-content:center}.sheet{width:min(560px,100%);max-height:94vh;overflow:auto;background:#0a1820;border:1px solid #31515f;border-radius:24px 24px 0 0;padding:18px 14px calc(20px + env(safe-area-inset-bottom))}.choice{padding:12px;border:1px solid #2a4956;background:#0c1d25;border-radius:14px;margin:8px 0}.choice strong{display:block}.choice span{display:block;color:var(--muted);font-size:11px;margin-top:3px}.stars{font-size:28px;color:#344b55}.stars .lit{color:var(--gold)}table{width:100%;border-collapse:collapse;font-size:11px}th,td{padding:7px 4px;border-bottom:1px solid #203a45;text-align:right}th:first-child,td:first-child{text-align:left}.tabs{display:flex;gap:6px;overflow:auto;margin-bottom:10px}.tabs button{white-space:nowrap;border:1px solid #2d4b57;background:#0c1d25;color:#9fb1b9;padding:8px 10px;border-radius:99px;font-weight:850}.tabs button.on{background:var(--gold);color:#171208}.setting{padding:11px 0;border-bottom:1px solid #ffffff12}.setting:last-child{border:0}

.avatarWrap{display:flex;align-items:center;gap:13px}.avatar{width:88px;height:88px;flex:0 0 88px;border-radius:22px;overflow:hidden;background:#081820;border:1px solid #31515f;box-shadow:inset 0 0 0 3px #ffffff08}.progressLine{height:9px;background:#18313b;border-radius:99px;overflow:hidden;margin:7px 0 4px}.progressLine>i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),#ed9341)}.cost{font-size:9px;color:var(--muted)}.milestone{padding:10px 0;border-bottom:1px solid #ffffff10}.milestone:last-child{border:0}.milestone b{display:block}.goal{border-left:4px solid var(--gold);padding-left:10px}.fav{box-shadow:inset 0 0 0 1px var(--gold)}.badgeLogo{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:1000;color:white;flex:0 0 38px}.locked{opacity:.55}.opportunity{border-color:#796224;background:#2a2412}.bigNumber{font-size:32px;font-weight:1000}.selectGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.swatch{height:42px;border-radius:12px;border:2px solid transparent}.swatch.on{border-color:var(--gold)}

.scoreHero{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;text-align:center;padding:16px 8px}.scoreTeam{font-size:12px;font-weight:900}.scoreNum{font-size:36px;font-weight:1000}.resultWin{color:var(--green)}.resultLoss{color:var(--red)}details{border-top:1px solid #ffffff12;padding:10px 0}details:first-child{border-top:0}summary{cursor:pointer;font-weight:900;list-style:none}summary::-webkit-details-marker{display:none}.headline{font-size:20px;font-weight:1000;line-height:1.15}.moment{border:1px solid #7a6427;background:#292310;border-radius:17px;padding:14px}.momentScore{font-size:12px;color:var(--gold);font-weight:950}.coachBubble{padding:13px;border-radius:16px;background:#142e39;border-left:4px solid var(--gold);font-size:13px;line-height:1.5}.timeline{border-left:3px solid #31515f;margin-left:9px;padding-left:17px}.timelineItem{position:relative;padding:0 0 16px}.timelineItem:before{content:'';position:absolute;left:-24px;top:3px;width:11px;height:11px;border-radius:50%;background:var(--gold);border:2px solid #071118}.clubGrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.clubBtn{text-align:left;padding:13px;border-radius:14px;background:#0c1d25;border:1px solid #2a4956;color:var(--text);font-weight:900}.clubBtn span{display:block;color:var(--muted);font-size:10px;margin-top:4px}.formTag{display:inline-block;font-size:10px;letter-spacing:.15em}.boxLines th,.boxLines td{text-align:center}.boxLines th:first-child,.boxLines td:first-child{text-align:left}.restCard{border-color:#496b77;background:#102a34}
</style></head><body><div class="app"><div id="setup"><div class="card hero"><div class="title">Loading Diamond Legacy…</div><p class="sub" id="bootStatus">Loading the game engine.</p><noscript><p class="bad">JavaScript is disabled in this browser.</p></noscript></div></div><div id="game" class="hidden"><div class="top"><div><div class="brand">DIAMOND LEGACY</div><div class="tiny">BASEBALL ALPHA 0.5.2</div></div><div id="saved" class="tiny">Saved</div></div><section id="home" class="screen on"></section><section id="player" class="screen"></section><section id="recruiting" class="screen"></section><section id="world" class="screen"></section><section id="history" class="screen"></section></div></div><div id="nav" class="nav hidden"></div><div id="modal"></div><script src="./app.js" data-cfasync="false" defer></script></body></html>
