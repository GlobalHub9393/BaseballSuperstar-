<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07111f">
<title>Diamond Legacy</title>
<style>:root{
  --bg:#07111f;--panel:#0d1b2d;--panel2:#12243b;--line:#243c59;--text:#f3f7fb;--muted:#9eb0c4;
  --blue:#39a0ff;--green:#42d392;--gold:#ffc857;--red:#ff6b6b;--purple:#a78bfa;
}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#07111f,#0b1626 45%,#07111f);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100vh}
button,input,select{font:inherit}.shell{max-width:520px;margin:0 auto;min-height:100vh;padding:env(safe-area-inset-top) 14px calc(88px + env(safe-area-inset-bottom))}
.topbar{display:flex;justify-content:space-between;align-items:center;padding:14px 2px 10px}.brand{font-weight:900;letter-spacing:.4px}.brand span{color:var(--blue)}
.card{background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:0 12px 28px rgba(0,0,0,.22);margin-bottom:12px}
.hero{position:relative;overflow:hidden}.hero:after{content:"";position:absolute;right:-50px;top:-70px;width:170px;height:170px;border-radius:50%;background:rgba(57,160,255,.12)}
.row{display:flex;gap:10px;align-items:center}.between{justify-content:space-between}.muted{color:var(--muted)}.tiny{font-size:12px}.small{font-size:14px}.big{font-size:28px;font-weight:900}.statgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat{background:#091523;border:1px solid var(--line);border-radius:14px;padding:10px}.stat b{display:block;font-size:18px;margin-top:3px}
.btn{border:0;border-radius:13px;padding:12px 14px;font-weight:800;color:#06111f;background:var(--blue);cursor:pointer}.btn.secondary{background:#172b44;color:var(--text);border:1px solid var(--line)}.btn.green{background:var(--green)}.btn.gold{background:var(--gold)}.btn.red{background:var(--red)}.btn:disabled{opacity:.45}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:9px}.full{grid-column:1/-1}.progress{height:10px;background:#07111f;border:1px solid var(--line);border-radius:999px;overflow:hidden}.progress>i{display:block;height:100%;background:linear-gradient(90deg,var(--blue),var(--green));width:0}
.badge{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:6px 9px;background:#162b44;border:1px solid var(--line);font-size:12px;font-weight:800}.hot{color:#ffcb57}.good{color:var(--green)}.bad{color:var(--red)}
.nav{position:fixed;left:0;right:0;bottom:0;background:rgba(7,17,31,.96);backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:8px max(10px,env(safe-area-inset-left)) calc(8px + env(safe-area-inset-bottom));display:flex;justify-content:center;z-index:20}.navin{width:min(520px,100%);display:grid;grid-template-columns:repeat(5,1fr);gap:4px}.nav button{background:transparent;color:var(--muted);border:0;padding:8px 2px;border-radius:10px;font-size:11px;font-weight:800}.nav button.active{background:#142840;color:var(--text)}
.field{margin-bottom:12px}.field label{display:block;font-size:13px;color:var(--muted);margin-bottom:6px}.field input,.field select{width:100%;padding:12px;border-radius:12px;background:#091523;color:var(--text);border:1px solid var(--line)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.rating{display:grid;grid-template-columns:90px 1fr 42px;align-items:center;gap:8px;margin:9px 0}.rating .progress{height:8px}.headline{border-left:3px solid var(--blue);padding:8px 10px;background:#0a1727;border-radius:0 10px 10px 0;margin:8px 0}.headline.hotline{border-color:var(--gold)}
.tabs{display:flex;gap:7px;overflow:auto;margin-bottom:10px}.tab{white-space:nowrap;border:1px solid var(--line);background:#0a1727;color:var(--muted);border-radius:999px;padding:8px 11px;font-weight:800}.tab.active{background:var(--blue);color:#06111f}
table{width:100%;border-collapse:collapse;font-size:12px}th,td{padding:9px 6px;border-bottom:1px solid #1f344d;text-align:right}th:first-child,td:first-child{text-align:left}.scroll{overflow:auto}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.72);display:flex;align-items:flex-end;justify-content:center;z-index:50}.sheet{width:min(520px,100%);max-height:88vh;overflow:auto;background:#0a1727;border:1px solid var(--line);border-radius:22px 22px 0 0;padding:18px 14px calc(18px + env(safe-area-inset-bottom))}.choice{padding:13px;border:1px solid var(--line);background:#0e1e31;border-radius:14px;margin:8px 0;cursor:pointer}.choice:hover{border-color:var(--blue)}
.notice{padding:10px;border-radius:12px;background:#1b2d16;border:1px solid #365e2b;color:#c9f6b9}.danger{background:#31191c;border-color:#613039;color:#ffd3d8}
@media(min-width:700px){.shell{padding-top:24px}.nav{position:sticky;bottom:0;border:1px solid var(--line);border-radius:16px;margin-top:18px}.shell{padding-bottom:24px}}
</style>
</head>
<body>
<div id="app"></div>
<script>const $=s=>document.querySelector(s);const clamp=(n,a,b)=>Math.max(a,Math.min(b,n));const rnd=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;const pick=a=>a[Math.floor(Math.random()*a.length)];
const positions=['SP','RP','CP','C','1B','2B','3B','SS','LF','CF','RF','DH','Two-Way'];
const posTypes={SP:'pitcher',RP:'pitcher',CP:'pitcher','Two-Way':'two',C:'hitter','1B':'hitter','2B':'hitter','3B':'hitter',SS:'hitter',LF:'hitter',CF:'hitter',RF:'hitter',DH:'hitter'};
const teams=['Woodbury Knights','Gloucester Lions','Burlington Falcons','Camden Tech','Cherry Hill West','South Jersey Prep'];
const colleges=['Garden State University','Coastal Carolina Tech','Metro Atlantic','Pine Valley College','Southern Bay University','Liberty Plains'];
const defaultRatings={contact:38,power:34,discipline:33,speed:40,fielding:37,arm:40,durability:42,clutch:36,iq:35,velocity:40,movement:34,control:32,stamina:38};
let state=load()||{screen:'create',tab:'home'};
function save(){localStorage.setItem('diamondLegacySave',JSON.stringify(state))}
function load(){try{return JSON.parse(localStorage.getItem('diamondLegacySave'))}catch(e){return null}}
function newCareer(form){const fd=new FormData(form);const p=fd.get('position');let r={...defaultRatings};if(['SS','CF','2B'].includes(p)){r.speed+=5;r.fielding+=4}if(['1B','3B','RF','DH'].includes(p)){r.power+=6}if(p==='C'){r.arm+=6;r.durability+=3}if(posTypes[p]==='pitcher'||p==='Two-Way'){r.velocity+=5;r.control+=2;r.stamina+=p==='SP'?6:0}
 state={screen:'game',tab:'home',week:1,year:1,age:15,season:'Freshman',team:pick(teams),player:{name:fd.get('name')||'Alex Carter',position:p,bats:fd.get('bats'),throws:fd.get('throws'),overall:38,potential:rnd(82,96),ratings:r,energy:100,health:100,confidence:45,heat:0,attention:0,cash:250,followers:12,equipment:{bat:'School-issued bat',glove:'Entry glove',cleats:'Basic cleats'}},seasonStats:blankStats(),career:[],gameLog:[],headlines:['You made varsity as a 15-year-old freshman. Coaches expect growing pains, but scouts love upside.'],offers:[],showcases:[],investments:[],trainingPoints:2};save();render()}
function blankStats(){return{G:0,AB:0,H:0,'2B':0,'3B':0,HR:0,RBI:0,BB:0,SO:0,SB:0,CS:0,IP:0,ER:0,K:0,W:0,L:0,SV:0,H_allowed:0,BB_allowed:0,fieldChances:0,errors:0}}
function overall(){const r=state.player.ratings;const t=posTypes[state.player.position];let vals=t==='pitcher'?[r.velocity,r.movement,r.control,r.stamina,r.clutch,r.durability]:t==='two'?[r.contact,r.power,r.speed,r.fielding,r.arm,r.velocity,r.control]:[r.contact,r.power,r.discipline,r.speed,r.fielding,r.arm,r.clutch];state.player.overall=Math.round(vals.reduce((a,b)=>a+b,0)/vals.length)}
function simWeek(){if(state.player.energy<20){alert('You are exhausted. Rest or train lightly first.');return}let games=rnd(2,4);for(let i=0;i<games;i++)simGame();state.week++;state.player.energy=clamp(state.player.energy-rnd(10,18),0,100);state.player.confidence=clamp(state.player.confidence+rnd(-4,5),0,100);updateHeat();maybeAttention();maybeEvent();if(state.week>12)endSeason();overall();save();render()}
function simGame(){const p=state.player,r=p.ratings,t=posTypes[p.position],hot=p.heat/10,opp=rnd(34,52);let line='';if(t==='hitter'||t==='two'){
 const pa=rnd(3,5),hits=[];let H=0,HR=0,BB=0,SO=0,RBI=0,d2=0,d3=0,SB=0;for(let a=0;a<pa;a++){let hitChance=.14+(r.contact-opp)/180+r.discipline/600+hot*.02;let roll=Math.random();if(roll<hitChance){H++;let xb=Math.random()+r.power/250;if(xb>1.18){HR++;RBI+=rnd(1,3)}else if(xb>1.0){d3++}else if(xb>.82){d2++}if(Math.random()<r.speed/220)SB++}else if(roll<hitChance+.08+r.discipline/700){BB++}else if(Math.random()<.30-r.discipline/500){SO++}}
 Object.assign(state.seasonStats,{G:state.seasonStats.G+1,AB:state.seasonStats.AB+pa-BB,H:state.seasonStats.H+H,'2B':state.seasonStats['2B']+d2,'3B':state.seasonStats['3B']+d3,HR:state.seasonStats.HR+HR,RBI:state.seasonStats.RBI+RBI,BB:state.seasonStats.BB+BB,SO:state.seasonStats.SO+SO,SB:state.seasonStats.SB+SB});line=`${H}-for-${pa-BB}${HR?`, ${HR} HR`:''}${RBI?`, ${RBI} RBI`:''}${BB?`, ${BB} BB`:''}`;
 }
 if(t==='pitcher'||t==='two'){let ip=t==='two'?rnd(1,3):(p.position==='SP'?rnd(4,7):rnd(1,2));let dominance=(r.velocity+r.movement+r.control)/3-opp+hot*3;let er=clamp(Math.round(ip*(.55-dominance/140)+Math.random()*1.4),0,8),k=clamp(Math.round(ip*(.8+(r.velocity-35)/55)+Math.random()*2),0,15),ha=clamp(Math.round(ip*(1.05-dominance/120)+Math.random()*2),0,15),bb=clamp(Math.round(ip*(.35-(r.control-35)/130)+Math.random()),0,7);state.seasonStats.IP+=ip;state.seasonStats.ER+=er;state.seasonStats.K+=k;state.seasonStats.H_allowed+=ha;state.seasonStats.BB_allowed+=bb;if(er<=2&&Math.random()>.45)state.seasonStats.W++;else if(er>=4&&Math.random()>.5)state.seasonStats.L++;if(p.position==='CP'&&er===0)state.seasonStats.SV++;line+=(line?' | ':'')+`${ip} IP, ${er} ER, ${k} K`}
 state.gameLog.unshift({week:state.week,line});state.gameLog=state.gameLog.slice(0,30)}
function updateHeat(){const recent=state.gameLog.slice(0,3).join?.('')||'';let delta=rnd(-2,3);const s=state.seasonStats;if(posTypes[state.player.position]!=='pitcher'&&s.AB>0&&s.H/s.AB>.33)delta+=2;if(s.IP>0&&s.ER*7/s.IP<2.5)delta+=2;state.player.heat=clamp(state.player.heat+delta,0,10)}
function maybeAttention(){const p=state.player,s=state.seasonStats;let perf=0;if(s.AB>8)perf+=(s.H/s.AB)*70+s.HR*2;if(s.IP>3)perf+=Math.max(0,30-(s.ER*7/s.IP)*4)+s.K*.7;perf+=p.heat*3+p.overall*.4;if(perf>45&&Math.random()<.38){let gain=rnd(4,12);p.attention=clamp(p.attention+gain,0,100);p.followers+=rnd(10,80);state.headlines.unshift(`${pick(['Regional scout','Showcase director','College assistant coach'])} noticed your recent run. Recruiting attention +${gain}.`);if(p.attention>20&&state.showcases.length<2)state.showcases.push({name:pick(['South Jersey Underclass Showcase','Mid-Atlantic Future Stars Camp']),cost:75,boost:12});if(p.attention>35&&state.offers.length<2)state.offers.push({school:pick(colleges),interest:rnd(30,55),type:'Early interest'})}}
function maybeEvent(){if(Math.random()>.35)return;const ev=pick(['coach','rest','gear','slump']);if(ev==='coach'){state.trainingPoints++;state.headlines.unshift('Your varsity coach stayed late to work with you. +1 training point.')}if(ev==='rest'){state.player.energy=clamp(state.player.energy+12,0,100);state.headlines.unshift('A rainout gave you extra recovery. Energy restored.')}if(ev==='gear'){state.player.cash+=50;state.headlines.unshift('You helped at a youth clinic and earned $50.')}if(ev==='slump'){state.player.confidence=clamp(state.player.confidence-6,0,100);state.headlines.unshift('A rough practice shook your confidence. Respond next week.')}}
function train(key){if(state.trainingPoints<1)return;state.player.ratings[key]=clamp(state.player.ratings[key]+rnd(1,3),1,99);state.trainingPoints--;state.player.energy=clamp(state.player.energy-6,0,100);overall();save();render()}
function rest(){state.player.energy=clamp(state.player.energy+28,0,100);state.player.health=clamp(state.player.health+5,0,100);state.week++;save();render()}
function attendShowcase(i){const sh=state.showcases[i];if(state.player.cash<sh.cost)return alert('Not enough cash.');state.player.cash-=sh.cost;let result=rnd(5,18)+Math.round(state.player.heat/2);state.player.attention=clamp(state.player.attention+result,0,100);state.player.confidence=clamp(state.player.confidence+rnd(-2,7),0,100);state.headlines.unshift(`You attended ${sh.name}. Recruiting attention +${result}.`);state.showcases.splice(i,1);save();render()}
function buy(type,name,cost,bonus,key){if(state.player.cash<cost)return alert('Not enough cash.');state.player.cash-=cost;state.player.equipment[type]=name;state.player.ratings[key]=clamp(state.player.ratings[key]+bonus,1,99);overall();save();render()}
function endSeason(){state.career.push({year:state.year,age:state.age,stage:state.season,team:state.team,position:state.player.position,stats:{...state.seasonStats}});state.year++;state.age++;state.week=1;state.season=['Freshman','Sophomore','Junior','Senior'][Math.min(3,state.year-1)];state.seasonStats=blankStats();state.gameLog=[];state.player.energy=100;state.trainingPoints+=4;Object.keys(state.player.ratings).forEach(k=>state.player.ratings[k]=clamp(state.player.ratings[k]+rnd(1,3),1,99));state.headlines.unshift(`Freshman season complete. You are now a ${state.season.toLowerCase()} and one year stronger.`)}
function avg(){const s=state.seasonStats;return s.AB?(s.H/s.AB).toFixed(3).replace(/^0/,''):'.000'}function era(){const s=state.seasonStats;return s.IP?(s.ER*7/s.IP).toFixed(2):'0.00'}
function render(){const app=$('#app');if(state.screen==='create'){app.innerHTML=createScreen();$('#createForm').onsubmit=e=>{e.preventDefault();newCareer(e.target)};return}app.innerHTML=`<main class="shell">${topbar()}${view()}</main>${nav()}${state.modal||''}`;bind()}
function createScreen(){return `<main class="shell"><div class="topbar"><div class="brand">DIAMOND <span>LEGACY</span></div><span class="badge">v0.1</span></div><section class="card hero"><div class="muted small">BEGIN YOUR CAREER</div><div class="big">Age 15. Varsity freshman.</div><p class="muted">You are raw, overlooked, and full of upside. One hot stretch can put you on the radar immediately.</p></section><form id="createForm" class="card"><div class="field"><label>Player name</label><input name="name" value="Alex Carter" maxlength="24"></div><div class="field"><label>Primary position</label><select name="position">${positions.map(x=>`<option>${x}</option>`).join('')}</select></div><div class="grid2"><div class="field"><label>Bats</label><select name="bats"><option>Right</option><option>Left</option><option>Switch</option></select></div><div class="field"><label>Throws</label><select name="throws"><option>Right</option><option>Left</option></select></div></div><button class="btn full" type="submit">Start Freshman Season</button></form></main>`}
function topbar(){return `<div class="topbar"><div class="brand">DIAMOND <span>LEGACY</span></div><span class="badge">${state.season} • Age ${state.age}</span></div>`}
function nav(){return `<nav class="nav"><div class="navin">${[['home','Home'],['player','Player'],['stats','Stats'],['career','Career'],['money','Money']].map(([k,l])=>`<button data-tab="${k}" class="${state.tab===k?'active':''}">${l}</button>`).join('')}</div></nav>`}
function view(){return ({home:homeView,player:playerView,stats:statsView,career:careerView,money:moneyView}[state.tab]||homeView)()}
function homeView(){const p=state.player,s=state.seasonStats;return `<section class="card hero"><div class="row between"><div><div class="muted small">${state.team} • ${p.position}</div><div class="big">${p.name}</div></div><div><div class="muted tiny">OVR</div><div class="big">${p.overall}</div></div></div><div class="row" style="margin-top:12px"><span class="badge ${p.heat>=7?'hot':''}">${p.heat>=7?'🔥 Hot streak':`Heat ${p.heat}/10`}</span><span class="badge">Week ${state.week}/12</span></div></section><section class="card"><div class="row between"><b>Recruiting attention</b><b>${p.attention}%</b></div><div class="progress"><i style="width:${p.attention}%"></i></div><p class="muted small">Strong weeks, showcases, and standout games create early college and scout interest.</p></section><section class="card"><div class="statgrid">${posTypes[p.position]==='pitcher'?`<div class="stat"><span class="muted tiny">ERA</span><b>${era()}</b></div><div class="stat"><span class="muted tiny">K</span><b>${s.K}</b></div><div class="stat"><span class="muted tiny">W-L</span><b>${s.W}-${s.L}</b></div>`:`<div class="stat"><span class="muted tiny">AVG</span><b>${avg()}</b></div><div class="stat"><span class="muted tiny">HR</span><b>${s.HR}</b></div><div class="stat"><span class="muted tiny">RBI</span><b>${s.RBI}</b></div>`}</div></section><section class="card"><div class="actions"><button class="btn green full" id="sim">Simulate Week</button><button class="btn secondary" id="rest">Rest Week</button><button class="btn secondary" data-tabgo="player">Train Player</button></div></section>${state.showcases.length?`<section class="card"><b>Showcase opportunities</b>${state.showcases.map((x,i)=>`<div class="choice"><div class="row between"><div><b>${x.name}</b><div class="muted tiny">Cost $${x.cost}</div></div><button class="btn gold" data-showcase="${i}">Attend</button></div></div>`).join('')}</section>`:''}<section class="card"><b>Latest news</b>${state.headlines.slice(0,5).map((h,i)=>`<div class="headline ${i===0&&p.heat>=7?'hotline':''}">${h}</div>`).join('')}</section>`}
function playerView(){const r=state.player.ratings;const keys=posTypes[state.player.position]==='pitcher'?['velocity','movement','control','stamina','clutch','durability']:posTypes[state.player.position]==='two'?['contact','power','speed','fielding','arm','velocity','control']:['contact','power','discipline','speed','fielding','arm','clutch','durability','iq'];return `<section class="card"><div class="row between"><div><b>Player development</b><div class="muted small">Training points: ${state.trainingPoints}</div></div><span class="badge">Potential ${state.player.potential}</span></div>${keys.map(k=>`<div class="rating"><span>${cap(k)}</span><div class="progress"><i style="width:${r[k]}%"></i></div><button class="btn secondary" data-train="${k}" ${state.trainingPoints<1?'disabled':''}>${r[k]}</button></div>`).join('')}</section><section class="card"><b>Equipment</b><div class="choice"><div class="row between"><div><b>Maple training bat</b><div class="muted tiny">+2 Power • $150</div></div><button class="btn" data-buy="bat|Maple training bat|150|2|power">Buy</button></div></div><div class="choice"><div class="row between"><div><b>Pro-style glove</b><div class="muted tiny">+2 Fielding • $175</div></div><button class="btn" data-buy="glove|Pro-style glove|175|2|fielding">Buy</button></div></div><div class="choice"><div class="row between"><div><b>Lightweight cleats</b><div class="muted tiny">+2 Speed • $125</div></div><button class="btn" data-buy="cleats|Lightweight cleats|125|2|speed">Buy</button></div></div></section>`}
function statsView(){const p=state.player,s=state.seasonStats;let hitter=`<table><tr><th>G</th><th>AB</th><th>H</th><th>AVG</th><th>HR</th><th>RBI</th><th>BB</th><th>SO</th><th>SB</th></tr><tr><td>${s.G}</td><td>${s.AB}</td><td>${s.H}</td><td>${avg()}</td><td>${s.HR}</td><td>${s.RBI}</td><td>${s.BB}</td><td>${s.SO}</td><td>${s.SB}</td></tr></table>`;let pit=`<table><tr><th>IP</th><th>ERA</th><th>W</th><th>L</th><th>SV</th><th>K</th><th>H</th><th>BB</th></tr><tr><td>${s.IP}</td><td>${era()}</td><td>${s.W}</td><td>${s.L}</td><td>${s.SV}</td><td>${s.K}</td><td>${s.H_allowed}</td><td>${s.BB_allowed}</td></tr></table>`;return `<section class="card"><div class="tabs"><button class="tab active">Current season</button><button class="tab">Career history</button></div><b>${state.season} Varsity Stats</b><div class="scroll" style="margin-top:10px">${posTypes[p.position]==='two'?hitter+pit:posTypes[p.position]==='pitcher'?pit:hitter}</div></section><section class="card"><b>Recent game log</b>${state.gameLog.length?state.gameLog.map(g=>`<div class="headline"><span class="muted tiny">Week ${g.week}</span><br>${g.line}</div>`).join(''):'<p class="muted">No games played yet.</p>'}</section><section class="card"><b>Career seasons</b><div class="scroll"><table><tr><th>Year</th><th>Stage</th><th>Team</th><th>Key line</th></tr>${state.career.map(c=>`<tr><td>${c.year}</td><td>${c.stage}</td><td>${c.team}</td><td>${careerLine(c)}</td></tr>`).join('')||'<tr><td colspan="4" class="muted">Your first season is underway.</td></tr>'}</table></div></section>`}
function careerLine(c){return posTypes[c.position]==='pitcher'?`${c.stats.IP} IP, ${(c.stats.IP?c.stats.ER*7/c.stats.IP:0).toFixed(2)} ERA`:`${c.stats.AB?(c.stats.H/c.stats.AB).toFixed(3):'.000'}, ${c.stats.HR} HR`}
function careerView(){return `<section class="card"><b>Recruiting & career path</b><p class="muted small">A freshman can receive early interest, but formal decisions come later. Strong performance builds a bigger pool of colleges, showcases, and eventually pro attention.</p><div class="statgrid"><div class="stat"><span class="muted tiny">Attention</span><b>${state.player.attention}%</b></div><div class="stat"><span class="muted tiny">Followers</span><b>${state.player.followers}</b></div><div class="stat"><span class="muted tiny">Potential</span><b>${state.player.potential}</b></div></div></section><section class="card"><b>College interest</b>${state.offers.length?state.offers.map(o=>`<div class="choice"><b>${o.school}</b><div class="muted small">${o.type} • Interest ${o.interest}%</div></div>`).join(''):'<p class="muted">No schools have contacted you yet. Get hot, attend showcases, and keep improving.</p>'}</section><section class="card"><b>Current roadmap</b>${['Freshman varsity','Sophomore development','Junior recruiting','Senior decisions','College or pro baseball'].map((x,i)=>`<div class="headline">${i<state.year?'✓ ':''}${x}</div>`).join('')}</section>`}
function moneyView(){const p=state.player;return `<section class="card hero"><div class="muted small">AVAILABLE CASH</div><div class="big">$${p.cash.toLocaleString()}</div><p class="muted small">At 15, money comes from clinics, odd jobs, and small local opportunities. Investments unlock later in your career.</p></section><section class="card"><b>Current equipment</b>${Object.entries(p.equipment).map(([k,v])=>`<div class="row between" style="padding:9px 0;border-bottom:1px solid var(--line)"><span>${cap(k)}</span><b>${v}</b></div>`).join('')}</section><section class="card"><b>Future finance system</b><div class="headline">NIL opportunities in college</div><div class="headline">Signing bonus and contracts</div><div class="headline">Real estate and business investments</div><div class="headline">Monthly passive income</div></section><button class="btn red full" id="reset">Delete Career</button>`}
function cap(s){return s.replace(/_/g,' ').replace(/\b\w/g,c=>c.toUpperCase())}
function bind(){document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{state.tab=b.dataset.tab;save();render()});document.querySelectorAll('[data-tabgo]').forEach(b=>b.onclick=()=>{state.tab=b.dataset.tabgo;save();render()});$('#sim')&&($('#sim').onclick=simWeek);$('#rest')&&($('#rest').onclick=rest);document.querySelectorAll('[data-train]').forEach(b=>b.onclick=()=>train(b.dataset.train));document.querySelectorAll('[data-showcase]').forEach(b=>b.onclick=()=>attendShowcase(+b.dataset.showcase));document.querySelectorAll('[data-buy]').forEach(b=>b.onclick=()=>{let [t,n,c,bo,k]=b.dataset.buy.split('|');buy(t,n,+c,+bo,k)});$('#reset')&&($('#reset').onclick=()=>{if(confirm('Delete this career and start over?')){localStorage.removeItem('diamondLegacySave');state={screen:'create',tab:'home'};render()}})}
render();
</script>
</body>
</html>
