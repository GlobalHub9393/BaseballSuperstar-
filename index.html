<html lang="en">

<style>

button,input,select{font:inherit}button{cursor:pointer}.hidden{display:none!important}.muted{color:var(--muted)}.tiny{font-size:.72rem}.center{text-align:center}
.good-text{color:var(--good)}.warn-text{color:var(--warn)}.bad-text{color:var(--bad)}
.app{max-width:1020px;margin:auto;padding:16px 13px 30px}.topbar{position:sticky;top:0;z-index:15;background:rgba(6,16,26,.9);backdrop-filter:blur(16px);border-bottom:1px solid rgba(35,59,83,.8)}
.topbar-inner{max-width:1020px;margin:auto;padding:9px 13px;display:flex;align-items:center;justify-content:space-between;gap:10px}.brand{font-weight:950;letter-spacing:-.03em}.brand small{display:block;font-size:.6rem;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}.top-actions{display:flex;gap:7px}
.card{background:linear-gradient(180deg,var(--panel),#0a1723);border:1px solid var(--line);border-radius:var(--radius);padding:15px;box-shadow:0 10px 28px rgba(0,0,0,.16)}
.card h2,.card h3{margin:0 0 9px}.card h2{font-size:1.22rem}.card h3{font-size:.96rem}.hero{padding:23px 17px;border-radius:24px;background:radial-gradient(circle at 85% 12%,rgba(101,207,255,.2),transparent 34%),linear-gradient(145deg,#10263a,#0a1724);border:1px solid #2e5371;box-shadow:var(--shadow)}
.kicker,.eyebrow{font-size:.68rem;text-transform:uppercase;letter-spacing:.13em;color:var(--accent);font-weight:900}.hero h1{margin:6px 0 5px;font-size:clamp(2rem,8vw,3.7rem);line-height:.95;letter-spacing:-.055em}.hero p{margin:0;color:var(--muted);line-height:1.5;font-size:.92rem}
.grid{display:grid;gap:13px}.grid.two{grid-template-columns:repeat(2,minmax(0,1fr))}.grid.three{grid-template-columns:repeat(3,minmax(0,1fr))}.grid.four{grid-template-columns:repeat(4,minmax(0,1fr))}
.section-title{display:flex;align-items:end;justify-content:space-between;gap:10px;margin:21px 2px 9px}.section-title h2{margin:0;font-size:1.22rem}.section-title span{font-size:.72rem;color:var(--muted)}
.btn{border:0;border-radius:13px;padding:11px 14px;font-weight:900;color:#04111b;background:linear-gradient(135deg,#7bd8ff,#5da8ff);box-shadow:0 8px 20px rgba(93,168,255,.22)}.btn:disabled{opacity:.42;cursor:not-allowed}.btn.secondary{color:var(--text);background:#13263a;border:1px solid var(--line);box-shadow:none}.btn.good{background:linear-gradient(135deg,#78e4a8,#52c880)}.btn.warn{background:linear-gradient(135deg,#f7dd85,#ecb950)}.btn.bad{background:linear-gradient(135deg,#ffaaaa,#ff7171)}.btn.small{padding:7px 9px;border-radius:10px;font-size:.7rem}.btn.block{width:100%}
label{display:block;color:var(--muted);font-size:.67rem;font-weight:850;text-transform:uppercase;letter-spacing:.07em;margin:0 0 5px}input,select{width:100%;padding:11px 12px;border-radius:12px;border:1px solid var(--line);background:#081521;color:var(--text);outline:none}input:focus,select:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(101,207,255,.11)}.form-row{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px;margin-bottom:11px}
.pill{display:inline-flex;align-items:center;gap:5px;padding:5px 8px;border-radius:999px;border:1px solid var(--line);background:#102236;font-size:.67rem;font-weight:850;color:#dcecff}.pill.good{color:#8bf0b5}.pill.warn{color:#f6dc87}.pill.bad{color:#ffaaaa}.pill.purple{color:#d3bcff}
.stat-strip{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:7px;margin-top:12px}.mini{padding:9px 7px;border-radius:13px;background:#081521;border:1px solid var(--line);text-align:center}.mini b{display:block;font-size:1.04rem}.mini span{font-size:.58rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.dashboard{display:grid;grid-template-columns:1.18fr .82fr;gap:13px}.player-head{display:flex;align-items:center;gap:12px}.avatar{width:61px;height:61px;display:grid;place-items:center;border-radius:18px;background:linear-gradient(145deg,#224968,#10283b);border:1px solid #345c7b;font-size:1.65rem}.player-name{font-size:1.45rem;font-weight:950;letter-spacing:-.035em}.player-meta{color:var(--muted);font-size:.78rem}.ovr{font-size:3.1rem;font-weight:950;line-height:.83;color:var(--accent);text-shadow:0 0 22px rgba(101,207,255,.24)}.ovr-label{font-size:.6rem;color:var(--muted);text-transform:uppercase;letter-spacing:.12em}
.metric{margin:11px 0}.metric-line{display:flex;justify-content:space-between;font-size:.72rem;margin-bottom:5px}.metric-line span:last-child{font-weight:850}.meter{height:9px;border-radius:999px;overflow:hidden;border:1px solid #1e3850;background:#06111b}.meter>i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,#57a9ff,#65dec4)}.meter.warn>i{background:linear-gradient(90deg,#eeb446,#f3db7d)}.meter.bad>i{background:linear-gradient(90deg,#ff7474,#ffae72)}.meter.purple>i{background:linear-gradient(90deg,#936bff,#caabff)}
.action-hero{position:relative;overflow:hidden;border-color:#376887;background:radial-gradient(circle at 88% 13%,rgba(101,207,255,.21),transparent 33%),linear-gradient(145deg,#102b42,#0b1b2a)}.action-label{font-size:.67rem;color:var(--accent);font-weight:900;letter-spacing:.12em;text-transform:uppercase}.action-title{font-size:1.55rem;font-weight:950;letter-spacing:-.035em;margin:5px 0}.action-copy{font-size:.81rem;color:var(--muted);line-height:1.5;margin:0 0 13px}.primary-action{width:100%;padding:14px;font-size:.9rem}
.week-path{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}.path-step{padding:8px 5px;text-align:center;border:1px solid var(--line);background:#091723;border-radius:12px;font-size:.59rem;color:var(--muted);font-weight:800}.path-step b{display:block;font-size:.9rem;margin-bottom:2px}.path-step.done{color:#8beab1;border-color:#2c6b4d;background:#0d241a}.path-step.current{color:#8edaff;border-color:#39779e;background:#10283b}.path-step.locked{opacity:.5}
.reminder{display:flex;gap:10px;align-items:flex-start;padding:11px;border-radius:14px;border:1px solid #31506b;background:#0e2132;margin-top:9px}.reminder-icon{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;background:#17324a;flex:0 0 auto}.reminder b{font-size:.79rem}.reminder p{margin:3px 0 0;color:var(--muted);font-size:.7rem;line-height:1.4}
.news{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid rgba(35,59,83,.65)}.news:last-child{border-bottom:0}.news-icon{width:34px;height:34px;border-radius:11px;background:#13283d;display:grid;place-items:center;flex:0 0 auto;font-size:.82rem}.news b{font-size:.79rem}.news p{margin:3px 0 0;color:var(--muted);font-size:.7rem;line-height:1.4}
.choice-grid{display:grid;gap:8px}.choice{width:100%;text-align:left;padding:11px 12px;border-radius:12px;border:1px solid #2b4965;background:#10263a;color:var(--text)}.choice:hover{border-color:var(--accent)}.choice b{display:block;font-size:.83rem}.choice small{display:block;color:var(--muted);margin-top:3px;font-size:.68rem;line-height:1.35}.choice.selected{border-color:var(--good);background:#102b20;box-shadow:inset 0 0 0 1px rgba(91,213,142,.25)}
.plan-card{padding:12px;border-radius:15px;border:1px solid var(--line);background:#091722;margin-bottom:8px}.plan-card.selected{border-color:var(--accent);background:#10273a}.plan-top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}.plan-card h3{margin:0;font-size:.88rem}.plan-card p{margin:4px 0 7px;color:var(--muted);font-size:.68rem;line-height:1.4}.tag-row{display:flex;flex-wrap:wrap;gap:5px}
.attr-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.attr{padding:10px;border:1px solid var(--line);background:#081521;border-radius:13px}.attr-top{display:flex;justify-content:space-between;font-size:.72rem;margin-bottom:6px}.attr-top b{font-size:.8rem}.xp-line{font-size:.62rem;color:var(--muted);margin-top:5px}
.table-wrap{overflow:auto;border-radius:14px;border:1px solid var(--line)}table{width:100%;border-collapse:collapse;min-width:680px;background:#081521}th,td{padding:9px 10px;border-bottom:1px solid #1b3248;text-align:right;font-size:.68rem}th:first-child,td:first-child{text-align:left}th{color:var(--muted);background:#102238;position:sticky;top:0}tr:last-child td{border-bottom:0}
.timeline{position:relative;padding-left:18px}.timeline:before{content:"";position:absolute;left:5px;top:5px;bottom:5px;width:2px;background:#213b52}.timeline-item{position:relative;padding:0 0 15px 10px}.timeline-item:before{content:"";position:absolute;left:-17px;top:5px;width:8px;height:8px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 4px #0d1a27}.timeline-item b{font-size:.78rem}.timeline-item p{margin:3px 0 0;color:var(--muted);font-size:.68rem;line-height:1.4}.timeline-item time{font-size:.61rem;color:var(--accent);text-transform:uppercase;font-weight:850}
.record-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.record{background:#081521;border:1px solid var(--line);border-radius:13px;padding:10px}.record b{display:block;font-size:1.1rem}.record span{font-size:.64rem;color:var(--muted)}
.offer{padding:12px;border-radius:15px;background:#091722;border:1px solid var(--line);margin-bottom:9px}.offer-top{display:flex;justify-content:space-between;gap:8px}.offer h3{margin:0;font-size:.88rem}.offer p{margin:4px 0;color:var(--muted);font-size:.68rem}.offer-metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin-top:8px}.offer-metrics div{text-align:center;background:#0e2030;border-radius:9px;padding:6px 3px}.offer-metrics b{display:block;font-size:.76rem}.offer-metrics span{font-size:.55rem;color:var(--muted)}
.schedule-item{display:grid;grid-template-columns:42px 1fr auto;gap:9px;align-items:center;padding:9px 0;border-bottom:1px solid rgba(35,59,83,.65)}.schedule-item:last-child{border-bottom:0}.schedule-week{text-align:center;border-radius:10px;background:#102338;padding:6px 3px}.schedule-week b{display:block}.schedule-week span{font-size:.55rem;color:var(--muted)}
.game-result{padding:14px;border-radius:17px;border:1px solid #2c4c67;background:radial-gradient(circle at 85% 15%,rgba(91,213,142,.13),transparent 35%),#0c1d2c}.result-line{font-size:1.25rem;font-weight:950;margin:4px 0}.game-result p{font-size:.72rem;color:var(--muted);line-height:1.45}
.save-slot{padding:14px;border-radius:17px;border:1px solid var(--line);background:#091722}.save-slot.active{border-color:var(--accent);box-shadow:0 0 0 2px rgba(101,207,255,.09)}.save-slot h3{margin:0}.save-slot p{margin:4px 0 10px;color:var(--muted);font-size:.72rem}.slot-actions{display:flex;gap:7px;flex-wrap:wrap}
.toggle-row{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid rgba(35,59,83,.65)}.toggle-row:last-child{border-bottom:0}.toggle-row b{font-size:.78rem}.toggle-row p{margin:2px 0 0;color:var(--muted);font-size:.66rem}.switch{position:relative;width:45px;height:25px;flex:0 0 auto}.switch input{opacity:0;width:0;height:0}.slider{position:absolute;inset:0;background:#24384d;border-radius:999px;transition:.2s}.slider:before{content:"";position:absolute;width:19px;height:19px;left:3px;top:3px;border-radius:50%;background:white;transition:.2s}.switch input:checked+.slider{background:#4da9dd}.switch input:checked+.slider:before{transform:translateX(20px)}
.modal{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:16px;background:rgba(2,7,12,.78)}.modal-card{width:min(600px,100%);max-height:89vh;overflow:auto;background:#0d1b29;border:1px solid #31516e;border-radius:22px;padding:17px;box-shadow:var(--shadow)}.modal-card h2{margin:6px 0 8px}.modal-choice{width:100%;text-align:left;color:var(--text);background:#10263a;border:1px solid #2a4863;border-radius:13px;padding:11px;margin-top:8px}.modal-choice b{display:block}.modal-choice small{display:block;color:var(--muted);font-size:.67rem;margin-top:3px}.notification{padding:10px;border-radius:12px;background:#14283c;border:1px solid #2f4e69;color:#cde9ff;font-size:.7rem;line-height:1.4;margin:10px 0}
.toast{position:fixed;left:50%;bottom:103px;z-index:70;transform:translateX(-50%) translateY(16px);opacity:0;pointer-events:none;background:#edf8ff;color:#07111b;padding:9px 13px;border-radius:11px;font-weight:900;font-size:.72rem;transition:.22s}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(7,17,27,.96);backdrop-filter:blur(17px);border-top:1px solid var(--line);padding:7px 6px calc(7px + env(safe-area-inset-bottom))}.nav-inner{max-width:780px;margin:auto;display:grid;grid-template-columns:repeat(6,1fr);gap:3px}.nav button{position:relative;border:0;background:transparent;color:#778da3;padding:6px 1px;border-radius:10px;font-size:.57rem;font-weight:850}.nav button span{display:block;font-size:1.13rem;margin-bottom:1px}.nav button.active{color:var(--accent);background:#102338}.badge{position:absolute;top:2px;right:18%;min-width:15px;height:15px;padding:0 3px;border-radius:999px;background:#ff7878;color:white;display:grid;place-items:center;font-size:.52rem;font-weight:950}
.start-wrap{max-width:860px;margin:28px auto;padding:0 13px}.start-logo{text-align:center;margin-bottom:18px}.start-logo h1{font-size:clamp(2.6rem,10vw,5rem);line-height:.88;margin:7px 0;letter-spacing:-.065em}.start-logo p{color:var(--muted);margin:0}.version{display:inline-block;padding:5px 9px;border:1px solid var(--line);border-radius:999px;color:var(--accent);font-size:.65rem;font-weight:900}
body.reduce-motion *,body.reduce-motion *:before,body.reduce-motion *:after{scroll-behavior:auto!important;transition:none!important;animation:none!important}
@media(max-width:780px){.dashboard,.grid.two,.grid.three,.grid.four{grid-template-columns:1fr}.stat-strip{grid-template-columns:repeat(3,1fr)}.form-row{grid-template-columns:1fr}.week-path{grid-template-columns:repeat(5,1fr)}.offer-metrics{grid-template-columns:repeat(2,1fr)}.hero{border-radius:19px}.card{border-radius:17px}.app{padding-left:10px;padding-right:10px}.player-name{font-size:1.25rem}}
</style>
</head>
<body>
<div id="startScreen" class="start-wrap"></div>
<div id="gameShell" class="hidden">
  <header class="topbar"><div class="topbar-inner"><div class="brand">Diamond Legacy<small id="topMeta">v0.4</small></div><div class="top-actions"><button class="btn small secondary" onclick="manualSave()">Save</button><button class="btn small secondary" onclick="returnToSlots()">Slots</button></div></div></header>
  <main class="app">
    <section id="homeTab" class="tab"></section>
    <section id="playerTab" class="tab hidden"></section>
    <section id="statsTab" class="tab hidden"></section>
    <section id="recruitTab" class="tab hidden"></section>
    <section id="historyTab" class="tab hidden"></section>
    <section id="moreTab" class="tab hidden"></section>
  </main>
  <nav class="nav"><div class="nav-inner">
    <button data-tab="home" class="active" onclick="switchTab('home')"><span>⌂</span>Home</button>
    <button data-tab="player" onclick="switchTab('player')"><span>⚾</span>Player</button>
    <button data-tab="stats" onclick="switchTab('stats')"><span>▥</span>Stats</button>
    <button data-tab="recruit" onclick="switchTab('recruit')"><span>★</span>Recruit<span id="recruitBadge" class="badge hidden">0</span></button>
    <button data-tab="history" onclick="switchTab('history')"><span>◷</span>History</button>
    <button data-tab="more" onclick="switchTab('more')"><span>•••</span>More</button>
  </div></nav>
</div>
<div id="modal" class="modal hidden"></div>
<div id="toast" class="toast"></div>
<script>
'use strict';

const VERSION = '0.4';
const STORAGE_KEY = 'diamondLegacyV04_slots';
const ACTIVE_KEY = 'diamondLegacyV04_activeSlot';
const LEGACY_KEYS = ['diamondLegacyV03','diamondLegacyV02'];
const GRADES = ['Freshman','Sophomore','Junior','Senior'];
const GRADE_SHORT = ['FR','SO','JR','SR'];
const POSITIONS = ['C','1B','2B','3B','SS','LF','CF','RF','DH','SP','RP','CP','TWP'];
const HITTER_ATTRS = ['contact','power','discipline','vision','speed','arm','fielding','reaction','iq','durability'];
const PITCHER_ATTRS = ['velocity','control','movement','stamina','pickoff','fielding','iq','durability'];
const ALL_ATTRS = ['contact','power','discipline','vision','speed','arm','fielding','reaction','iq','durability','velocity','control','movement','stamina','pickoff'];
const ATTR_LABELS = {contact:'Contact',power:'Power',discipline:'Plate Discipline',vision:'Vision',speed:'Speed',arm:'Arm',fielding:'Fielding',reaction:'Reaction',iq:'Baseball IQ',durability:'Durability',velocity:'Velocity',control:'Control',movement:'Movement',stamina:'Stamina',pickoff:'Pickoff'};
const FIRST_NAMES = ['Mason','Eli','Noah','Carter','Jalen','Caleb','Luca','Dante','Micah','Jayden','Miles','Owen','Nico','Cam','Ty','Malik','Ryan','Cole','Brady','Jordan','Xavier','Andre','Luke','Zane','Marcus','Trevor'];
const LAST_NAMES = ['Bennett','Ramirez','Walker','Brooks','Santos','Price','Miller','Reed','Hayes','Foster','Nguyen','Collins','Rivera','Bryant','Owens','Pierce','Morgan','Davis','Turner','Cruz','Bell','Ward','Griffin','Stone','James'];
const SCHOOL_PREFIX = ['North','South','East','West','Central','Pine','River','Lake','Oak','Cedar','Maple','Granite','Coastal','Valley','Summit','Bayside','Redwood','Highland'];
const SCHOOL_SUFFIX = ['Ridge','Valley','Bridge','Harbor','Point','Heights','Grove','Creek','Hills','Park','View','Falls','Shore','Meadow','Crossing'];
const MASCOTS = ['Falcons','Knights','Tigers','Eagles','Panthers','Rams','Hawks','Spartans','Wildcats','Bears','Warriors','Storm'];
const COLLEGE_PREFIX = ['Coastal','Eastern','Western','Northern','Southern','Atlantic','Metro','National','Central','Lakeview','Piedmont','Capital','Frontier','Bay State','Red River','Summit'];
const COLLEGE_SUFFIX = ['State','University','Tech','College','A&M','Institute'];

let state = null;
let activeSlot = 0;
let currentTab = 'home';
let modalAfterClose = null;

const $ = sel => document.querySelector(sel);
const $$ = sel => [...document.querySelectorAll(sel)];
const clamp = (n,min,max) => Math.max(min,Math.min(max,n));
const r = (min,max) => Math.floor(Math.random()*(max-min+1))+min;
const chance = p => Math.random()<p;
const pick = arr => arr[r(0,arr.length-1)];
const uid = () => Date.now()+r(100,99999);
const deepClone = x => JSON.parse(JSON.stringify(x));
const money = n => new Intl.NumberFormat('en-US',{style:'currency',currency:'USD',maximumFractionDigits:0}).format(n||0);
const pct = n => `${Math.round(n)}%`;
const fmt3 = n => Number.isFinite(n) ? n.toFixed(3).replace(/^0/,'') : '.000';
const innings = outs => `${Math.floor((outs||0)/3)}.${(outs||0)%3}`;
const ordinal = n => n===1?'st':n===2?'nd':n===3?'rd':'th';
const slug = s => String(s).replace(/[^a-z0-9]/gi,'').toLowerCase();

function toast(text){const el=$('#toast');el.textContent=text;el.classList.add('show');clearTimeout(el._t);el._t=setTimeout(()=>el.classList.remove('show'),1800)}
function openModal(html,onClose=null){modalAfterClose=onClose;$('#modal').innerHTML=`<div class="modal-card">${html}</div>`;$('#modal').classList.remove('hidden')}
function closeModal(){const cb=modalAfterClose;modalAfterClose=null;$('#modal').classList.add('hidden');$('#modal').innerHTML='';if(cb)cb()}
function confirmModal(title,text,yes){openModal(`<div class="eyebrow">Confirm</div><h2>${title}</h2><p class="muted">${text}</p><div class="grid two" style="margin-top:14px"><button class="btn bad" id="confirmYes">Confirm</button><button class="btn secondary" onclick="closeModal()">Cancel</button></div>`);$('#confirmYes').onclick=()=>{closeModal();yes()}}
function meter(label,value,kind=''){return `<div class="metric"><div class="metric-line"><span>${label}</span><span>${Math.round(value)}</span></div><div class="meter ${kind}"><i style="width:${clamp(value,0,100)}%"></i></div></div>`}
function effectText(e){const labels={contact:'Contact',power:'Power',discipline:'Discipline',vision:'Vision',speed:'Speed',arm:'Arm',fielding:'Fielding',reaction:'Reaction',iq:'Baseball IQ',durability:'Durability',velocity:'Velocity',control:'Control',movement:'Movement',stamina:'Stamina',pickoff:'Pickoff',energy:'Energy',confidence:'Confidence',coachTrust:'Coach Trust',chemistry:'Chemistry',scout:'Scout Interest',reputation:'Reputation',money:'Money',academics:'Academics',health:'Health',workEthic:'Work Ethic'};return Object.entries(e||{}).map(([k,v])=>`${labels[k]||k} ${v>0?'+':''}${k==='money'?money(v):v}`).join(' · ')||'Story consequence'}

function emptyHitting(){return {g:0,pa:0,ab:0,r:0,h:0,d2:0,d3:0,hr:0,rbi:0,bb:0,so:0,hbp:0,sb:0,cs:0,sf:0,avg:0,obp:0,slg:0,ops:0}}
function emptyPitching(){return {g:0,gs:0,w:0,l:0,sv:0,outs:0,h:0,er:0,bb:0,k:0,hr:0,era:0,whip:0}}
function emptyFielding(){return {chances:0,errors:0,assists:0,putouts:0,pct:1}}

function baseAttributes(position,archetype){const attrs={};ALL_ATTRS.forEach(a=>attrs[a]=r(42,53));attrs.iq=r(44,55);attrs.durability=r(47,57);const boost=(a,n)=>attrs[a]=clamp(attrs[a]+n,30,75);if(position==='SP'||position==='RP'||position==='CP'){['velocity','control','movement','stamina'].forEach(a=>boost(a,r(2,6)));attrs.contact=r(25,36);attrs.power=r(24,35)}else if(position==='TWP'){['contact','power','velocity','control','movement'].forEach(a=>boost(a,r(1,4)))}else{['contact','power','speed','fielding','arm'].forEach(a=>boost(a,r(1,5)));attrs.velocity=r(24,35);attrs.control=r(24,35);attrs.movement=r(24,35);attrs.stamina=r(28,40)}

  const previous=state;
  state={version:VERSION,settings,player,career,season:null,week:null,world:generateWorld(school,colleges),ui:{lastPopupKey:'',historyFilter:'all'},offseason:null};

function pickScenario(){if(chance(.22))return null;const pool=weeklyScenarioPool().filter(sc=>{const seen=state.career.scenarioSeen[sc.id];if(!seen)return true;if(sc.once)return false;return (state.season.week-seen.week)>=sc.cooldown||seen.grade!==state.player.gradeIndex});if(!pool.length)return null;return pick(pool)}
function generateWeek(){if(state.week.generated)return;state.week.generated=true;state.week.scenario=pickScenario();state.week.scenarioQuiet=!state.week.scenario;state.week.scenarioResolved=!state.week.scenario;state.week.gamesPlayed=currentWeekGames().filter(g=>g.played).length;state.week.recapViewed=false;state.week.trainingApplied=false;maybeGenerateRecruiting();applyTrainingAutomatically();saveGame(true)}
function currentWeekGames(){if(!state.season)return[];return state.season.schedule.filter(g=>g.week===state.season.week)}
function unresolvedInbox(){return state.career.inbox.filter(x=>!x.resolved)}

function trainingWindowNeeded(){if(!state.player.trainingPlan)return true;if(state.season.phase==='Regular Season'&&state.season.week===7&&!state.season.midseasonPlanChanged)return true;if(state.season.phase==='Playoffs'&&!state.season.postseasonPlanChanged)return true;return false}
function trainingWindowLabel(){if(!state.player.trainingPlan)return 'Preseason';if(state.season.phase==='Playoffs'&&!state.season.postseasonPlanChanged)return 'Postseason';if(state.season.week===7&&!state.season.midseasonPlanChanged)return 'Midseason';return state.player.trainingWindow||'Season'}
function chooseTrainingPlan(id){const plan=availablePlans().find(x=>x.id===id);if(!plan)return;const old=state.player.trainingPlan;state.player.lastTrainingPlan=old;state.player.trainingPlan=id;state.player.trainingWindow=trainingWindowLabel();if(state.season.week===7)state.season.midseasonPlanChanged=true;if(state.season.phase==='Playoffs')state.season.postseasonPlanChanged=true;addHistory('training',`${plan.name} Plan Selected`,`${trainingWindowLabel()} development will emphasize ${plan.major.map(a=>ATTR_LABELS[a]).join(', ')}.`);state.week.trainingApplied=false;applyTrainingAutomatically();closeModal();toast('Training plan active');saveGame(true);renderAll()}
function applyTrainingAutomatically(){if(!state.player.trainingPlan||state.week.trainingApplied)return;const plan=getPlan();const p=state.player;const mult=progressionMultiplier()*(.75+p.workEthic/200);const gains={};plan.major.forEach(a=>gains[a]=r(8,14));plan.minor.forEach(a=>gains[a]=(gains[a]||0)+r(4,8));const normal=(isPitcher()?PITCHER_ATTRS:HITTER_ATTRS).filter(a=>!plan.major.includes(a)&&!plan.minor.includes(a)&&!plan.slow.includes(a));normal.slice(0,3).forEach(a=>gains[a]=r(2,5));plan.slow.forEach(a=>gains[a]=r(0,2));Object.keys(gains).forEach(a=>addXP(a,Math.round(gains[a]*mult),false));const fatigue=plan.id==='power'||plan.id==='velocity'||plan.id==='bullpen'?r(4,7):r(2,5);p.energy=clamp(p.energy-fatigue,0,100);state.week.trainingApplied=true;state.season.trainingLog.push({week:state.season.week,plan:plan.name,gains,ovr:calcOVR()});if(state.season.trainingLog.length>30)state.season.trainingLog.shift()}
function addXP(attr,amount,showHistory=true){if(!state.player.attrs[attr]&&state.player.attrs[attr]!==0)return;const p=state.player;p.xp[attr]=(p.xp[attr]||0)+Math.max(0,amount);let increases=0;while(p.xp[attr]>=100&&p.attrs[attr]<p.potentialCap){p.xp[attr]-=100;p.attrs[attr]++;increases++}if(increases&&showHistory)addHistory('development',`${ATTR_LABELS[attr]} Improved`,`${ATTR_LABELS[attr]} increased to ${p.attrs[attr]}.`);return increases}
function applyEffect(effect){const p=state.player;Object.entries(effect||{}).forEach(([key,val])=>{if(ALL_ATTRS.includes(key)){addXP(key,Math.max(0,val)*8);if(val<0)p.attrs[key]=clamp(p.attrs[key]+val,20,p.potentialCap)}else if(key==='scout')p.scoutInterest=clamp(p.scoutInterest+val,0,100);else if(key==='reputation')p.reputation=clamp(p.reputation+val,0,100);else if(key==='hot')p.hot=clamp(p.hot+val,0,8);else if(key==='cold')p.cold=clamp(p.cold+val,0,8);else if(key in p)p[key]=clamp(p[key]+val,key==='money'?-99999:0,key==='money'?99999999:100)});updateOVRDependent()}
function updateOVRDependent(){state.player.potential=potentialLabel(state.player.potentialCap,state.settings.potential)}

function nextAction(){if(state.offseason)return {kind:'offseason',title:'Plan Your Offseason',copy:'Choose how to spend three offseason development blocks.',button:'Build Offseason Plan',icon:'☀️'};if(state.season.complete&&state.player.gradeIndex===3)return {kind:'graduation',title:'Choose Your Next Step',copy:'Your high-school career is complete. Review college offers and professional interest.',button:'Make Career Decision',icon:'🎓'};if(trainingWindowNeeded())return {kind:'plan',title:`Choose a ${trainingWindowLabel()} Training Plan`,copy:'Set your development strategy. It will run automatically each week.',button:'Choose Training Plan',icon:'📈'};if(!state.week.scenarioResolved)return {kind:'scenario',title:state.week.scenario.title,copy:'One meaningful choice can shape this week. Training already runs automatically.',button:'Make Weekly Choice',icon:'◇'};if(unresolvedInbox().length)return {kind:'recruit',title:'Recruiting Needs a Response',copy:`${unresolvedInbox().length} message${unresolvedInbox().length===1?'':'s'} need your attention before the week advances.`,button:'Open Recruiting Inbox',icon:'★'};const games=currentWeekGames();const nextGame=games.find(g=>!g.played);if(nextGame)return {kind:'game',title:`Game ${nextGame.gameNo}: ${nextGame.home?'vs.':'at'} ${nextGame.opponent}`,copy:`${games.filter(g=>g.played).length} of ${games.length} games completed this week.`,button:'Play Game',icon:'⚾'};if(!state.week.recapViewed)return {kind:'recap',title:'Weekly Recap Ready',copy:'Review results, development, recruiting movement, and the updated team record.',button:'View Weekly Recap',icon:'▥'};return {kind:'advance',title:state.season.phase==='Playoffs'?'Advance in the Postseason':`Advance to Week ${state.season.week+1}`,copy:'Everything important is complete. Your automatic training plan continues.',button:'Advance',icon:'▶'} }
function doNextAction(){const a=nextAction();if(a.kind==='offseason')openOffseasonModal();else if(a.kind==='graduation')openGraduationModal();else if(a.kind==='plan')openTrainingPlanModal();else if(a.kind==='scenario')openScenarioModal();else if(a.kind==='recruit')switchTab('recruit');else if(a.kind==='game')playNextGame();else if(a.kind==='recap')openWeeklyRecap();else if(a.kind==='advance')advanceWeek()}

function openTrainingPlanModal(){const plans=availablePlans();openModal(`<div class="eyebrow">${trainingWindowLabel()} Development</div><h2>Choose Your Training Plan</h2><p class="muted">Your plan runs automatically. You can adjust again at midseason, postseason, and the offseason.</p><div style="margin-top:12px">${plans.map(plan=>`<button class="choice ${state.player.trainingPlan===plan.id?'selected':''}" onclick="chooseTrainingPlan('${plan.id}')"><b>${plan.icon} ${plan.name}</b><small>${plan.desc}</small><small style="color:#8edaff">Main: ${plan.major.map(a=>ATTR_LABELS[a]).join(', ')}</small><small>Less focus: ${plan.slow.length?plan.slow.map(a=>ATTR_LABELS[a]).join(', '):'None'}</small></button>`).join('')}</div><button class="btn secondary block" style="margin-top:11px" onclick="closeModal()">Decide Later</button>`)}
function openScenarioModal(){const sc=state.week.scenario;if(!sc)return;openModal(`<div class="eyebrow">Weekly Scenario · ${sc.cat}</div><h2>${sc.title}</h2><p class="muted">${sc.text}</p><div class="notification">This is the only routine decision for the week. Your training plan continues in the background.</div>${sc.choices.map((c,i)=>`<button class="modal-choice" onclick="resolveScenario(${i})"><b>${c[0]}</b><small>${effectText(c[1])}</small></button>`).join('')}<button class="btn secondary block" style="margin-top:11px" onclick="closeModal()">Decide Later</button>`)}
function resolveScenario(index){const sc=state.week.scenario;if(!sc||state.week.scenarioResolved)return;const choice=sc.choices[index];if((choice[1].money||0)<0&&state.player.money<Math.abs(choice[1].money))return toast('Not enough money for that choice');applyEffect(choice[1]);state.week.scenarioResolved=true;state.career.scenarioSeen[sc.id]={week:state.season.week,grade:state.player.gradeIndex};addHistory('decision',sc.title,`${choice[0]}. ${effectText(choice[1])}`,{scenario:sc.id,choice:index});addHeadline(sc.title,`${state.player.name} chose: ${choice[0]}.`,'◇');closeModal();saveGame(true);renderAll()}

function performanceRating(){const p=state.player;const ovr=calcOVR();const conf=(p.confidence-50)*.15;const energy=(p.energy-60)*.08;const health=(p.health-70)*.07;const hot=p.hot*1.5-p.cold*1.2;const diff=(difficultyMultiplier()-1)*25;return ovr+conf+energy+health+hot-diff+r(-9,9)}
function opponentRating(name){return state.world.teams.find(t=>t.name===name)?.rating||r(50,72)}
function simulateHitting(perf,opp){const p=state.player,a=p.attrs;const pa=r(3,5);let ab=pa;let bb=0,hbp=0;if(chance(clamp((a.discipline-35)/180,0.03,.2))){bb++;ab--}if(chance(.025)){hbp++;ab--}let hits=0,d2=0,d3=0,hr=0,so=0,runs=0,rbi=0,sb=0;const hitProb=clamp(.13+(a.contact+a.vision+perf-opp*1.15)/440,.11,.52);for(let i=0;i<ab;i++){if(chance(clamp((opp+55-a.vision-a.discipline)/180,.08,.4)))so++;if(chance(hitProb)){hits++;const powerProb=clamp((a.power+perf-70)/210,.035,.28);if(chance(powerProb)){if(chance(.42)){hr++}else d2++}else if(chance(clamp((a.speed-35)/250,.01,.12)))d3++;if(chance(.55))runs++;rbi+=r(0,Math.min(3,hr?3:2))}}if((hits+bb)>0&&chance(clamp((a.speed-35)/110,.03,.42)))sb=r(1,Math.min(2,hits+bb));if(hr)runs=Math.max(runs,hr);return {pa,ab,h:hits,d2,d3,hr,bb,hbp,so,r:runs,rbi,sb,line:`${hits}-for-${ab}${hr?`, ${hr} HR`:''}${d2?`, ${d2} 2B`:''}${d3?`, ${d3} 3B`:''}, ${rbi} RBI${sb?`, ${sb} SB`:''}`}}
function simulatePitching(perf,opp,role){const a=state.player.attrs;let outs=role==='SP'?r(12,21):r(3,8);if(perf<45)outs=Math.max(2,outs-r(3,7));const batters=Math.ceil(outs/3)*4+r(1,6);const hitRate=clamp(.37-(a.control+a.movement+perf-opp*1.25)/520,.16,.42);const hits=Math.max(0,Math.round(batters*hitRate+r(-1,2)));const walks=Math.max(0,Math.round(batters*clamp(.17-(a.control-40)/300,.035,.2)));const ks=Math.max(0,Math.round(batters*clamp(.11+(a.velocity+a.movement-85)/300,.08,.44)));const hr=Math.max(0,Math.round(hits*clamp(.1-(a.movement-45)/500,.025,.16)));const er=Math.max(0,Math.round(hits*.42+walks*.31+hr*.8+r(-1,1)));return {outs,h:hits,bb:walks,k:ks,hr,er,line:`${innings(outs)} IP, ${hits} H, ${er} ER, ${walks} BB, ${ks} K`}}
function updateHittingStats(line){const s=state.season.stats.hitting;s.g++;['pa','ab','h','d2','d3','hr','bb','hbp','so','r','rbi','sb'].forEach(k=>s[k]+=line[k]||0);s.avg=s.ab?s.h/s.ab:0;s.obp=(s.pa)?(s.h+s.bb+s.hbp)/(s.ab+s.bb+s.hbp+s.sf):0;const tb=(s.h-s.d2-s.d3-s.hr)+2*s.d2+3*s.d3+4*s.hr;s.slg=s.ab?tb/s.ab:0;s.ops=s.obp+s.slg}
function updatePitchingStats(line,win,save,started){const s=state.season.stats.pitching;s.g++;if(started)s.gs++;if(win===true)s.w++;if(win===false)s.l++;if(save)s.sv++;s.outs+=line.outs;s.h+=line.h;s.er+=line.er;s.bb+=line.bb;s.k+=line.k;s.hr+=line.hr;s.era=s.outs?9*s.er/(s.outs/3):0;s.whip=s.outs?(s.h+s.bb)/(s.outs/3):0}
function updateFielding(perf){const s=state.season.stats.fielding;const chances=r(2,8);const err=chance(clamp(.2-(state.player.attrs.fielding+perf-80)/250,.01,.2))?1:0;s.chances+=chances;s.errors+=err;s.assists+=r(0,chances-err);s.putouts+=Math.max(0,chances-s.assists-err);s.pct=s.chances?(s.chances-s.errors)/s.chances:1;return err}
function playNextGame(){const game=currentWeekGames().find(g=>!g.played);if(!game)return;const p=state.player;const opp=opponentRating(game.opponent);const perf=performanceRating();let hitting=null,pitching=null;let personalLine='';let startedPitch=false;let pitcherDecision=null;let save=false;
if(isHitter()){hitting=simulateHitting(perf,opp);updateHittingStats(hitting);personalLine=hitting.line}
if(isPitcher()||isTwoWay()){const role=p.position==='SP'||isTwoWay()?'SP':p.position;startedPitch=role==='SP'&&(game.gameNo%2===1||isTwoWay());const appears=startedPitch||role!=='SP'&&chance(.72);if(appears){pitching=simulatePitching(perf,opp,role);personalLine+=(personalLine?' · ':'')+pitching.line}}
const teamStrength=state.world.teams.find(t=>t.name===p.school)?.rating||60;let ourRuns=clamp(Math.round(r(1,8)+(teamStrength-opp)/12+(hitting?hitting.rbi*.22:0)),0,14);let theirRuns=clamp(Math.round(r(1,8)+(opp-teamStrength)/12+(pitching?pitching.er*.15:0)),0,14);if(ourRuns===theirRuns){if(chance(.52))ourRuns++;else theirRuns++}const win=ourRuns>theirRuns;if(pitching){pitcherDecision=startedPitch?(win&&pitching.er<=theirRuns?true:!win&&pitching.er>=Math.max(1,theirRuns-1)?false:null):null;save=!startedPitch&&p.position==='CP'&&win&&ourRuns-theirRuns<=3;updatePitchingStats(pitching,pitcherDecision,save,startedPitch)}const error=updateFielding(perf);game.played=true;game.result={win,score:`${ourRuns}-${theirRuns}`,line:personalLine,error,ourRuns,theirRuns};state.season.gameLog.unshift({id:uid(),week:state.season.week,gameNo:game.gameNo,opponent:game.opponent,home:game.home,win,score:`${ourRuns}-${theirRuns}`,line:personalLine,error,phase:state.season.phase});if(win)state.season.teamWins++;else state.season.teamLosses++;state.week.gamesPlayed=currentWeekGames().filter(g=>g.played).length;
const quality=(hitting?(hitting.h*2+hitting.hr*4+hitting.rbi*.8-hitting.so*.5):0)+(pitching?(pitching.k*.5-pitching.er*1.4):0)+(win?2:0)-error*2;if(quality>=7){p.confidence=clamp(p.confidence+r(3,6),0,100);p.hot=clamp(p.hot+1,0,8);p.cold=Math.max(0,p.cold-1);p.scoutInterest=clamp(p.scoutInterest+r(1,3),0,100)}else if(quality<=1){p.confidence=clamp(p.confidence-r(2,5),0,100);p.cold=clamp(p.cold+1,0,8);p.hot=Math.max(0,p.hot-1)}else{p.confidence=clamp(p.confidence+r(-1,2),0,100);p.hot=Math.max(0,p.hot-(chance(.4)?1:0));p.cold=Math.max(0,p.cold-(chance(.5)?1:0))}p.energy=clamp(p.energy-r(7,12),0,100);p.coachTrust=clamp(p.coachTrust+(quality>=5?2:quality<=0?-2:0),0,100);maybeInjury();updateRecruitingAfterGame(quality);addHeadline(`${win?'Win':'Loss'} ${ourRuns}-${theirRuns} ${game.home?'vs.':'at'} ${game.opponent}`,`${p.name}: ${personalLine}${error?' · 1 error':''}.`,win?'✅':'⚾');saveGame(true);renderAll();openGameResult(game)}
function openGameResult(game){const g=game.result;openModal(`<div class="eyebrow">${state.season.phase} · Game ${game.gameNo}</div><div class="game-result"><span class="pill ${g.win?'good':'bad'}">${g.win?'WIN':'LOSS'}</span><div class="result-line">${state.player.school} ${g.ourRuns}, ${game.opponent} ${g.theirRuns}</div><p><b>${state.player.name}</b><br>${g.line}${g.error?' · 1 fielding error':''}</p></div><button class="btn block" style="margin-top:12px" onclick="closeModal()">Continue</button><button class="btn secondary block" style="margin-top:8px" onclick="closeModal();switchTab('stats')">View Full Stats</button>`)}
function maybeInjury(){const mult=injuryMultiplier();if(!mult)return;const p=state.player;const risk=clamp((100-p.energy)/700+(100-p.health)/800+(55-p.attrs.durability)/1200,.003,.09)*mult;if(!chance(risk))return;const severe=chance(.08*mult);const moderate=!severe&&chance(.28);const name=severe?pick(['Torn UCL','Fractured Hand','Major Hamstring Tear']):moderate?pick(['Hamstring Strain','Shoulder Inflammation','Wrist Sprain']):pick(['Bruised Hand','Back Tightness','Mild Ankle Sprain']);const damage=severe?r(22,35):moderate?r(10,18):r(4,9);p.health=clamp(p.health-damage,0,100);p.energy=clamp(p.energy-damage/2,0,100);addHistory('injury',name,`${name} reduced health by ${damage}.`);addHeadline(name,`${p.name} will need to manage recovery carefully.`,'🩺')}

function maybeGenerateRecruiting(){const p=state.player;if(p.scoutInterest<8||unresolvedInbox().length||!chance(clamp(.12+p.scoutInterest/240,.12,.52)))return;const college=pick(state.world.colleges.filter(c=>!c.committed));if(!college)return;college.interest=clamp(college.interest+r(4,10)+Math.round(p.scoutInterest/15),0,100);college.status=college.interest>=75?'Priority Recruit':college.interest>=50?'Strong Interest':college.interest>=25?'Evaluating':'Watching';const types=[{title:`${college.name} Requests Film`,text:`${college.coach} wants an updated game video and academic profile.`,choices:[['Send film and grades',{scout:5,reputation:2,academics:1},8],['Send only game film',{scout:4},6],['Wait for a stronger week',{confidence:1},0]]},{title:`Prospect Camp Invitation`,text:`${college.name} invites you to an upcoming prospect camp.`,choices:[['Register for $95',{money:-95,scout:8,energy:-4},10],['Ask your coach to contact them',{coachTrust:2,scout:5},7],['Decline for now',{energy:4},0]]},{title:`Recruiting Questionnaire`,text:`${college.name} asks what matters most in your college decision.`,choices:[['Immediate playing time',{scout:4,confidence:2},6],['Development and MLB preparation',{scout:5,iq:2},7],['Academics and baseball balance',{scout:4,academics:3},6]]}];const t=pick(types);state.career.inbox.unshift({id:uid(),collegeId:college.id,title:t.title,text:t.text,choices:t.choices,resolved:false,result:null});addHeadline('New Recruiting Message',`${college.name} sent a message that needs a response.`,'★')}
function resolveRecruiting(id,index){const item=state.career.inbox.find(x=>x.id===id);if(!item||item.resolved)return;const choice=item.choices[index];if((choice[1].money||0)<0&&state.player.money<Math.abs(choice[1].money))return toast('Not enough money');applyEffect(choice[1]);const college=state.world.colleges.find(c=>c.id===item.collegeId);if(college)college.interest=clamp(college.interest+(choice[2]||0),0,100);item.resolved=true;item.result=choice[0];addHistory('recruiting',item.title,`${choice[0]}. ${effectText(choice[1])}`);closeModal();saveGame(true);renderAll();toast('Recruiting response sent')}
function updateRecruitingAfterGame(quality){const p=state.player;state.world.colleges.forEach(c=>{if(c.interest>0||chance(p.scoutInterest/300)){c.interest=clamp(c.interest+Math.max(0,Math.round(quality/3))+r(0,2),0,100);c.status=c.interest>=80?'Priority Recruit':c.interest>=55?'Strong Interest':c.interest>=28?'Evaluating':'Watching';if(!c.offer&&p.gradeIndex>=1&&c.interest>=72){c.offer=true;c.scholarship=clamp(Math.round(c.interest*.65+(p.academics-60)*.4+r(-8,12)),20,100);state.career.offers.push(c.id);addHistory('offer',`${c.name} Makes an Offer`,`${c.name} projects a ${c.scholarship}% scholarship package.`);addHeadline('Scholarship Offer',`${c.name} has formally offered ${p.name}.`,'🎓')}}})}
function openRecruitingItem(id){const item=state.career.inbox.find(x=>x.id===id);if(!item)return;if(item.resolved)return toast('Already handled');openModal(`<div class="eyebrow">Recruiting Inbox</div><h2>${item.title}</h2><p class="muted">${item.text}</p>${item.choices.map((c,i)=>`<button class="modal-choice" onclick="resolveRecruiting(${item.id},${i})"><b>${c[0]}</b><small>${effectText(c[1])}</small></button>`).join('')}<button class="btn secondary block" style="margin-top:11px" onclick="closeModal()">Decide Later</button>`)}

function openWeeklyRecap(){state.week.recapViewed=true;const games=currentWeekGames();const wins=games.filter(g=>g.result?.win).length;const lines=games.filter(g=>g.result).map(g=>`${g.result.win?'W':'L'} ${g.result.score} ${g.home?'vs.':'at'} ${g.opponent}`).join('<br>');const plan=getPlan();const s=state.season.stats;openModal(`<div class="eyebrow">Week ${state.season.week} Complete</div><h2>${wins}-${games.length-wins} This Week</h2><div class="notification">${lines||'No games were scheduled.'}</div><div class="grid two"><div class="card"><h3>Automatic Development</h3><p class="muted tiny"><b>${plan.name}</b> remained active. OVR is now ${calcOVR()}.</p>${plan.major.slice(0,3).map(a=>meter(ATTR_LABELS[a],state.player.xp[a]||0)).join('')}</div><div class="card"><h3>Current Snapshot</h3><p class="tiny muted">Team: ${state.season.teamWins}-${state.season.teamLosses}<br>${isPitcher()?`ERA ${s.pitching.era.toFixed(2)} · ${s.pitching.k} K`:`AVG ${fmt3(s.hitting.avg)} · ${s.hitting.hr} HR · ${s.hitting.rbi} RBI`}<br>Scout interest: ${state.player.scoutInterest}<br>Coach trust: ${state.player.coachTrust}</p></div></div><button class="btn block" style="margin-top:12px" onclick="closeModal()">Back to Home</button>`);saveGame(true);renderAll()}
function advanceWeek(){if(state.settings.confirmAdvance)return confirmModal('Advance the Career?',`Move beyond ${state.season.grade} Week ${state.season.week}?`,advanceWeekConfirmed);advanceWeekConfirmed()}
function advanceWeekConfirmed(){if(trainingWindowNeeded())return toast('Choose a training plan first');if(!state.week.scenarioResolved)return toast('Handle the weekly scenario first');if(unresolvedInbox().length)return toast('Respond to recruiting first');if(currentWeekGames().some(g=>!g.played))return toast('Play this week’s games first');if(!state.week.recapViewed)return toast('View the weekly recap first');recoverBetweenWeeks();if(state.season.phase==='Regular Season'&&state.season.week>=12)return finishRegularSeason();if(state.season.phase==='Playoffs')return advancePlayoffs();state.season.week++;state.week={scenario:null,scenarioResolved:false,scenarioQuiet:false,gamesPlayed:0,recapViewed:false,trainingApplied:false,generated:false};generateWeek();saveGame(true);renderAll();switchTab('home');window.scrollTo({top:0,behavior:state.settings.reducedMotion?'auto':'smooth'});maybePopup()}
function recoverBetweenWeeks(){const p=state.player;let recovery=r(13,20);if(state.settings.autoRecovery&&p.energy<35)recovery+=10;p.energy=clamp(p.energy+recovery,0,100);p.health=clamp(p.health+r(1,4),0,100);if(p.health<45&&state.settings.autoRecovery){p.energy=clamp(p.energy+8,0,100);p.health=clamp(p.health+5,0,100)}p.weight=clamp(p.weight+(chance(.18)?1:0),120,260)}
function finishRegularSeason(){const qualifies=state.season.teamWins>=10||state.settings.difficulty==='relaxed';if(!qualifies){addHistory('season','Season Ends Before State Tournament',`${state.player.school} finished ${state.season.teamWins}-${state.season.teamLosses}.`);return completeSeason()}state.season.phase='Playoffs';state.season.playoffRound=1;state.season.postseasonPlanChanged=false;state.player.trainingWindow='Postseason';state.season.week=13;state.season.schedule.push({gameNo:25,week:13,opponent:playoffOpponent(1),home:chance(.5),played:false,playoff:true,result:null});state.week={scenario:null,scenarioResolved:true,scenarioQuiet:true,gamesPlayed:0,recapViewed:false,trainingApplied:false,generated:true};addHistory('playoffs','State Tournament Berth',`${state.player.school} qualified for the state tournament at ${state.season.teamWins}-${state.season.teamLosses}.`);addHeadline('State Tournament Bound',`${state.player.school} advances to the postseason.`,'🏆');saveGame(true);renderAll();openModal(`<div class="eyebrow">Postseason</div><h2>State Tournament Berth</h2><p class="muted">Your team finished ${state.season.teamWins}-${state.season.teamLosses}. Choose a postseason training plan before the opening round.</p><button class="btn block" onclick="closeModal();openTrainingPlanModal()">Choose Postseason Plan</button>`)}
function playoffOpponent(round){const options=state.world.teams.filter(t=>t.name!==state.player.school).sort((a,b)=>b.rating-a.rating);return options[clamp(round*3+r(-1,1),0,options.length-1)].name}
function advancePlayoffs(){const game=currentWeekGames()[0];if(!game?.played)return;state.week.recapViewed=true;if(!game.result.win){addHistory('playoffs','Eliminated from State Tournament',`${state.player.school} was eliminated in round ${state.season.playoffRound}.`);return completeSeason()}if(state.season.playoffRound>=4){state.season.awards.push('State Champion');state.career.awards.push({grade:state.season.grade,name:'State Champion'});addHistory('championship','State Championship',`${state.player.school} won the state championship.`);addHeadline('STATE CHAMPIONS',`${state.player.name} and ${state.player.school} completed a championship run.`,'🏆');return completeSeason()}state.season.playoffRound++;state.season.week++;state.season.schedule.push({gameNo:24+state.season.playoffRound,week:state.season.week,opponent:playoffOpponent(state.season.playoffRound),home:chance(.5),played:false,playoff:true,result:null});state.week={scenario:null,scenarioResolved:true,scenarioQuiet:true,gamesPlayed:0,recapViewed:false,trainingApplied:false,generated:true};applyTrainingAutomatically();saveGame(true);renderAll();switchTab('home')}
function evaluateAwards(){const s=state.season.stats,p=state.player;const awards=[];if(isHitter()&&s.hitting.avg>=.350)awards.push('All-Conference');if(isHitter()&&s.hitting.avg>=.410&&s.hitting.hr>=5)awards.push('All-State');if(isPitcher()&&s.pitching.era<=2.3&&s.pitching.k>=35)awards.push('All-Conference');if(isPitcher()&&s.pitching.era<=1.5&&s.pitching.k>=55)awards.push('All-State');if(p.coachTrust>=82)awards.push('Coach’s Award');if(p.gradeIndex>=2&&p.reputation>=55)awards.push('Team Captain');awards.forEach(a=>{if(!state.season.awards.includes(a)){state.season.awards.push(a);state.career.awards.push({grade:state.season.grade,name:a});addHistory('award',a,`${p.name} earned ${a}.`)}})}
function mergeCareerStats(){['hitting','pitching','fielding'].forEach(group=>{const cur=state.career.careerStats[group],src=state.season.stats[group];Object.keys(cur).forEach(k=>{if(['avg','obp','slg','ops','era','whip','pct'].includes(k))return;cur[k]+=(src[k]||0)})});const h=state.career.careerStats.hitting;h.avg=h.ab?h.h/h.ab:0;h.obp=(h.ab+h.bb+h.hbp+h.sf)?(h.h+h.bb+h.hbp)/(h.ab+h.bb+h.hbp+h.sf):0;const tb=(h.h-h.d2-h.d3-h.hr)+2*h.d2+3*h.d3+4*h.hr;h.slg=h.ab?tb/h.ab:0;h.ops=h.obp+h.slg;const p=state.career.careerStats.pitching;p.era=p.outs?9*p.er/(p.outs/3):0;p.whip=p.outs?(p.h+p.bb)/(p.outs/3):0;const f=state.career.careerStats.fielding;f.pct=f.chances?(f.chances-f.errors)/f.chances:1}
function updateRecords(){const rcd=state.career.records,h=state.season.stats.hitting,p=state.season.stats.pitching;rcd.bestAvg=Math.max(rcd.bestAvg,h.avg||0);rcd.mostHR=Math.max(rcd.mostHR,h.hr||0);rcd.mostRBI=Math.max(rcd.mostRBI,h.rbi||0);rcd.mostK=Math.max(rcd.mostK,p.k||0);if(p.outs)rcd.bestERA=Math.min(rcd.bestERA,p.era);rcd.schoolHits+=h.h||0;rcd.schoolHR+=h.hr||0;rcd.schoolRBI+=h.rbi||0;rcd.schoolK+=p.k||0}
function completeSeason(){if(state.season.complete)return;state.season.complete=true;evaluateAwards();mergeCareerStats();updateRecords();state.career.seasons.push(deepClone(state.season));addHistory('season',`${state.season.grade} Season Complete`,`${state.player.school} finished ${state.season.teamWins}-${state.season.teamLosses}. ${seasonStatSummary(state.season.stats)}`);const grade=state.player.gradeIndex;if(grade===3){saveGame(true);renderAll();return openSeasonEndModal(true)}state.offseason={afterGrade:grade,blocks:3,selections:[],complete:false};saveGame(true);renderAll();openSeasonEndModal(false)}
function seasonStatSummary(stats){if(isPitcher()&&!isTwoWay())return `${stats.pitching.w}-${stats.pitching.l}, ${stats.pitching.era.toFixed(2)} ERA, ${stats.pitching.k} K.`;return `${fmt3(stats.hitting.avg)} AVG, ${stats.hitting.hr} HR, ${stats.hitting.rbi} RBI.`}
function openSeasonEndModal(graduated){openModal(`<div class="eyebrow">Season Complete</div><h2>${state.season.grade} Year Is Finished</h2><p class="muted">Team record: ${state.season.teamWins}-${state.season.teamLosses}<br>${seasonStatSummary(state.season.stats)}</p>${state.season.awards.length?`<div class="notification">Awards: ${state.season.awards.join(' · ')}</div>`:''}<button class="btn block" onclick="closeModal();${graduated?'openGraduationModal()':'openOffseasonModal()'}">${graduated?'Review Next-Step Options':'Plan the Offseason'}</button><button class="btn secondary block" style="margin-top:8px" onclick="closeModal()">Review Career First</button>`)}
