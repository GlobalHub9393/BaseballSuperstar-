tn.secondary{background:#173342;color:var(--txt);border:1px solid #315363}.btn.ghost{background:transparent;color:var(--mut);border:1px solid var(--line)}.btn.small{padding:9px;font-size:11px;border-radius:10px}.play{font-size:17px;background:linear-gradient(90deg,#f6c453,#ed9635)}input,select{width:100%;padding:12px;border-radius:12px;border:1px solid #2c4e5e;background:#091922;color:#fff;font-size:16px}label{display:block;color:var(--mut);font-size:11px;margin:10px 0 5px}.notice{padding:10px;border-radius:12px;background:#102d24;border:1px solid #285b46;color:#c8f5dd;font-size:12px}.warn{background:#302813;border-color:#65521e;color:#ffe3a4}.danger{background:#351b20;border-color:#6a2b35;color:#ffd0d6}.news{padding:8px 0;border-bottom:1px solid #ffffff0d;font-size:12px}.news:last-child{border:0}.progress{height:7px;background:#19323e;border-radius:10px;overflow:hidden;margin:6px 0}.fill{height:100%;background:linear-gradient(90deg,var(--blue),var(--purple))}.attrs{display:grid;grid-template-columns:1fr 1fr;gap:8px}.attr{background:#091922;border:1px solid #244250;border-radius:14px;padding:10px}.attrname{font-size:11px;font-weight:850}.attrval{font-size:20px;font-weight:1000}.rec{color:var(--gold);font-size:10px}.nav{position:fixed;z-index:30;bottom:0;left:50%;transform:translateX(-50%);width:min(540px,100%);display:grid;grid-template-columns:repeat(5,1fr);background:#061017f2;backdrop-filter:blur(15px);border-top:1px solid #274554;padding:7px 8px calc(7px + env(safe-area-inset-bottom))}.nav button{background:none;border:0;color:#78909d;font-size:9px;font-weight:850}.nav b{display:block;font-size:18px}.nav button.on{color:var(--gold)}.modal{position:fixed;z-index:100;inset:0;background:#000b;display:flex;align-items:flex-end;justify-content:center}.sheet{width:min(540px,100%);max-height:93vh;overflow:auto;background:#0a1821;border:1px solid #315363;border-radius:24px 24px 0 0;padding:18px 14px calc(20px + env(safe-area-inset-bottom))}.choice{padding:12px;border:1p </style></head><body><div class="app"><div id="setup"></div><div id="game" class="hidden"><div class="top"><div><div class="brand">DIAMOND LEGACY</div><div class="ver">BASEBALL ALPHA 0.3.1</div></div><div id="saved" class="tiny">Saved</div></div><section id="home" class="screen on"></section><section id="develop" class="screen"></section><section id="player" class="screen"></section><section id="world" class="screen"></section><section id="more" class="screen"></section></div></div><div id="nav" class="nav hidden"></div><div id="modal"></div><script>

const F=['Ethan','Mason','Jayden','Noah','Caleb','Tyler','Jordan','Ryan','Lucas','Dylan','Owen','Aiden','Cam','Marcus','Zane','Cole','Malik','Trevor','Jace','Andre'];
const L=['Brooks','Carter','Miles','Grant','Reed','Hayes','Bennett','Foster','Turner','Price','Collins','Ward','Parker','Stone','Diaz','Morris','King','Young','Bell','Cooper'];

let S=null;const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)],clamp=(n,a,b)=>Math.max(a,Math.min(b,n)),rand=(a,b)=>Math.floor(Math.random()*(b-a+1))+a,pick=a=>a[rand(0,a.length-1)];
function npc(team,i){let p=pick(POS.slice(0,12));return{id:team+'-'+i,name:pick(F)+' '+pick(L),team,pos:p,year:pick(['Freshman','Sophomore','Junior','Senior']),ovr:rand(49,84),pot:rand(63,97),avg:0,hr:0,rbi:0,era:0,k:0,offers:[],trend:0,injured:0}}
function world(userTeam){let teams=TEAMS.map((name,i)=>({name,rating:rand(58,82),w:0,l:0,players:Array.from({length:14},(_,j)=>npc(i,j))}));return{teams,headlines:[userTeam+' begins a new season.'],rankings:[],week:1,playoffBracket:[],champion:null}}
function fresh(p){let two=p.position==='Two-Way',hit=!['SP','RP','CP'].includes(p.position)||two,pit=['SP','RP','CP'].includes(p.position)||two,a={};if(hit)HATTR.forEach(x=>a[x]=rand(46,58));if(pit)PATTR.forEach(x=>a[x]=a[x]??rand(45,57));return{version:'0.3.1',name:p.name||'Alex Morgan',age:15,year:'Freshman',week:1,phase:'regular',team:p.team||'North Ridge High',position:p.position,bats:p.bats,throws:p.throws,goal:p.goal,attrs:a,dp:14,money:75,coachTrust:55,confidence:54,energy:92,stress:20,academics:74,social:55,reputation:8,personality:{WorkEthic:0,Leadership:0,TeamFirst:0,Composure:0,Showmanship:0,Independence:0},traits:[],lineup:hit?8:null,role:pit?(p.position==='RP'?'Bullpen':p.position==='CP'?'Closer':'No. 3 Starter'):null,familiarity:{[p.position]:100},stats:blankStats(),record:{w:0,l:0},gameLog:[],history:[],milestones:{},news:['You are a 15-year-old varsity starter.','Coach is still learning what kind of player you are.'],offers:[],scout:0,rank:rand(22,45),careerScore:0,seasonGames:20,playoffRound:0,seasonEnded:false,eventHistory:[],pendingEvent:null,world:world(p.team||'North Ridge High'),rivalId:null,saveCreated:Date.now()}}
function blankStats(){return{g:0,pa:0,ab:0,h:0,d2:0,d3:0,hr:0,rbi:0,r:0,bb:0,so:0,sb:0,e:0,ip:0,er:0,k:0,w:0,l:0,sv:0}}
function save(){localStorage.setItem('diamondLegacy03',JSON.stringify(S));$('#saved').textContent='Saved'}
function load(){let v=localStorage.getItem('diamondLegacy03');if(v){S=JSON.parse(v);launch()}else setup()}
let setupDraft={};
function setup(step=1){let h='';if(step===1){h=`<div class="card hero"><div class="eyebrow">Build Your Career</div><div class="title">Diamond Legacy</div><p class="sub">Start at 15 as a varsity freshman. Your choices, production and opportunities shape your identity before college or the draft.</p><label>Player Name</label><input id="nm" value="${setupDraft.name||''}" placeholder="Alex Morgan"><label>High School</label><select id="tm">${TEAMS.map(x=>`<option${x===setupDraft.team?' selected':''}>${x}</option>`).join('')}</select><button class="btn" style="margin-top:14px" onclick="saveSetupOne()">Next</button></div>`}
else if(step===2){h=`<div class="card hero"><div class="eyebrow">Player Type</div><div class="title">Choose Your Position</div><label>Position</label><select id="ps">${POS.map(x=>`<option${x===setupDraft.position?' selected':''}>${x}</option>`).join('')}</select><div class="grid2"><div><label>Bats</label><select id="bt"><option>Right</option><option>Left</option><option>Switch</option></select></div><div><label>Throws</label><select id="th"><option>Right</option><option>Left</option></select></div></div><div class="grid2" style="margin-top:14px"><button class="btn ghost" onclick="setup(1)">Back</button><button class="btn" onclick="saveSetupTwo()">Next</button></div></div>`}
else {let goals=['Move Up the Lineup','Become a Power Hitter','Become an Elite Defender','Earn a College Scholarship','Improve Draft Stock','Join the Starting Rotation','Remain a Two-Way Player'];h=`<div class="card hero"><div class="eyebrow">First Goal</div><div class="title">What are you chasing?</div>${goals.map((g,i)=>`<button class="choice" style="width:100%;text-align:left;color:inherit" onclick="chooseGoal(${i})"><strong>${g}</strong><span>Coach recommendations will adapt to this goal.</span></button>`).join('')}<button class="btn ghost" style="margin-top:8px" onclick="setup(2)">Back</button></div>`}$('#setup').innerHTML=h}
function saveSetupOne(){setupDraft.name=$('#nm').value.trim()||'Alex Morgan';setupDraft.team=$('#tm').value;setup(2)}
function saveSetupTwo(){setupDraft.position=$('#ps').value;setupDraft.bats=$('#bt').value;setupDraft.throws=$('#th').value;setup(3)}
function chooseGoal(i){let goals=['Move Up the Lineup','Become a Power Hitter','Become an Elite Defender','Earn a College Scholarship','Improve Draft Stock','Join the Starting Rotation','Remain a Two-Way Player'];start({...setupDraft,goal:goals[i]})}
function start(p){S=fresh(p);let rivals=S.world.teams.flatMap(t=>t.players).filter(x=>x.year==='Freshman').sort((a,b)=>b.ovr-a.ovr);S.rivalId=rivals[0]?.id||null;save();launch();sheet(`<div class="eyebrow">Chapter One</div><div class="title">Freshman Varsity</div><p class="sub">High school moves quickly, but it will define your early reputation, personality and path into college or the draft.</p><div class="notice">DP is the only development currency. Money is for optional opportunities.</div><button class="btn" style="margin-top:14px" onclick="closeSheet()">Opening Week</button>`)}
function launch(){$('#setup').classList.add('hidden');$('#game').classList.remove('hidden');$('#nav').classList.remove('hidden');nav();render()}
function nav(){let items=[['home','⌂','Career'],['develop','↗','Develop'],['player','★','Player'],['world','◉','World'],['more','•••','More']];$('#nav').innerHTML=items.map((x,i)=>`<button class="${i===0?'on':''}" onclick="show('${x[0]}',this)"><b>${x[1]}</b>${x[2]}</button>`).join('')}
function show(id,b){$$('.screen').forEach(x=>x.classList.remove('on'));$('#'+id).classList.add('on');$$('#nav button').forEach(x=>x.classList.remove('on'));b.classList.add('on');render()}
function hitPlayer(){return !['SP','RP','CP'].includes(S.position)||S.position==='Two-Way'}function pitchPlayer(){return ['SP','RP','CP','Two-Way'].includes(S.position)}
function ovr(){let a=Object.values(S.attrs);return Math.round(a.reduce((x,y)=>x+y,0)/a.length)}function avg(){return S.stats.ab?(S.stats.h/S.stats.ab).toFixed(3).replace(/^0/,''):'.000'}function era(){return S.stats.ip?(S.stats.er*9/S.stats.ip).toFixed(2):'0.00'}function ordinal(n){let s=['th','st','nd','rd'],v=n%100;return n+(s[(v-20)%10]||s[v]||s[0])}
function phaseName(){if(S.phase==='regular')return `Regular Season • Week ${S.week}`;if(S.phase==='playoffs')return ['District Quarterfinal','District Semifinal','District Final','State Quarterfinal','State Semifinal','State Championship'][S.playoffRound]||'Playoffs';if(S.phase==='offseason')return `Offseason • Chapter ${S.offseasonWeek}/8`;return 'Career'}
function render(){if(!S)return;renderHome();renderDev();renderPlayer();renderWorld();renderMore();save()}
function renderHome(){let next=S.phase==='regular'?`Game ${S.stats.g+1} of ${S.seasonGames}`:S.phase==='playoffs'?phaseName():'Offseason choice';$('#home').innerHTML=`<div class="card hero"><div class="row"><div><div class="eyebrow">${S.year} • Age ${S.age}</div><div class="title">${S.name}</div><div class="sub">${S.position} • ${S.team} • ${S.lineup?ordinal(S.lineup)+' in lineup':S.role||''}</div></div><div class="ovr">${ovr()}</div></div><div class="kpis" style="margin-top:13px"><div class="pill"><b>${S.coachTrust}</b><span>Trust</span></div><div class="pill"><b>${S.confidence}</b><span>Confidence</span></div><div class="pill"><b>${S.energy}%</b><span>Energy</span></div><div class="pill"><b>${S.dp}</b><span>DP</span></div></div></div><div class="section">Next</div><div class="card"><div class="row"><div><b>${next}</b><div class="sub">Record ${S.record.w}-${S.record.l} • State rank #${S.rank}</div></div><span class="tag">${S.phase.toUpperCase()}</span></div>${S.pendingEvent?`<div class="notice warn" style="margin-top:10px">A decision is waiting.</div>`:''}<button class="btn play" style="margin-top:11px" onclick="advance()">${S.phase==='offseason'?'CONTINUE OFFSEASON':S.pendingEvent?'MAKE DECISION':'PLAY WEEK'}</button></div><div class="section">Career Status</div><div class="grid2"><div class="card"><b>${statusTitle()}</b><div class="sub">${statusSub()}</div></div><div class="card"><b>${topPersonality()}</b><div class="sub">Emerging identity</div></div></div><div class="section">What Matters Now</div><div class="card">${careerPressure().map(x=>`<div class="news">${x}</div>`).join('')}</div><div class="section">News Around You</div><div class="card">${S.news.slice(0,4).map(x=>`<div class="news">${x}</div>`).join('')}</div>`}
function statusTitle(){if(S.offers.length)return `${S.offers.length} College Offer${S.offers.length>1?'s':''}`;if(S.scout>60)return 'Recruiting Target';if(S.lineup&&S.lineup<=3)return 'Top-of-Order Starter';if(S.lineup&&S.lineup<=5)return 'Middle-of-Order Starter';return 'Varsity Starter'}function statusSub(){return S.goal+' • Scout interest '+S.scout}
function topPersonality(){let e=Object.entries(S.personality).sort((a,b)=>b[1]-a[1])[0];if(!e||e[1]<4)return 'Still Developing';return e[0].replace(/([A-Z])/g,' $1').trim()}
function careerPressure(){let a=[];if(S.phase==='regular'&&S.week>15)a.push('Playoff positioning is becoming important.');if(S.energy<55)a.push('Low energy could hurt your next performance.');if(S.academics<60)a.push('Academics may close college options.');if(S.scout>40)a.push('Scouts are beginning to follow your results.');if(S.lineup>5&&avg()>'.320')a.push('Your production supports a lineup promotion.');if(!a.length)a.push('Build production and Coach Trust to unlock a larger role.');return a.slice(0,3)}
function recAttrs(){let posMap={C:['Fielding','Arm','Baseball IQ','Durability'],SS:['Fielding','Arm','Speed','Contact'],CF:['Speed','Fielding','Contact','Arm'],SP:['Control','Movement','Stamina','Pitching IQ'],RP:['Velocity','Control','Movement'],CP:['Velocity','Movement','Control'],'Two-Way':['Durability','Contact','Control','Arm']};let goalMap={'Move Up the Lineup':['Contact','Vision','Discipline'],'Become a Power Hitter':['Power','Contact','Discipline'],'Become an Elite Defender':['Fielding','Arm','Speed'],'Earn a College Scholarship':['Baseball IQ','Contact','Fielding','Control'],'Improve Draft Stock':['Power','Arm','Speed','Velocity'],'Join the Starting Rotation':['Stamina','Control','Movement'],'Remain a Two-Way Player':['Durability','Contact','Control']};return [...new Set([...(posMap[S.position]||['Contact','Fielding','Arm']),...(goalMap[S.goal]||[])])].filter(x=>S.attrs[x]!=null)}
function renderDev(){let r=recAttrs();$('#develop').innerHTML=`<div class="card"><div class="row"><div><div class="eyebrow">Development</div><div class="title" style="font-size:23px">${S.dp} DP Available</div></div><button class="btn small secondary" style="width:auto" onclick="changeGoal()">Goal</button></div><p class="sub">Recommendations reflect your position, current role and chosen goal.</p></div><div class="section">Attributes</div><div class="attrs">${Object.entries(S.attrs).map(([k,v])=>{let cost=Math.max(2,Math.floor((v-35)/6));return `<div class="attr"><div class="row"><span class="attrname">${k}${r.includes(k)?' <span class="rec">★</span>':''}</span><b class="attrval">${v}</b></div><div class="progress"><div class="fill" style="width:${v}%"></div></div><div class="row"><span class="tiny">Cost ${cost} DP</span><button class="btn small secondary" style="width:auto" onclick="upgrade('${k}',${cost})">+</button></div></div>`}).join('')}</div>`}
function upgrade(k,c){if(S.dp<c)return alert('Not enough DP.');if(S.attrs[k]>=99)return;S.dp-=c;S.attrs[k]++;render()}
function renderPlayer(){let p=Object.entries(S.personality).sort((a,b)=>b[1]-a[1]);$('#player').innerHTML=`<div class="card"><div class="eyebrow">Season Line</div><div class="title" style="font-size:23px">${hitPlayer()?avg()+' AVG':era()+' ERA'}</div><div class="grid3"><div class="pill"><b>${S.stats.h}</b><span>Hits</span></div><div class="pill"><b>${S.stats.hr}</b><span>HR</span></div><div class="pill"><b>${S.stats.rbi}</b><span>RBI</span></div><div class="pill"><b>${S.stats.k}</b><span>K</span></div><div class="pill"><b>${S.stats.w}</b><span>Wins</span></div><div class="pill"><b>${S.stats.e}</b><span>Errors</span></div></div></div><div class="section">Personality</div><div class="card">${p.map(([k,v])=>`<div style="margin:7px 0"><div class="row"><span>${k.replace(/([A-Z])/g,' $1').trim()}</span><b>${v}</b></div><div class="progress"><div class="fill" style="width:${clamp(v*5,0,100)}%"></div></div></div>`).join('')}</div><div class="section">Milestones</div><div class="card">${Object.keys(S.milestones).length?Object.entries(S.milestones).slice(-8).reverse().map(([k,v])=>`<div class="news">🏆 ${k} <span class="tiny">${v}</span></div>`).join(''):'<div class="sub">Your first milestone is still ahead.</div>'}</div>`}
function rankWorld(){let all=S.world.teams.flatMap(t=>t.players).sort((a,b)=>b.ovr-a.ovr);return all}
function renderWorld(){let standings=[...S.world.teams].sort((a,b)=>b.w-a.w||a.l-b.l),pros=rankWorld().slice(0,8);$('#world').innerHTML=`<div class="card"><div class="eyebrow">Baseball World</div><div class="title" style="font-size:23px">Your Competition</div><p class="sub">The world moves in the background. This page surfaces the teams and players most relevant to your career.</p></div><div class="section">Standings</div><div class="card"><table><tr><th>Team</th><th>W</th><th>L</th></tr>${standings.slice(0,8).map(t=>`<tr><td>${t.name===S.team?'★ ':''}${t.name}</td><td>${t.w}</td><td>${t.l}</td></tr>`).join('')}</table></div><div class="section">State Prospects</div><div class="card">${pros.map((p,i)=>`<div class="news"><div class="row"><span>#${i+1} ${p.name} • ${p.pos}</span><b>${p.ovr}</b></div><div class="tiny">${S.rivalId===p.id?'Your primary rival • ':''}${p.year} • ${p.team>=0?S.world.teams[p.team].name:''}</div></div>`).join('')}</div>${S.phase==='playoffs'?`<div class="section">Playoff Path</div><div class="card bracket">${playoffPath().map((x,i)=>`<div class="game ${i<S.playoffRound?'good':''}">${i<S.playoffRound?'✓ ':''}${x}</div>`).join('')}</div>`:''}`}

const EVENTS=[
{id:'extra-cages',cat:'baseball',w:9,when:s=>s.energy>45,txt:'The hitting coach offers an extra cage session after practice.',choices:[['Stay late',{dp:5,energy:-9,personality:{WorkEthic:2},game:{hit:7}}],['Take normal reps',{energy:2,personality:{Composure:1}}],['Invite a teammate',{dp:3,energy:-7,coachTrust:2,personality:{Leadership:1,TeamFirst:2},game:{hit:3}}]]},
{id:'big-test',cat:'school',w:7,when:s=>s.academics<88,txt:'A major test lands the morning of your next game.',choices:[['Study late',{academics:7,energy:-10,stress:3,personality:{WorkEthic:1}}],['Balanced night',{academics:3,energy:-3,personality:{Composure:1}}],['Ignore it and focus on baseball',{academics:-7,game:{hit:4,pitch:4},personality:{Independence:2}}]]},
{id:'friend-party',cat:'life',w:6,when:s=>s.social<80,txt:'Friends invite you out the night before a game.',choices:[['Go home early',{social:4,energy:-3,personality:{Composure:1}}],['Stay all night',{social:10,energy:-15,confidence:4,personality:{Showmanship:2}}],['Skip it for baseball',{dp:3,social:-4,personality:{WorkEthic:2}}]]},
{id:'coach-position',cat:'coach',w:4,when:s=>s.coachTrust>62&&s.position!=='Two-Way',txt:'Coach believes your tools might fit a second position.',choices:[['Try the new position',{coachTrust:4,dp:3,personality:{TeamFirst:2},newPosition:true}],['Stay at current position',{confidence:2,personality:{Independence:2}}],['Ask to practice both',{energy:-5,dp:4,personality:{WorkEthic:1,TeamFirst:1},newSecondary:true}]]},
{id:'rival-talk',cat:'rival',w:6,when:s=>s.stats.g>4,txt:'A highly ranked rival calls you overrated before Friday’s game.',choices:[['Answer publicly',{confidence:5,stress:4,reputation:3,personality:{Showmanship:2},game:{hit:3,pitch:3}}],['Say nothing',{confidence:2,personality:{Composure:2},game:{hit:2,pitch:2}}],['Use it in private',{dp:3,energy:-4,personality:{WorkEthic:1,Composure:1},game:{hit:4,pitch:4}}]]},
{id:'sore-body',cat:'health',w:7,when:s=>s.energy<72,txt:'Your body feels unusually sore after a long week.',choices:[['Rest completely',{energy:18,confidence:-1}],['Play through it',{energy:-10,game:{hit:-7,pitch:-7},personality:{Independence:1}}],['Recovery session',{money:-35,energy:14,game:{hit:2,pitch:2}}]]},
{id:'captain-help',cat:'team',w:5,when:s=>s.coachTrust>65,txt:'A younger teammate asks you for help after practice.',choices:[['Work with them',{energy:-6,coachTrust:3,personality:{Leadership:3,TeamFirst:2}}],['Give quick advice',{coachTrust:1,personality:{Leadership:1}}],['Focus on yourself',{dp:2,personality:{Independence:2}}]]},
{id:'scout-game',cat:'recruiting',w:5,when:s=>s.year!=='Freshman'||s.stats.g>10,txt:'A college scout confirms they will attend the next game.',choices:[['Keep routine',{confidence:2,personality:{Composure:2}}],['Add extra work',{dp:3,energy:-8,game:{hit:4,pitch:4},personality:{WorkEthic:1}}],['Promote it online',{reputation:5,stress:5,personality:{Showmanship:2}}]]},
{id:'slump-meeting',cat:'coach',w:8,when:s=>s.stats.g>5&&((hitPlayer()&&Number(avg())<.230)||(pitchPlayer()&&Number(era())>5.5)),txt:'Coach calls you in to discuss your recent slump.',choices:[['Accept mechanical changes',{dp:5,confidence:-2,game:{hit:5,pitch:5},personality:{TeamFirst:1}}],['Trust your approach',{confidence:4,personality:{Independence:2}}],['Ask for one game off',{energy:14,coachTrust:-2}]]},
{id:'hot-interview',cat:'media',w:5,when:s=>s.confidence>72,txt:'The school paper wants to feature your hot start.',choices:[['Praise teammates',{reputation:3,coachTrust:2,personality:{Leadership:1,TeamFirst:2}}],['Embrace the spotlight',{reputation:7,stress:3,personality:{Showmanship:3}}],['Decline politely',{stress:-2,personality:{Composure:1}}]]},
{id:'family-weekend',cat:'family',w:5,when:s=>true,txt:'Your family plans a weekend activity that conflicts with optional baseball work.',choices:[['Choose family',{energy:8,social:6,stress:-5}],['Choose baseball',{dp:5,energy:-5,personality:{WorkEthic:2}}],['Split the day',{dp:2,social:3,energy:-2,personality:{Composure:1}}]]},
{id:'equipment-break',cat:'equipment',w:3,when:s=>true,txt:'Your favorite piece of equipment breaks before the next game.',choices:[['Use school equipment',{money:0,confidence:-2}],['Buy a replacement',{money:-55,confidence:3,game:{hit:2,pitch:2}}],['Borrow from a teammate',{social:3,personality:{TeamFirst:1}}]]}
];
function generatedEvents(){let arr=[];let subjects=['Assistant coach','Team captain','Guidance counselor','Parent','Teammate','Trainer','Local reporter'];let situations=['notices your recent effort','questions your preparation','offers unexpected advice','creates an extra opportunity','asks you to help someone','challenges your routine'];for(let i=0;i<220;i++){let kind=i%6,sub=subjects[i%subjects.length],sit=situations[(i*3)%situations.length];arr.push({id:'gen'+i,cat:['baseball','school','family','team','media','life'][kind],w:1,when:s=>s.stats.g>i%12,txt:`${sub} ${sit}.`,choices:[['Put in extra work',{dp:2+(i%4),energy:-3-(i%5),personality:{WorkEthic:1},game:{hit:i%3,pitch:i%3}}],['Handle it calmly',{confidence:1,stress:-1,personality:{Composure:1}}],['Make it about the team',{coachTrust:1,social:2,personality:{TeamFirst:1,Leadership:i%2}}]]})}return arr}EVENTS.push(...generatedEvents());
function careerDirector(){if(Math.random()<.18)return null;let valid=EVENTS.filter(e=>e.when(S)&&!S.eventHistory.slice(-8).includes(e.id));if(!valid.length)return null;let pool=[];valid.forEach(e=>{for(let i=0;i<e.w;i++)pool.push(e)});return pick(pool)}
function showEvent(e){sheet(`<div class="eyebrow">${e.cat} decision</div><div class="title" style="font-size:23px">This Week</div><p class="sub">${e.txt}</p>${e.choices.map((c,i)=>`<div class="choice" onclick="resolveEvent(${i})"><strong>${c[0]}</strong><span>${effects(c[1])}</span></div>`).join('')}`)}
function effects(o){let a=[];for(let [k,v] of Object.entries(o)){if(k==='personality')a.push('Shapes personality');else if(k==='game')a.push('Affects next game');else if(k==='newPosition'||k==='newSecondary')a.push('May change your role');else a.push(`${pretty(k)} ${v>0?'+':''}${v}`)}return a.join(' • ')||'No immediate effect'}function pretty(k){return k.replace(/([A-Z])/g,' $1').replace(/^./,x=>x.toUpperCase())}
function resolveEvent(i){let e=S.pendingEvent,c=e.choices[i],o=c[1];if(o.money&&S.money+o.money<0)return alert('You cannot afford that option.');apply(o);S.eventHistory.push(e.id);S.pendingEvent=null;S.lastChoice={label:c[0],game:o.game||{}};closeSheet();playGame()}
function apply(o){for(let [k,v] of Object.entries(o)){if(['personality','game','newPosition','newSecondary'].includes(k))continue;if(typeof S[k]==='number')S[k]+=v}S.energy=clamp(S.energy,0,100);S.confidence=clamp(S.confidence,0,100);S.coachTrust=clamp(S.coachTrust,0,100);S.academics=clamp(S.academics,0,100);S.stress=clamp(S.stress,0,100);if(o.personality)for(let [k,v] of Object.entries(o.personality))S.personality[k]+=v;if(o.newPosition){let choices=POS.filter(x=>x!==S.position);let n=pick(choices);S.familiarity[n]=35;S.news.unshift(`Coach begins trying you at ${n}.`)}if(o.newSecondary){let n=pick(POS.filter(x=>x!==S.position));S.familiarity[n]=50;S.secondary=n;S.news.unshift(`${n} becomes your secondary position.`)}}
function playGame(){let bonus=S.lastChoice?.game||{},hit=null,pitch=null,quality=0;if(hitPlayer()){let base=(S.attrs.Contact||50)+(S.attrs.Vision||50)+(S.confidence-50)*.25+(S.energy-70)*.15+(bonus.hit||0)+rand(-20,20);let ab=rand(3,5),hits=clamp(Math.floor((base-30)/24)+rand(-1,1),0,ab),hr=(hits&&Math.random()<((S.attrs.Power||45)/250))?1:0,rbi=hr*rand(1,3)+rand(0,Math.max(0,hits-1)),bb=Math.random()<((S.attrs.Discipline||50)/180)?1:0;hit={ab,hits,hr,rbi,bb};S.stats.g++;S.stats.pa+=ab+bb;S.stats.ab+=ab;S.stats.h+=hits;S.stats.hr+=hr;S.stats.rbi+=rbi;S.stats.bb+=bb;S.stats.so+=rand(0,2);S.stats.r+=hits?rand(0,hits):0;S.stats.sb+=Math.random()<((S.attrs.Speed||40)/260)?1:0;S.stats.e+=Math.random()>(S.attrs.Fielding||55)/110?1:0;quality+=hits*2+hr*3+rbi}
if(pitchPlayer()){let skill=((S.attrs.Control||50)+(S.attrs.Movement||50)+(S.attrs.Velocity||50))/3+(S.confidence-50)*.2+(bonus.pitch||0);let ip=S.position==='RP'||S.position==='CP'?rand(1,3):rand(4,7),er=clamp(Math.round((78-skill)/13)+rand(-1,2),0,6),k=Math.max(0,Math.round(ip*(S.attrs.Velocity||50)/75)+rand(-2,2));pitch={ip,er,k};S.stats.ip+=ip;S.stats.er+=er;S.stats.k+=k;if(S.position==='CP'&&er<=1)S.stats.sv++;quality+=k-er*2}
let win=quality+rand(-5,7)>=4;if(win){S.record.w++;S.world.teams[0].w++}else{S.record.l++;S.world.teams[0].l++}if(pitch&&S.position==='SP'){if(win&&pitch.er<=3){S.stats.w++}else if(!win)S.stats.l++}let stars=clamp(Math.round((quality+6)/4),1,5),dp=6+stars*2+(S.lastChoice?1:0);S.dp+=dp;S.confidence=clamp(S.confidence+(stars-3)*3,0,100);S.coachTrust=clamp(S.coachTrust+(stars>=4?2:stars===1?-2:0),0,100);S.energy=clamp(S.energy-rand(5,10),0,100);S.gameLog.unshift({week:S.week,phase:S.phase,win,hit,pitch,stars});simulateWorld();milestones(hit,pitch);roleLogic();recruiting(stars);S.lastChoice=null;if(S.phase==='regular'){S.week++;if(S.stats.g>=S.seasonGames){beginPlayoffs();return}}else if(S.phase==='playoffs'){if(win){S.playoffRound++;if(S.playoffRound>=6){championship();return}}else{endSeason(false);return}}weekSheet(stars,hit,pitch,dp,win)}
function simulateWorld(){S.world.teams.forEach((t,ti)=>{if(ti===0)return;let win=Math.random()<t.rating/140;if(win)t.w++;else t.l++;t.players.forEach(p=>{if(p.injured){p.injured--;return}p.trend=rand(-2,3);p.ovr=clamp(p.ovr+(Math.random()<.12?(p.trend>0?1:0):0),45,99);p.avg=clamp(p.avg+(rand(0,4)/1000),0,.500);p.hr+=Math.random()<p.ovr/350?1:0;if(Math.random()<.01)p.injured=rand(1,4)})});if(Math.random()<.25){let p=pick(S.world.teams.flatMap(t=>t.players));let line=pick([`${p.name} rises in the state rankings.`,`${p.name} hits two home runs in a district game.`,`${p.name} receives interest from ${pick(COLLEGES)}.`,`${p.name} will miss time with an injury.`]);S.world.headlines.unshift(line);S.news.unshift(line)}}
function milestones(h,p){if(S.stats.g===1)unlock('Varsity Debut');if(h?.hits&&!S.milestones['First Varsity Hit'])unlock('First Varsity Hit');if(h?.hr&&!S.milestones['First Home Run'])unlock('First Home Run');if(h?.hits>=3)unlock('First Three-Hit Game');if(p?.k>=5&&!S.milestones['First Five-Strikeout Game'])unlock('First Five-Strikeout Game')}
function unlock(n){if(S.milestones[n])return;S.milestones[n]=`${S.year}, Week ${S.week}`;S.careerScore+=10;S.news.unshift(`Milestone: ${n}.`)}
function roleLogic(){if(hitPlayer()&&S.lineup){let obp=S.stats.pa?(S.stats.h+S.stats.bb)/S.stats.pa:0,slug=S.stats.ab?(S.stats.h+S.stats.hr*3)/S.stats.ab:0;let target=S.lineup;if(obp>.390&&S.lineup>2)target=2;else if(slug>.520&&S.lineup>4)target=4;else if(Number(avg())>.315&&S.lineup>5)target=S.lineup-2;if(target<S.lineup&&S.coachTrust>60){S.lineup=target;S.news.unshift(`Coach moves you to ${ordinal(target)} in the order.`);unlock('First Lineup Promotion')}}if(pitchPlayer()&&S.position==='RP'&&S.stats.k>18&&Number(era())<2.5&&S.coachTrust>65){S.role='High-Leverage Reliever';S.news.unshift('Coach promotes you into high-leverage innings.')}}
function recruiting(stars){if(S.year==='Freshman'&&S.stats.g<12)return;S.scout=clamp(S.scout+(stars-2)+Math.max(0,ovr()-65)/8,0,100);S.rank=clamp(Math.round(55-(S.scout*.45)-(ovr()-55)*.5),1,100);let needed=S.year==='Sophomore'?58:S.year==='Junior'?45:S.year==='Senior'?35:72;if(S.scout>needed&&S.offers.length<Math.floor(S.scout/20)&&Math.random()<.3){let c=pick(COLLEGES.filter(x=>!S.offers.includes(x)));S.offers.push(c);S.news.unshift(`${c} offers you a scholarship.`);unlock('First College Offer')}}
function beginPlayoffs(){let qualify=S.record.w>=8;if(!qualify){endSeason(false);return}S.phase='playoffs';S.playoffRound=0;S.news.unshift('Your team qualifies for the district playoffs.');sheet(`<div class="eyebrow">Postseason</div><div class="title">The Playoffs Begin</div><p class="sub">Your ${S.record.w}-${S.record.l} record earns a place in the bracket. Every game is now an elimination game.</p><div class="card bracket">${playoffPath().map(x=>`<div class="game">${x}</div>`).join('')}</div><button class="btn" style="margin-top:12px" onclick="closeSheet();render()">District Quarterfinal</button>`)}
function playoffPath(){return ['District Quarterfinal','District Semifinal','District Championship','State Quarterfinal','State Semifinal','State Championship']}
function championship(){S.world.champion=S.team;unlock('State Champion');S.news.unshift(`${S.team} wins the state championship!`);endSeason(true)}
function endSeason(champ){S.seasonEnded=true;S.phase='offseason';S.offseasonWeek=1;S.history.push({year:S.year,record:{...S.record},stats:{...S.stats},ovr:ovr(),champion:champ});sheet(`<div class="eyebrow">Season Complete</div><div class="title">${champ?'STATE CHAMPIONS':'The Season Ends'}</div><div class="stars">${champ?'★★★★★':'★★★☆☆'}</div><p class="sub">${S.year}: ${S.record.w}-${S.record.l} • ${hitPlayer()?avg()+' AVG':era()+' ERA'} • ${S.milestones?Object.keys(S.milestones).length:0} career milestones</p><div class="notice">Your offseason choices will shape development, personality, academics and recruiting.</div><button class="btn" style="margin-top:12px" onclick="closeSheet();render()">Begin Offseason</button>`)}
const OFF=[
['Other Sports','Basketball and wrestling coaches ask whether you will join them.',[['Play basketball',{dp:5,energy:-5,social:6,personality:{TeamFirst:1}}],['Wrestle',{dp:6,energy:-8,personality:{WorkEthic:1,Composure:1}}],['Baseball only',{dp:9,social:-3,personality:{WorkEthic:2}}]]],
['Summer Baseball','A strong travel team offers you a demanding summer schedule.',[['Join full-time',{dp:8,scout:9,energy:-10,stress:5}],['Play locally',{dp:5,energy:3,social:3}],['Train privately',{money:-60,dp:9,personality:{WorkEthic:1}}]]],
['Family Time','Your family plans a trip during optional workouts.',[['Take the trip',{energy:16,social:7,stress:-8}],['Bring training gear',{dp:4,energy:8,personality:{Composure:1}}],['Stay for camp',{dp:9,coachTrust:4,social:-5,personality:{WorkEthic:2}}]]],
['Academics','Your academic profile needs attention before recruiting intensifies.',[['Summer classes',{academics:12,stress:5}],['Tutor twice weekly',{money:-35,academics:8,stress:-2}],['Focus on baseball',{dp:7,academics:-6}]]],
['Body Development','Your trainer outlines three offseason plans.',[['Strength plan',{dp:7,energy:-5,attr:'Power'}],['Speed plan',{dp:7,energy:-5,attr:'Speed'}],['Durability plan',{dp:7,energy:2,attr:'Durability'}]]],
['Showcase Decision','A regional showcase could raise your profile.',[['Attend',{money:-75,scout:12,stress:4}],['Skip and develop',{dp:8,energy:4}],['Attend with no extra prep',{money:-45,scout:7}]]],
['Leadership Opportunity','Coach asks older players to organize voluntary workouts.',[['Lead the group',{coachTrust:5,energy:-6,personality:{Leadership:3,TeamFirst:2}}],['Attend quietly',{dp:4,personality:{WorkEthic:1}}],['Train alone',{dp:5,personality:{Independence:2}}]]],
['Preseason Focus','Choose your final emphasis before the new season.',[['Polish strengths',{dp:8,confidence:5}],['Fix a weakness',{dp:10,confidence:-2}],['Arrive fresh',{energy:20,stress:-8}]]]
];
function offseasonEvent(){let e=OFF[S.offseasonWeek-1];if(!e){newSeason();return}sheet(`<div class="eyebrow">Offseason ${S.offseasonWeek}/8</div><div class="title" style="font-size:23px">${e[0]}</div><p class="sub">${e[1]}</p>${e[2].map((c,i)=>`<div class="choice" onclick="resolveOff(${i})"><strong>${c[0]}</strong><span>${effects(c[1])}</span></div>`).join('')}`)}
function resolveOff(i){let e=OFF[S.offseasonWeek-1],o=e[2][i][1];if(o.money&&S.money+o.money<0)return alert('You cannot afford that option.');apply(o);if(o.attr&&S.attrs[o.attr]!=null)S.attrs[o.attr]=clamp(S.attrs[o.attr]+2,0,99);S.offseasonWeek++;closeSheet();render()}
function newSeason(){let yrs=['Freshman','Sophomore','Junior','Senior'],i=yrs.indexOf(S.year);if(i===3){highSchoolDecision();return}S.year=yrs[i+1];S.age++;S.week=1;S.phase='regular';S.offseasonWeek=0;S.stats=blankStats();S.record={w:0,l:0};S.energy=100;S.confidence=60;S.dp+=12;S.seasonEnded=false;S.world.teams.forEach(t=>{t.w=0;t.l=0});S.news.unshift(`${S.year} season begins.`);sheet(`<div class="eyebrow">New Season</div><div class="title">${S.year} Year</div><p class="sub">Your ratings, personality, reputation, rivalries and recruiting profile carry forward.</p><button class="btn" onclick="closeSheet();render()">Opening Week</button>`)}
function highSchoolDecision(){let draft=ovr()>=82&&S.scout>=75;sheet(`<div class="eyebrow">High School Complete</div><div class="title">Your Next Chapter</div><p class="sub">Your personality, production, reputation and opportunities are ready to carry into college or professional baseball.</p><div class="notice">College and pro progression will be added in the next expansion.</div><div class="section">Current Paths</div>${S.offers.map(x=>`<div class="choice"><strong>${x}</strong><span>College offer</span></div>`).join('')||'<div class="choice"><strong>Junior College / Walk-On Route</strong><span>Continue developing</span></div>'}${draft?'<div class="choice"><strong>MLB Draft Eligible</strong><span>Your tools and scouting profile created a legitimate draft path.</span></div>':''}<button class="btn secondary" onclick="closeSheet()">Return to Career</button>`)}
function weekSheet(stars,h,p,dp,win){sheet(`<div class="eyebrow">${phaseName()}</div><div class="stars">${[1,2,3,4,5].map(i=>`<span class="${i<=stars?'lit':''}">★</span>`).join('')}</div><div class="title">${win?'Team Win':'Team Loss'}</div><div class="sub">${h?`${h.hits}-for-${h.ab}${h.hr?' • '+h.hr+' HR':''}${h.rbi?' • '+h.rbi+' RBI':''}`:''}${h&&p?'<br>':''}${p?`${p.ip} IP • ${p.er} ER • ${p.k} K`:''}</div><div class="section">Progress</div><div class="card"><div class="row"><span>Development Points</span><b class="good">+${dp}</b></div><div class="row"><span>Coach Trust</span><b>${S.coachTrust}</b></div><div class="row"><span>State Rank</span><b>#${S.rank}</b></div></div><button class="btn" style="margin-top:12px" onclick="closeSheet();render()">Continue</button>`)}
function changeGoal(){let gs=['Move Up the Lineup','Become a Power Hitter','Become an Elite Defender','Earn a College Scholarship','Improve Draft Stock','Join the Starting Rotation','Remain a Two-Way Player'];sheet(`<div class="eyebrow">Development Goal</div><div class="title" style="font-size:23px">Choose Your Focus</div>${gs.map(g=>`<div class="choice" onclick="S.goal='${g}';closeSheet();render()"><strong>${g}</strong><span>Recommendations adapt immediately.</span></div>`).join('')}`)}
function finances(){sheet(`<div class="eyebrow">Money & Opportunities</div><div class="title">$${S.money}</div><div class="notice">Parents cover normal equipment, school fees and local travel. Money is for optional opportunities.</div>${[['Private Session',45,'dp',5],['Recovery Treatment',35,'energy',18],['Regional Showcase',75,'scout',12]].map(x=>`<div class="choice" onclick="buy('${x[0]}',${x[1]},'${x[2]}',${x[3]})"><strong>${x[0]} • $${x[1]}</strong><span>+${x[3]} ${pretty(x[2])}</span></div>`).join('')}`)}function buy(n,c,k,v){if(S.money<c)return alert('Not enough money.');S.money-=c;S[k]=clamp((S[k]||0)+v,0,100);closeSheet();render()}
function gameLog(){sheet(`<div class="eyebrow">Game Log</div><div class="title" style="font-size:23px">${S.year} Season</div>${S.gameLog.length?S.gameLog.map(g=>`<div class="game"><div class="row"><b>${g.win?'W':'L'} • Week ${g.week}</b><span>${'★'.repeat(g.stars)}</span></div><div class="tiny">${g.hit?`${g.hit.hits}-${g.hit.ab}, ${g.hit.hr} HR, ${g.hit.rbi} RBI`:''}${g.pitch?` • ${g.pitch.ip} IP, ${g.pitch.er} ER, ${g.pitch.k} K`:''}</div></div>`).join(''):'<p class="sub">No games yet.</p>'}<button class="btn secondary" style="margin-top:10px" onclick="closeSheet()">Close</button>`)}
function seasonHistory(){sheet(`<div class="eyebrow">Season History</div><div class="title" style="font-size:23px">Your High School Career</div>${S.history.map(h=>`<div class="card" style="margin-bottom:8px"><div class="row"><b>${h.year}</b><span>${h.record.w}-${h.record.l}</span></div><div class="tiny">${h.ovr} OVR ${h.champion?'• State Champion':''}</div></div>`).join('')||'<p class="sub">Your first season is underway.</p>'}<button class="btn secondary" onclick="closeSheet()">Close</button>`)}
function exportSave(){let b=new Blob([JSON.stringify(S,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='diamond-legacy-alpha-03-save.json';a.click()}function resetGame(){if(confirm('Delete this career and start over?')){localStorage.removeItem('diamondLegacy03');location.reload()}}
function sheet(h){$('#modal').innerHTML=`<div class="modal"><div class="sheet">${h}</div></div>`}function closeSheet(){$('#modal').innerHTML=''}
load();
</script></body></html>
