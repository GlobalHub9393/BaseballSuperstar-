function openOffseasonModal(){if(!state.offseason)return;const eligible=OFFSEASON_OPTIONS.filter(o=>isPitcher()||isTwoWay()||o.id!=='pitchAcademy').filter(o=>isHitter()||o.id!=='privateHit');const selected=state.offseason.selections;openModal(`<div class="eyebrow">${state.season.grade} Offseason</div><h2>Choose 3 Offseason Activities</h2><p class="muted">This is where the biggest development jumps happen. Your choices become part of permanent career history.</p><div class="notification">Selected ${selected.length} of 3 · Available money: ${money(state.player.money)}</div><div>${eligible.map(o=>`<button class="choice ${selected.includes(o.id)?'selected':''}" onclick="toggleOffseason('${o.id}')"><b>${o.icon} ${o.name} ${o.cost?`· ${money(o.cost)}`:'· Free'}</b><small>${o.desc}</small><small>${effectText(o.effects)}</small></button>`).join('')}</div><button class="btn good block" style="margin-top:11px" ${selected.length!==3?'disabled':''} onclick="completeOffseason()">Complete Offseason</button><button class="btn secondary block" style="margin-top:8px" onclick="closeModal()">Return Later</button>`)}
function toggleOffseason(id){const sel=state.offseason.selections;const option=OFFSEASON_OPTIONS.find(o=>o.id===id);if(sel.includes(id))sel.splice(sel.indexOf(id),1);else{if(sel.length>=3)return toast('Choose only three activities');const spent=sel.reduce((sum,x)=>sum+(OFFSEASON_OPTIONS.find(o=>o.id===x)?.cost||0),0);if(spent+option.cost>state.player.money)return toast('Not enough money for that plan');sel.push(id)}saveGame(true);openOffseasonModal()}
function completeOffseason(){const sel=state.offseason.selections;if(sel.length!==3)return;const p=state.player;sel.forEach(id=>{const o=OFFSEASON_OPTIONS.find(x=>x.id===id);p.money-=o.cost;applyEffect(o.effects);Object.entries(o.effects).forEach(([k,v])=>{if(ALL_ATTRS.includes(k)&&v>0)addXP(k,v*4)});addHistory('offseason',o.name,`${o.desc} ${effectText(o.effects)}`)});p.gradeIndex++;p.grade=GRADES[p.gradeIndex];p.age=15+p.gradeIndex;p.weight=clamp(p.weight+r(4,11),120,270);p.health=clamp(p.health+20,0,100);p.energy=100;p.confidence=clamp(p.confidence+r(2,7),0,100);p.coachTrust=clamp(p.coachTrust+r(2,6),0,100);state.offseason=null;startSeason(false);closeModal();saveGame(true);renderAll();switchTab('home');openModal(`<div class="eyebrow">New Season</div><h2>${p.grade} Year Begins</h2><p class="muted">You return at age ${p.age}, ${p.weight} lb, and ${calcOVR()} OVR. Select your preseason training plan to begin.</p><button class="btn block" onclick="closeModal();openTrainingPlanModal()">Choose Preseason Plan</button>`)}

function draftInterest(){const p=state.player;const ovr=calcOVR();const score=ovr*1.05+p.scoutInterest*.35+p.reputation*.12+(p.gradeIndex===3?5:0);if(score>=112)return {round:'Rounds 1–3',bonus:r(900000,4200000),interest:'High'};if(score>=98)return {round:'Rounds 4–10',bonus:r(180000,850000),interest:'Moderate'};if(score>=85)return {round:'Rounds 11–20',bonus:r(35000,175000),interest:'Some'};return {round:'Unlikely to be drafted',bonus:0,interest:'Low'}}
function openGraduationModal(){const offers=state.world.colleges.filter(c=>c.offer).sort((a,b)=>b.interest-a.interest);const draft=draftInterest();openModal(`<div class="eyebrow">High School Chapter Complete</div><h2>Choose Your Next Step</h2><p class="muted">Your four-year high-school history is permanent. This choice will carry into the college and professional chapters.</p><div class="notification">Draft projection: <b>${draft.round}</b>${draft.bonus?` · Estimated bonus ${money(draft.bonus)}`:''}</div>${offers.slice(0,5).map(c=>`<button class="modal-choice" onclick="chooseGraduation('college',${c.id})"><b>Attend ${c.name}</b><small>${c.scholarship}% scholarship · ${c.status} · Playing time ${c.playingTime} · Development ${c.development}${state.settings.nil!=='off'?` · Projected NIL ${money(projectedNIL(c))}`:''}</small></button>`).join('')}${draft.bonus?`<button class="modal-choice" onclick="chooseGraduation('pro',0)"><b>Enter Professional Baseball</b><small>${draft.round} projection · Estimated signing bonus ${money(draft.bonus)} · Negotiation: ${state.settings.negotiation}</small></button>`:''}<button class="modal-choice" onclick="chooseGraduation('walkon',0)"><b>Remain Uncommitted / Seek a Walk-On Opportunity</b><small>Keep options open, but lose leverage and guaranteed aid.</small></button><button class="btn secondary block" style="margin-top:11px" onclick="closeModal()">Review Career Before Deciding</button>`)}
function projectedNIL(c){if(state.settings.nil==='off')return 0;const mult={simplified:.6,realistic:1,expanded:1.45}[state.settings.nil]||1;return Math.round((c.nil*80+state.player.reputation*55+state.player.scoutInterest*40)*mult/100)*100}
function chooseGraduation(type,id){let text,title;if(type==='college'){const c=state.world.colleges.find(x=>x.id===id);c.committed=true;title=`Committed to ${c.name}`;text=`Accepted a ${c.scholarship}% scholarship with development rated ${c.development} and playing-time opportunity ${c.playingTime}.`;state.career.graduationDecision={type,collegeId:id,title,text}}else if(type==='pro'){const d=draftInterest();title='Chose Professional Baseball';text=`Entered the professional draft with a ${d.round} projection and estimated ${money(d.bonus)} bonus.`;state.career.graduationDecision={type,title,text,projection:d}}else{title='Stayed Uncommitted';text='Chose to pursue late offers and walk-on opportunities.';state.career.graduationDecision={type,title,text}}addHistory('decision',title,text);addHeadline(title,text,'🎓');closeModal();saveGame(true);renderAll();openModal(`<div class="eyebrow">Legacy Continues</div><h2>${title}</h2><p class="muted">${text}</p><div class="notification">Diamond Legacy v0.4 contains the complete high-school chapter. Your save is ready for the college or professional expansion.</div><button class="btn block" onclick="closeModal();switchTab('history')">View Full High-School History</button>`)}

function maybePopup(){if(!chance(popupChance()))return;const p=state.player;const notes=[];if(p.energy<42)notes.push(['Recovery Alert','Your energy is low. Auto-recovery will help, but performance may dip until you recover.','🩺']);if(p.scoutInterest>=30)notes.push(['Recruiting Buzz','More programs are tracking your season. New messages may arrive soon.','👀']);if(p.hot>=3)notes.push(['Hot Streak','Your recent form is becoming one of the biggest stories in the state.','🔥']);if(p.coachTrust>=80)notes.push(['Coach Trust','Your coach is giving you more freedom to play through difficult stretches.','📋']);notes.push(['Week Ahead',`${currentWeekGames().length} games are scheduled. ${state.week.scenarioQuiet?'No routine scenario requires attention.':'One weekly scenario is available.'}`,'⚾']);const n=pick(notes);openModal(`<div class="center"><div style="font-size:2.8rem">${n[2]}</div><div class="eyebrow">Around the Program</div><h2>${n[0]}</h2><p class="muted">${n[1]}</p><button class="btn block" onclick="closeModal()">Got It</button></div>`)}

function renderAll(){if(!state)return;applyInterfaceSettings();renderHome();renderPlayer();renderStats();renderRecruiting();renderHistory();renderMore();updateTopbar();updateBadge()}
function updateTopbar(){if(!state)return;$('#topMeta').textContent=`v${VERSION} · ${state.player.grade} · ${state.season?.phase||'Offseason'}`}
function updateBadge(){const n=unresolvedInbox().length;const b=$('#recruitBadge');b.textContent=n;b.classList.toggle('hidden',!n)}
function switchTab(tab){currentTab=tab;$$('.tab').forEach(el=>el.classList.add('hidden'));$(`#${tab}Tab`).classList.remove('hidden');$$('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));renderAll();window.scrollTo({top:0,behavior:'auto'})}

function renderHome(){const p=state.player,a=nextAction(),plan=p.trainingPlan?getPlan():null,s=state.season;const games=currentWeekGames();const stepData=[{icon:plan?'✓':'1',label:'Plan',done:!!plan&&!trainingWindowNeeded(),current:a.kind==='plan'},{icon:state.week?.scenarioResolved?'✓':'2',label:'Choice',done:state.week?.scenarioResolved,current:a.kind==='scenario'},{icon:state.week?.gamesPlayed||'3',label:'Games',done:games.length&&games.every(g=>g.played),current:a.kind==='game'},{icon:state.week?.recapViewed?'✓':'4',label:'Recap',done:state.week?.recapViewed,current:a.kind==='recap'},{icon:'▶',label:'Advance',done:false,current:a.kind==='advance'}];const h=s.stats.hitting,ps=s.stats.pitching;$('#homeTab').innerHTML=`<div class="hero" style="margin-bottom:13px"><div class="eyebrow">${s.phase} · ${s.grade} · Week ${s.week}</div><div style="display:flex;justify-content:space-between;gap:12px;align-items:flex-end"><div><h1>${p.name}</h1><p>${p.position}${p.secondary?` / ${p.secondary}`:''} · ${p.school} · Age ${p.age}</p></div><div class="center"><div class="ovr">${calcOVR()}</div><div class="ovr-label">Overall</div></div></div><div class="stat-strip"><div class="mini"><b>${s.teamWins}-${s.teamLosses}</b><span>Team</span></div><div class="mini"><b>${p.lineup}${ordinal(p.lineup)}</b><span>Lineup</span></div><div class="mini"><b>${p.coachTrust}</b><span>Trust</span></div><div class="mini"><b>${p.scoutInterest}</b><span>Scouts</span></div><div class="mini"><b>${p.energy}</b><span>Energy</span></div><div class="mini"><b>${p.confidence}</b><span>Confidence</span></div></div></div>
<div class="week-path">${stepData.map(x=>`<div class="path-step ${x.done?'done':x.current?'current':'locked'}"><b>${x.icon}</b>${x.label}</div>`).join('')}</div>
<div class="card action-hero" style="margin-top:13px"><div class="action-label">What’s Next</div><div class="action-title">${a.icon} ${a.title}</div><p class="action-copy">${a.copy}</p><button class="btn ${a.kind==='recruit'?'warn':a.kind==='advance'?'good':''} primary-action" onclick="doNextAction()">${a.button}</button></div>
<div class="dashboard" style="margin-top:13px"><div><div class="card"><div class="plan-top"><div><div class="eyebrow">Automatic Training</div><h2>${plan?`${plan.icon} ${plan.name}`:'No Plan Selected'}</h2></div>${plan?`<span class="pill good">Active</span>`:`<span class="pill warn">Required</span>`}</div><p class="muted tiny">${plan?`${plan.desc} Next normal adjustment: ${s.phase==='Playoffs'?'Offseason':s.week<7?'Midseason':'Postseason'}.`:'Choose a plan and weekly development will happen automatically.'}</p>${plan?`<div class="tag-row">${plan.major.slice(0,4).map(x=>`<span class="pill">↑ ${ATTR_LABELS[x]}</span>`).join('')}${plan.slow.slice(0,2).map(x=>`<span class="pill bad">↓ ${ATTR_LABELS[x]}</span>`).join('')}</div>`:''}</div>
<div class="card" style="margin-top:13px"><h3>This Week’s Schedule</h3>${games.map(g=>`<div class="schedule-item"><div class="schedule-week"><b>${g.played?g.result.win?'W':'L':g.gameNo}</b><span>${g.played?g.result.score:'GAME'}</span></div><div><b>${g.home?'vs.':'at'} ${g.opponent}</b><p class="muted tiny" style="margin:2px 0">${g.played?g.result.line:'Ready to simulate from Home'}</p></div><span class="pill ${g.played?g.result.win?'good':'bad':''}">${g.played?'Final':'Next'}</span></div>`).join('')||'<p class="muted tiny">No games scheduled.</p>'}</div></div>
<div><div class="card"><h3>Season Snapshot</h3>${isPitcher()&&!isTwoWay()?`${meter('ERA quality',clamp(100-ps.era*16,0,100),'purple')}<p class="muted tiny">${ps.w}-${ps.l} · ${innings(ps.outs)} IP · ${ps.k} K · ${ps.whip.toFixed(2)} WHIP</p>`:`${meter('On-base impact',clamp(h.obp*180,0,100))}<p class="muted tiny">${fmt3(h.avg)} AVG · ${h.hr} HR · ${h.rbi} RBI · ${fmt3(h.ops)} OPS</p>`}${meter('Coach Trust',p.coachTrust)}${meter('Scout Interest',p.scoutInterest,'warn')}</div>
<div class="card" style="margin-top:13px"><h3>Reminders</h3>${trainingWindowNeeded()?reminder('📈','Training-plan window open','Choose your seasonal development strategy before continuing.'):''}${unresolvedInbox().length?reminder('★','Recruiting response needed',`${unresolvedInbox().length} message${unresolvedInbox().length===1?'':'s'} require a decision.`):''}${p.energy<40?reminder('🩺','Recovery recommended','Low energy can reduce game-day performance and increase injury risk.'):''}${!trainingWindowNeeded()&&!unresolvedInbox().length&&p.energy>=40?reminder('✓','Career flow is clear','Use the large What’s Next button. No important action is hidden in another tab.'):''}</div></div></div>
<div class="section-title"><h2>Latest Career News</h2><span>Notable moments only</span></div><div class="card">${state.career.headlines.slice(0,5).map(n=>`<div class="news"><div class="news-icon">${n.icon}</div><div><b>${n.title}</b><p>${n.text}</p></div></div>`).join('')||'<p class="muted tiny">Your career story begins here.</p>'}</div>`}
function reminder(icon,title,text){return `<div class="reminder"><div class="reminder-icon">${icon}</div><div><b>${title}</b><p>${text}</p></div></div>`}

function renderPlayer(){const p=state.player,attrs=isPitcher()&&!isTwoWay()?PITCHER_ATTRS:isTwoWay()?ALL_ATTRS.filter(a=>p.attrs[a]>=35):HITTER_ATTRS;const plan=p.trainingPlan?getPlan():null;$('#playerTab').innerHTML=`<div class="section-title"><h2>Player Development</h2><span>Permanent ratings and progress</span></div><div class="dashboard"><div><div class="card"><div class="player-head"><div class="avatar">${p.position}</div><div style="flex:1"><div class="player-name">${p.name}</div><div class="player-meta">${p.grade} · ${p.position} · Bats ${p.bats} / Throws ${p.throws}<br>${p.height}, ${p.weight} lb · ${p.hometown}</div></div><div class="center"><div class="ovr">${calcOVR()}</div><div class="ovr-label">OVR</div></div></div><div class="stat-strip"><div class="mini"><b>${p.age}</b><span>Age</span></div><div class="mini"><b>${p.potential}</b><span>Potential</span></div><div class="mini"><b>${p.positionRole}</b><span>Role</span></div><div class="mini"><b>${money(p.money)}</b><span>Money</span></div><div class="mini"><b>${p.academics}</b><span>Academics</span></div><div class="mini"><b>${p.workEthic}</b><span>Work Ethic</span></div></div></div><div class="card" style="margin-top:13px"><div class="plan-top"><div><div class="eyebrow">Current Plan</div><h2>${plan?`${plan.icon} ${plan.name}`:'Not Selected'}</h2></div>${trainingWindowNeeded()?`<button class="btn small" onclick="openTrainingPlanModal()">Choose</button>`:`<span class="pill">Locked until next window</span>`}</div><p class="muted tiny">${plan?plan.desc:'Select a plan from the Home screen.'}</p></div></div><div><div class="card"><h3>Player State</h3>${meter('Energy',p.energy,p.energy<35?'bad':'')}${meter('Health',p.health,p.health<55?'bad':'')}${meter('Confidence',p.confidence,p.confidence<40?'warn':'')}${meter('Coach Trust',p.coachTrust)}${meter('Team Chemistry',p.chemistry)}${meter('Reputation',p.reputation,'purple')}</div></div></div><div class="section-title"><h2>Attributes</h2><span>100 development XP raises an attribute</span></div><div class="attr-grid">${attrs.map(a=>`<div class="attr"><div class="attr-top"><span>${ATTR_LABELS[a]}</span><b>${p.attrs[a]}</b></div><div class="meter ${plan?.major.includes(a)?'purple':''}"><i style="width:${p.xp[a]||0}%"></i></div><div class="xp-line">${p.xp[a]||0}/100 XP ${plan?.major.includes(a)?'· Major focus':plan?.minor.includes(a)?'· Secondary focus':plan?.slow.includes(a)?'· Reduced focus':''}</div></div>`).join('')}</div>`}

function renderStats(){const s=state.season.stats,c=state.career.careerStats;$('#statsTab').innerHTML=`<div class="section-title"><h2>${state.season.grade} Statistics</h2><span>${state.season.phase}</span></div>${isHitter()?statsHittingCard(s.hitting,'Current Season'):''}${isPitcher()||isTwoWay()?`<div style="margin-top:13px">${statsPitchingCard(s.pitching,'Current Season')}</div>`:''}<div class="section-title"><h2>Career Totals</h2><span>${state.career.seasons.length} completed seasons</span></div>${isHitter()?statsHittingCard(c.hitting,'High School Career'):''}${isPitcher()||isTwoWay()?`<div style="margin-top:13px">${statsPitchingCard(c.pitching,'High School Career')}</div>`:''}<div class="section-title"><h2>Game Log</h2><span>${state.season.gameLog.length} games</span></div><div class="card"><div class="table-wrap"><table><thead><tr><th>Game</th><th>Opponent</th><th>Result</th><th>Stat Line</th></tr></thead><tbody>${state.season.gameLog.map(g=>`<tr><td>${g.phase==='Playoffs'?'PO ':''}${g.gameNo}</td><td>${g.home?'vs.':'at'} ${g.opponent}</td><td>${g.win?'W':'L'} ${g.score}</td><td>${g.line}</td></tr>`).join('')||'<tr><td colspan="4">No games played yet.</td></tr>'}</tbody></table></div></div><div class="section-title"><h2>Records</h2></div><div class="record-grid"><div class="record"><b>${fmt3(state.career.records.bestAvg)}</b><span>Best season AVG</span></div><div class="record"><b>${state.career.records.mostHR}</b><span>Most HR in a season</span></div><div class="record"><b>${state.career.records.mostRBI}</b><span>Most RBI in a season</span></div><div class="record"><b>${state.career.records.mostK}</b><span>Most K in a season</span></div><div class="record"><b>${state.career.records.schoolHits}</b><span>Career hits</span></div><div class="record"><b>${state.career.records.schoolHR}</b><span>Career home runs</span></div></div>`}
function statsHittingCard(h,title){return `<div class="card"><h3>${title} · Hitting</h3><div class="table-wrap"><table><thead><tr><th>G</th><th>PA</th><th>AB</th><th>H</th><th>2B</th><th>3B</th><th>HR</th><th>RBI</th><th>BB</th><th>SO</th><th>SB</th><th>AVG</th><th>OBP</th><th>SLG</th><th>OPS</th></tr></thead><tbody><tr><td>${h.g}</td><td>${h.pa}</td><td>${h.ab}</td><td>${h.h}</td><td>${h.d2}</td><td>${h.d3}</td><td>${h.hr}</td><td>${h.rbi}</td><td>${h.bb}</td><td>${h.so}</td><td>${h.sb}</td><td>${fmt3(h.avg)}</td><td>${fmt3(h.obp)}</td><td>${fmt3(h.slg)}</td><td>${fmt3(h.ops)}</td></tr></tbody></table></div></div>`}
function statsPitchingCard(p,title){return `<div class="card"><h3>${title} · Pitching</h3><div class="table-wrap"><table><thead><tr><th>G</th><th>GS</th><th>W</th><th>L</th><th>SV</th><th>IP</th><th>ERA</th><th>WHIP</th><th>H</th><th>ER</th><th>BB</th><th>K</th><th>HR</th></tr></thead><tbody><tr><td>${p.g}</td><td>${p.gs}</td><td>${p.w}</td><td>${p.l}</td><td>${p.sv}</td><td>${innings(p.outs)}</td><td>${p.era.toFixed(2)}</td><td>${p.whip.toFixed(2)}</td><td>${p.h}</td><td>${p.er}</td><td>${p.bb}</td><td>${p.k}</td><td>${p.hr}</td></tr></tbody></table></div></div>`}

function renderRecruiting(){const inbox=state.career.inbox,offers=state.world.colleges.filter(c=>c.offer).sort((a,b)=>b.interest-a.interest);const tracking=state.world.colleges.filter(c=>c.interest>0&&!c.offer).sort((a,b)=>b.interest-a.interest).slice(0,8);$('#recruitTab').innerHTML=`<div class="section-title"><h2>Recruiting Center</h2><span>${unresolvedInbox().length} actions needed</span></div>${unresolvedInbox().length?`<div class="card action-hero"><div class="action-label">Needs Your Attention</div><div class="action-title">★ ${unresolvedInbox()[0].title}</div><p class="action-copy">${unresolvedInbox()[0].text}</p><button class="btn warn primary-action" onclick="openRecruitingItem(${unresolvedInbox()[0].id})">Respond Now</button></div>`:''}<div class="grid two" style="margin-top:13px"><div><div class="card"><h3>Inbox</h3>${inbox.slice(0,12).map(i=>`<div class="news"><div class="news-icon">${i.resolved?'✓':'★'}</div><div style="flex:1"><b>${i.title}</b><p>${i.resolved?`Response: ${i.result}`:i.text}</p></div>${i.resolved?`<span class="pill good">Done</span>`:`<button class="btn small warn" onclick="openRecruitingItem(${i.id})">Open</button>`}</div>`).join('')||'<p class="muted tiny">College messages, camps, and offer decisions will appear here.</p>'}</div></div><div><div class="card"><h3>Recruiting Profile</h3>${meter('National Attention',state.player.scoutInterest,'warn')}${meter('Reputation',state.player.reputation,'purple')}${meter('Academics',state.player.academics)}<p class="muted tiny">Grade: ${state.player.grade} · OVR ${calcOVR()} · ${state.player.position}</p></div></div></div><div class="section-title"><h2>Scholarship Offers</h2><span>${offers.length}</span></div>${offers.length?offers.map(c=>offerCard(c,true)).join(''):`<div class="card"><p class="muted tiny">Formal offers become possible as interest rises, especially from sophomore year onward.</p></div>`}<div class="section-title"><h2>Programs Tracking You</h2><span>${tracking.length}</span></div><div class="grid two">${tracking.map(c=>offerCard(c,false)).join('')||'<div class="card"><p class="muted tiny">Strong games, showcases, academics, and responses will put programs on the board.</p></div>'}</div>`}
function offerCard(c,offer){return `<div class="offer"><div class="offer-top"><div><h3>${c.name}</h3><p>${c.region} · ${c.coach}</p></div><span class="pill ${offer?'good':'purple'}">${offer?`${c.scholarship}% offer`:c.status}</span></div><div class="offer-metrics"><div><b>${c.interest}</b><span>Interest</span></div><div><b>${c.development}</b><span>Development</span></div><div><b>${c.playingTime}</b><span>Playing Time</span></div><div><b>${c.academics}</b><span>Academics</span></div></div>${offer&&state.settings.nil!=='off'?`<p>Projected NIL: ${money(projectedNIL(c))}</p>`:''}</div>`}

function renderHistory(){const filter=state.ui.historyFilter||'all';const items=state.career.history.filter(x=>filter==='all'||x.type===filter);const types=[['all','Everything'],['milestone','Milestones'],['season','Seasons'],['decision','Choices'],['training','Training'],['offseason','Offseason'],['recruiting','Recruiting'],['offer','Offers'],['award','Awards'],['injury','Injuries'],['playoffs','Playoffs'],['championship','Titles'],['development','Development']];$('#historyTab').innerHTML=`<div class="section-title"><h2>Career History</h2><span>${state.career.history.length} notable entries</span></div><div class="card"><label>Filter History</label><select onchange="setHistoryFilter(this.value)">${types.map(([v,l])=>`<option value="${v}" ${filter===v?'selected':''}>${l}</option>`).join('')}</select></div><div class="grid two" style="margin-top:13px"><div><div class="card"><h3>Career Timeline</h3><div class="timeline">${items.slice(0,80).map(i=>`<div class="timeline-item"><time>${i.dateLabel}</time><b>${i.title}</b><p>${i.text}</p></div>`).join('')||'<p class="muted tiny">No entries match this filter.</p>'}</div></div></div><div><div class="card"><h3>Season Archive</h3>${state.career.seasons.slice().reverse().map(s=>`<div class="news"><div class="news-icon">${GRADE_SHORT[GRADES.indexOf(s.grade)]}</div><div><b>${s.grade} · ${s.teamWins}-${s.teamLosses}</b><p>${seasonStatSummary(s.stats)} ${s.awards.length?`Awards: ${s.awards.join(', ')}.`:''}</p></div></div>`).join('')||'<p class="muted tiny">Completed seasons will remain here permanently.</p>'}</div><div class="card" style="margin-top:13px"><h3>Awards & Achievements</h3>${state.career.awards.map(a=>`<div class="news"><div class="news-icon">🏆</div><div><b>${a.name}</b><p>${a.grade}</p></div></div>`).join('')||'<p class="muted tiny">No awards yet.</p>'}</div>${state.career.graduationDecision?`<div class="card" style="margin-top:13px"><div class="eyebrow">High School Decision</div><h3>${state.career.graduationDecision.title}</h3><p class="muted tiny">${state.career.graduationDecision.text}</p></div>`:''}</div></div>`}
function setHistoryFilter(v){state.ui.historyFilter=v;saveGame(true);renderHistory()}

function renderMore(){const teams=state.world.teams.slice().sort((a,b)=>{if(a.name===state.player.school)return-1;if(b.name===state.player.school)return 1;return b.rating-a.rating}).slice(0,10);$('#moreTab').innerHTML=`<div class="section-title"><h2>World & Settings</h2><span>Simulation control</span></div><div class="grid two"><div><div class="card"><h3>State Baseball World</h3>${teams.map((t,i)=>`<div class="news"><div class="news-icon">${i+1}</div><div><b>${t.name}</b><p>Program rating ${t.rating}${t.name===state.player.school?' · Your team':''}</p></div></div>`).join('')}</div><div class="card" style="margin-top:13px"><h3>Players to Watch</h3>${state.world.rivals.slice().sort((a,b)=>b.ovr-a.ovr).slice(0,7).map(x=>`<div class="news"><div class="news-icon">${x.position}</div><div style="flex:1"><b>${x.name}</b><p>${x.school} · ${GRADES[x.gradeIndex]}</p></div><span class="pill">${x.ovr} OVR</span></div>`).join('')}</div></div><div><div class="card"><h3>Career Settings</h3>${selectSetting('Progression Speed','progression',[['slow','Slow'],['realistic','Realistic'],['fast','Fast'],['veryFast','Very Fast']],'Controls attribute-development gains.')}${selectSetting('Career Difficulty','difficulty',[['relaxed','Relaxed'],['standard','Standard'],['challenging','Challenging'],['unforgiving','Unforgiving']],'Affects opponent strength and performance pressure.')}${selectSetting('Negotiation Difficulty','negotiation',[['easy','Easy'],['standard','Standard'],['realistic','Realistic'],['hard','Hard']],'Used for draft, NIL, and contract negotiations.')}${selectSetting('NIL System','nil',[['off','Off'],['simplified','Simplified'],['realistic','Realistic'],['expanded','Expanded']],'Controls college NIL depth and projected value.')}${selectSetting('Injuries','injuries',[['off','Off'],['reduced','Reduced'],['realistic','Realistic'],['harsh','Harsh']],'Controls injury frequency and impact.')}${selectSetting('Potential Visibility','potential',[['hidden','Hidden'],['partial','Partially Scouted'],['visible','Fully Visible']],'Changes what you can see about the player ceiling.')}</div><div class="card" style="margin-top:13px"><h3>Interface & Simulation</h3>${selectSetting('Game Detail','simDetail',[['instant','Instant'],['key','Key Moments'],['full','Detailed Recap']],'Controls future game presentation depth.')}${selectSetting('Popup Frequency','popupFrequency',[['rare','Rare'],['normal','Normal'],['frequent','Frequent']],'Controls sporadic coach and scout popups.')}${selectSetting('Weekly Recap','weeklyRecap',[['compact','Compact'],['standard','Standard'],['detailed','Detailed']],'Controls recap detail.')}${toggleSetting('autoMinor','Auto-resolve minor events','Keeps routine non-decisions out of the way.')}${toggleSetting('autoRecovery','Auto-manage recovery','Adds recovery when energy or health becomes dangerous.')}${toggleSetting('confirmAdvance','Confirm before advancing','Adds a confirmation before moving to the next week.')}${toggleSetting('reducedMotion','Reduced motion','Turns off smooth scrolling and animation.')}</div><div class="card" style="margin-top:13px"><h3>Save Tools</h3><div class="actions"><button class="btn small secondary" onclick="manualSave()">Save Now</button><button class="btn small secondary" onclick="exportSave()">Export Save</button><button class="btn small secondary" onclick="document.getElementById('importFile').click()">Import Save</button><input id="importFile" type="file" accept="application/json" class="hidden" onchange="importSave(event)"><button class="btn small bad" onclick="deleteActiveCareer()">Delete Career</button></div><p class="muted tiny" style="margin-bottom:0">Active slot: ${activeSlot+1}. Saves stay in this browser unless exported.</p></div></div></div>`}
function selectSetting(label,key,options,desc){return `<div style="padding:8px 0;border-bottom:1px solid rgba(35,59,83,.65)"><label>${label}</label><select onchange="changeSetting('${key}',this.value)">${options.map(([v,l])=>`<option value="${v}" ${state.settings[key]===v?'selected':''}>${l}</option>`).join('')}</select><p class="muted tiny" style="margin:5px 0 0">${desc}</p></div>`}
function toggleSetting(key,label,desc){return `<div class="toggle-row"><div><b>${label}</b><p>${desc}</p></div><label class="switch"><input type="checkbox" ${state.settings[key]?'checked':''} onchange="changeSetting('${key}',this.checked)"><span class="slider"></span></label></div>`}
function changeSetting(key,value){state.settings[key]=value;if(key==='potential')state.player.potential=potentialLabel(state.player.potentialCap,value);saveGame(true);renderAll();toast('Setting updated')}
function applyInterfaceSettings(){document.body.classList.toggle('reduce-motion',!!state.settings.reducedMotion);document.documentElement.style.setProperty('--font-scale',state.settings.textSize==='large'?'1.1':state.settings.textSize==='small'?'.94':'1')}

function renderStart(){const slots=loadSlots();let legacy=hasLegacySave();$('#startScreen').innerHTML=`<div class="start-logo"><span class="version">VERSION ${VERSION}</span><h1>Diamond<br>Legacy</h1><p>Every career tells a different story.</p></div>${legacy?`<div class="card action-hero" style="margin-bottom:13px"><div class="action-label">Older Save Found</div><div class="action-title">Import your v0.3 career</div><p class="action-copy">The new save system uses three career slots. Importing creates a compatible v0.4 career where possible.</p><button class="btn block" onclick="importLegacy()">Import Legacy Save</button></div>`:''}<div class="grid three">${slots.map((s,i)=>`<div class="save-slot ${i===Number(localStorage.getItem(ACTIVE_KEY)||0)?'active':''}">${s?`<div class="eyebrow">Slot ${i+1}</div><h3>${s.player?.name||'Career'}</h3><p>${s.player?.grade||'Freshman'} · ${s.player?.position||'—'} · ${s.player?.school||'—'}<br>${s.season?.teamWins||0}-${s.season?.teamLosses||0} · ${s.player?calcStoredOVR(s.player):'—'} OVR</p><div class="slot-actions"><button class="btn small" onclick="loadCareer(${i})">Continue</button><button class="btn small secondary" onclick="duplicateCareer(${i})">Copy</button><button class="btn small bad" onclick="deleteSlot(${i})">Delete</button></div>`:`<div class="eyebrow">Slot ${i+1}</div><h3>Empty Career Slot</h3><p>Start at age 15 as a varsity freshman starter.</p><button class="btn block" onclick="openCreateCareer(${i})">New Career</button>`}</div>`).join('')}</div><div class="card" style="margin-top:13px"><h3>What v0.4 Adds</h3><p class="muted tiny">Automatic training plans · One scenario at most per week · Two games per week · 24-game seasons and playoffs · Offseason AAU and development choices · Full recruiting and NIL settings · Permanent history · Three save slots.</p></div>`}
function calcStoredOVR(p){const old=state;state={player:p};const v=calcOVR(p);state=old;return v}
function openCreateCareer(slot){activeSlot=slot;openModal(`<div class="eyebrow">New Career · Slot ${slot+1}</div><h2>Create Your Player</h2><div class="form-row"><div><label>Player Name</label><input id="newName" value="Thomas Schreiner"></div><div><label>Hometown</label><input id="newHome" value="New Jersey"></div></div><div class="form-row"><div><label>High School</label><input id="newSchool" value="${randomSchool()}"></div><div><label>Primary Position</label><select id="newPos">${POSITIONS.map(x=>`<option>${x}</option>`).join('')}</select></div></div><div class="form-row"><div><label>Secondary Position</label><select id="newSecondary"><option value="">None</option>${POSITIONS.filter(x=>x!=='TWP').map(x=>`<option>${x}</option>`).join('')}</select></div><div><label>Archetype</label><select id="newArch"><option value="balanced">Balanced</option><option value="spark">Spark Plug</option><option value="contact">Contact</option><option value="power">Power</option><option value="defense">Defense</option><option value="velocity">Velocity</option><option value="command">Command</option><option value="twoWay">Two-Way</option></select></div></div><div class="form-row"><div><label>Bats</label><select id="newBats"><option value="R">Right</option><option value="L">Left</option><option value="S">Switch</option></select></div><div><label>Throws</label><select id="newThrows"><option value="R">Right</option><option value="L">Left</option></select></div></div><div class="form-row"><div><label>Height</label><input id="newHeight" value="5'10\""></div><div><label>Weight</label><input id="newWeight" type="number" value="155"></div></div><div class="grid two"><div><label>Progression</label><select id="newProgress"><option value="realistic">Realistic</option><option value="fast">Fast</option><option value="veryFast">Very Fast</option><option value="slow">Slow</option></select></div><div><label>Difficulty</label><select id="newDifficulty"><option value="standard">Standard</option><option value="relaxed">Relaxed</option><option value="challenging">Challenging</option><option value="unforgiving">Unforgiving</option></select></div></div><button class="btn good block" style="margin-top:13px" onclick="submitNewCareer()">Begin Varsity Career</button><button class="btn secondary block" style="margin-top:8px" onclick="closeModal()">Cancel</button>`)}
function submitNewCareer(){const form={name:$('#newName').value.trim(),hometown:$('#newHome').value.trim(),school:$('#newSchool').value.trim(),position:$('#newPos').value,secondary:$('#newSecondary').value,archetype:$('#newArch').value,bats:$('#newBats').value,throws:$('#newThrows').value,height:$('#newHeight').value.trim(),weight:$('#newWeight').value,settings:{progression:$('#newProgress').value,difficulty:$('#newDifficulty').value}};closeModal();createCareer(form)}
function saveGame(silent=false){if(!state)return;state.version=VERSION;const slots=loadSlots();slots[activeSlot]=deepClone(state);saveSlots(slots);localStorage.setItem(ACTIVE_KEY,String(activeSlot));if(!silent)toast('Career saved')}
function manualSave(){saveGame(false)}
function loadCareer(slot){const s=loadSlots()[slot];if(!s)return;activeSlot=slot;state=migrateState(s);localStorage.setItem(ACTIVE_KEY,String(slot));enterGame();toast('Career loaded')}
function duplicateCareer(slot){const slots=loadSlots();const empty=slots.findIndex(x=>!x);if(empty<0)return toast('No empty slot available');slots[empty]=deepClone(slots[slot]);slots[empty].career.id=uid();saveSlots(slots);renderStart();toast(`Copied to slot ${empty+1}`)}
function deleteSlot(slot){confirmModal('Delete Career?',`This permanently removes slot ${slot+1} from this browser.`,()=>{const slots=loadSlots();slots[slot]=null;saveSlots(slots);renderStart()})}
function deleteActiveCareer(){confirmModal('Delete This Career?',`Delete ${state.player.name} from slot ${activeSlot+1}?`,()=>{const slots=loadSlots();slots[activeSlot]=null;saveSlots(slots);state=null;returnToSlots()})}
function returnToSlots(){saveGame(true);state=null;$('#gameShell').classList.add('hidden');$('#startScreen').classList.remove('hidden');renderStart();window.scrollTo(0,0)}
function enterGame(){state=migrateState(state);$('#startScreen').classList.add('hidden');$('#gameShell').classList.remove('hidden');currentTab='home';switchTab('home');setTimeout(()=>{if(trainingWindowNeeded())openTrainingPlanModal()},250)}
function migrateState(s){if(!s.settings)s.settings=defaultSettings();else s.settings={...defaultSettings(),...s.settings};if(!s.ui)s.ui={lastPopupKey:'',historyFilter:'all'};if(!s.career.history)s.career.history=[];if(!s.career.inbox)s.career.inbox=[];if(!s.career.scenarioSeen)s.career.scenarioSeen={};if(!s.career.careerStats)s.career.careerStats=emptySeasonStats();if(!s.career.records)s.career.records={bestAvg:0,mostHR:0,mostRBI:0,mostK:0,bestERA:99,schoolHits:0,schoolHR:0,schoolRBI:0,schoolK:0};if(!s.player.xp)s.player.xp=xpMap();if(!s.player.attrs){s.player.attrs=baseAttributes(s.player.position||'SS','balanced')}ALL_ATTRS.forEach(a=>{if(s.player.attrs[a]===undefined)s.player.attrs[a]=r(35,50);if(s.player.xp[a]===undefined)s.player.xp[a]=0});if(!s.player.potentialCap)s.player.potentialCap=potentialCap();s.player.potential=potentialLabel(s.player.potentialCap,s.settings.potential);if(!s.season||!s.season.schedule){state=s;startSeason(true);s=state}if(!s.week)s.week={scenario:null,scenarioResolved:true,scenarioQuiet:true,gamesPlayed:0,recapViewed:false,trainingApplied:false,generated:true};s.version=VERSION;return s}
function importLegacy(){let raw=null;for(const k of LEGACY_KEYS){raw=localStorage.getItem(k);if(raw)break}if(!raw)return toast('No legacy save found');const slots=loadSlots();const empty=slots.findIndex(x=>!x);if(empty<0)return toast('Delete or export a slot first');try{let legacy=JSON.parse(raw);legacy=migrateLegacy(legacy);slots[empty]=legacy;saveSlots(slots);renderStart();toast(`Imported into slot ${empty+1}`)}catch(e){toast('Legacy save could not be imported')}}
function migrateLegacy(old){
  const form={name:old.player?.name||'Thomas Schreiner',hometown:old.player?.hometown||'New Jersey',school:old.player?.school||randomSchool(),position:old.player?.position||'SS',secondary:old.player?.secondary||'',archetype:'balanced',bats:old.player?.bats||'R',throws:old.player?.throws||'R',height:old.player?.height||"5'10\"",weight:old.player?.weight||155,settings:defaultSettings()};
  const n=buildCareerState(form);
  const previous=state;
  state=n;
  if(old.player){['energy','health','confidence','coachTrust','chemistry','scoutInterest','money','hot','cold'].forEach(k=>{if(old.player[k]!==undefined)n.player[k]=old.player[k]})}
  addHistory('milestone','Legacy Save Imported','Career imported from Diamond Legacy v0.3 into the v0.4 high-school structure.');
  state=previous;
  return n;
}
function exportSave(){const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=`diamond-legacy-${slug(state.player.name)}-slot-${activeSlot+1}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('Save exported')}
function importSave(event){const file=event.target.files[0];if(!file)return;const reader=new FileReader();reader.onload=()=>{try{const incoming=migrateState(JSON.parse(reader.result));state=incoming;saveGame(true);renderAll();toast('Save imported')}catch(e){toast('Invalid save file')}};reader.readAsText(file)}

renderStart();
</script>
</body>
</html>
